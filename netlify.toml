# Never deploy the working folder. Only the verified media build is public.
[build]
  command = "ruby scripts/build-media-site.rb"
  publish = ".media-public"

# Allow the tutorial builder and exported tutorial pages to load hosted media
# from another origin. The browser requires this before a remote image or video
# can be included in an exported PNG canvas.

[[headers]]
  for = "/images/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/tutorials/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/tutorials/catalog.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Type = "application/json; charset=UTF-8"

[[headers]]
  for = "/gifs/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/video/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/shapes.csv"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Type = "text/csv; charset=UTF-8"

# Test pages are public by URL but intentionally absent from search results.
[[headers]]
  for = "/test-folder/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Download annotations fetch binary files from exported players on other sites.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Disposition = "attachment"

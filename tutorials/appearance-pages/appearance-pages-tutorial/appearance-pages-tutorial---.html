      async function exportStagePng() {
        try {
          const exportState = buildExportState();
          const slides = exportState.tutorial.slides || [];
          if (!slides.length) {
            throw new Error('There are no slides to export.');
          }

          const baseTitle = slugify(exportState.tutorial.title || state.tutorial.title || 'tutorial');
          for (let index = 0; index < slides.length; index += 1) {
            const slide = slides[index];
            const [aspectWidth, aspectHeight] = parseAspectRatio(slide.media.aspect);
            const canvasWidth = 1600;
            const canvasHeight = Math.round(canvasWidth * (aspectHeight / aspectWidth));
            const canvas = document.createElement('canvas');
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            const context = canvas.getContext('2d');
            if (!context) {
              throw new Error('Canvas could not be created.');
            }

            await drawSlideToCanvas(context, slide, canvasWidth, canvasHeight);
            const blob = await canvasToBlob(canvas, 'image/png');
            const label = slide.kind === 'cover'
              ? 'cover'
              : `slide-${String(index + 1).padStart(2, '0')}`;
            const slideTitle = slugify(slide.title || label);
            downloadBlob(`${baseTitle}-${label}-${slideTitle}.png`, blob);
            await wait(140);
          }

          setStatus(`Downloaded ${slides.length} PNG file${slides.length === 1 ? '' : 's'} from the builder.`);
          render();
        } catch (error) {
          console.warn('PNG export failed.', error);
          setStatus('PNG export failed. Some media hosts block image export because they do not allow cross-origin downloads.');
          render();
        }
      }

      function exportPlayerHtml() {
        const exportState = buildExportState();
        const html = serializeDocumentHtml('player', exportState);
        downloadTextFile(exportPlayerFileName(), html);
        setStatus('Exported standalone tutorial HTML.');
        render();
      }

      function buildBuilderState() {
        const builderState = cloneForHistory(state);
        builderState.ui.contentsOpen = false;
        builderState.ui.videoModal = null;
        builderState.ui.selectedKind = null;
        builderState.ui.selectedId = null;
        builderState.ui.slideIndex = 0;
        const firstSlide = builderState.tutorial.slides[0];
        builderState.ui.activeHotspotId = firstSlide?.hotspotsEnabled
          ? firstLiteralHotspotId(firstSlide)
          : null;
        return normalizeState(builderState, { enforceCover: true });
      }

      function buildExportState() {
        const exportState = cloneForHistory(state);
        exportState.ui.contentsOpen = false;
        exportState.ui.videoModal = null;
        exportState.ui.selectedKind = null;
        exportState.ui.selectedId = null;
        if (exportState.meta.omitCoverOnExport && exportState.tutorial.slides.length > 1) {
          exportState.tutorial.slides = exportState.tutorial.slides.slice(1);
          exportState.ui.slideIndex = 0;
        } else {
          exportState.ui.slideIndex = 0;
        }
        const firstSlide = exportState.tutorial.slides[0];
        exportState.ui.activeHotspotId = firstSlide?.hotspotsEnabled
          ? firstLiteralHotspotId(firstSlide)
          : null;
        return normalizeState(exportState, { enforceCover: !exportState.meta.omitCoverOnExport });
      }

      function serializeDocumentHtml(mode, exportState) {
        const clone = document.documentElement.cloneNode(true);
        const body = clone.querySelector('body');
        if (body) {
          body.dataset.mode = mode;
        }

        const app = clone.querySelector('#app');
        if (app) {
          app.innerHTML = '';
        }

        const stateScript = clone.querySelector('#project-state');
        if (stateScript) {
          stateScript.textContent = safeJson(exportState);
        }

        clone.querySelectorAll('[data-ephemeral]').forEach((element) => element.remove());
        if (mode === 'player') {
          const navigation = clone.ownerDocument.createElement('script');
          navigation.src = '../../site-lib/learn-navigation.js';
          navigation.defer = true;
          body?.append(navigation);
        }
        return `<!DOCTYPE html>\n${clone.outerHTML}`;
      }

      async function connectTutorialCatalog() {
        if (typeof window.showOpenFilePicker !== 'function') {
          setStatus('Catalog connection requires Chrome or Edge.');
          return;
        }
        [tutorialCatalogFileHandle] = await window.showOpenFilePicker({
          types: [{ description: 'Tutorial catalog', accept: { 'application/json': ['.json'] } }]
        });
        setStatus('Tutorial catalog connected.');
        render();
      }

      function tutorialCatalogEntry() {
        const folderParts = selectedTutorialFolderSlug().split('/');
        const category = normalizeTutorialFolderPath(`${state.meta.category || folderParts[0] || 'learn'}/placeholder`).split('/')[0];
        const filename = String(state.meta.filename || `${folderParts[1] || 'tutorial'}.html`).replace(/^\/+/, '');
        const id = slugify(filename.replace(/\.html$/i, ''));
        return {
          id,
          tutorialTitle: state.tutorial.title || state.meta.cardName || titleFromSlug(id),
          navigationName: state.meta.navigationName || state.meta.cardName || titleFromSlug(id),
          cardName: state.meta.cardName || state.meta.navigationName || titleFromSlug(id),
          filename,
          category,
          summary: state.meta.summary || '',
          popupDescription: state.meta.popupDescription || state.meta.summary || '',
          order: Number(state.meta.order || 10),
          status: state.meta.publishStatus === 'published' ? 'published' : 'draft',
          publicUrl: tutorialPublicUrl(),
          path: `${category}/${filename}`
        };
      }

      async function saveTutorialListing() {
        if (!tutorialCatalogFileHandle) await connectTutorialCatalog();
        if (!tutorialCatalogFileHandle) return;
        const file = await tutorialCatalogFileHandle.getFile();
        const catalog = JSON.parse(await file.text());
        catalog.categories = Array.isArray(catalog.categories) ? catalog.categories : [];
        catalog.tutorials = Array.isArray(catalog.tutorials) ? catalog.tutorials : [];
        const entry = tutorialCatalogEntry();
        if (!catalog.categories.some((item) => item.slug === entry.category)) {
          catalog.categories.push({ slug: entry.category, name: titleFromSlug(entry.category), summary: '', order: (catalog.categories.length + 1) * 10, status: 'published' });
        }
        const index = catalog.tutorials.findIndex((item) => item.id === entry.id);
        if (index >= 0) catalog.tutorials[index] = { ...catalog.tutorials[index], ...entry };
        else catalog.tutorials.push(entry);
        const writable = await tutorialCatalogFileHandle.createWritable();
        await writable.write(`${JSON.stringify(catalog, null, 2)}\n`);
        await writable.close();
        state.meta.publicUrl = entry.publicUrl;
        state.meta.shareUrl = entry.publicUrl;
        commit(`Saved ${entry.navigationName} to the tutorial catalog.`);
      }

      async function writeHtmlToHandle(handle, html) {
        const writable = await handle.createWritable();
        await writable.write(html);
        await writable.close();
      }

      function downloadTextFile(filename, contents) {
        const blob = new Blob([contents], { type: 'text/html;charset=utf-8' });
        const href = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = href;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(href);
      }

      function currentFileName() {
        const last = location.pathname.split('/').pop();
        if (last && last.endsWith('.html')) {
          return last;
        }
        return `${slugify(state.tutorial.title || 'tutorial')}-builder.html`;
      }

      function exportPlayerFileName() {
        const fromShareUrl = tutorialFileNameFromShareUrl();
        if (fromShareUrl) {
          return fromShareUrl;
        }
        return `${slugify(state.tutorial.title || 'tutorial')}.html`;
      }

      function tutorialFileNameFromShareUrl() {
        const raw = String(state.meta.shareUrl || '').trim();
        if (!raw) {
          return '';
        }
        try {
          const parsed = new URL(raw, location.href);
          const lastSegment = parsed.pathname.split('/').filter(Boolean).pop() || '';
          if (!lastSegment) {
            return '';
          }
          return lastSegment.endsWith('.html') ? lastSegment : `${lastSegment}.html`;
        } catch (error) {
          return '';
        }
      }

      function downloadBlob(filename, blob) {
        const href = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = href;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(href);
      }

      async function pickProjectFileHandle() {
        return window.showSaveFilePicker({
          suggestedName: currentFileName(),
          types: [
            {
              description: 'HTML Files',
              accept: { 'text/html': ['.html'] }
            }
          ]
        });
      }

      function wait(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      }

      async function drawSlideToCanvas(context, slide, canvasWidth, canvasHeight) {
        context.clearRect(0, 0, canvasWidth, canvasHeight);
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, canvasWidth, canvasHeight);

        const frame = {
          width: Math.min(canvasWidth * 0.96, canvasWidth - 18),
          height: Math.min(canvasHeight * 0.94, canvasHeight - 18)
        };
        frame.x = (canvasWidth - frame.width) / 2;
        frame.y = (canvasHeight - frame.height) / 2;

        context.fillStyle = '#ffffff';
        context.fillRect(frame.x, frame.y, frame.width, frame.height);
        context.lineWidth = 4;
        context.strokeStyle = '#000000';
        context.strokeRect(frame.x, frame.y, frame.width, frame.height);
        context.fillStyle = slide.media.matte || '#ffffff';
        context.fillRect(frame.x + 2, frame.y + 2, frame.width - 4, frame.height - 4);

        await drawMediaOnCanvas(context, slide, frame);

        const annotations = [...slide.annotations].sort((left, right) => left.z - right.z);
        for (const annotation of annotations) {
          await drawAnnotationOnCanvas(context, annotation, canvasWidth, canvasHeight);
        }

        if (slide.hotspotsEnabled) {
          drawHotspotsOnCanvas(context, slide, canvasWidth, canvasHeight);
        }
      }

      async function drawMediaOnCanvas(context, slide, frame) {
          const url = normalizeAssetUrl(slide.media.url, slideMediaAssetType(slide));
        if (!url) {
          return;
        }

        if (slide.kind === 'video') {
          const stageVideo = root.querySelector('.media-asset');
          if (stageVideo && stageVideo.tagName === 'VIDEO' && stageVideo.readyState >= 2) {
            drawFittedAsset(context, stageVideo, frame, slide.media.fit, slide.media.scale, slide.media.xOffset, slide.media.yOffset);
            return;
          }
          drawStagePlaceholder(context, frame, 'video / embed box');
          return;
        }

        const rendered = await loadRenderableImage(url);
        try {
          drawFittedAsset(context, rendered.image, frame, slide.media.fit, slide.media.scale, slide.media.xOffset, slide.media.yOffset);
        } finally {
          rendered.revoke?.();
        }
      }

      async function drawAnnotationOnCanvas(context, annotation, canvasWidth, canvasHeight) {
        const rect = stageRectForObject(annotation, canvasWidth, canvasHeight);
        context.save();
        context.translate(rect.cx, rect.cy);
        context.rotate((annotation.rotation || 0) * (Math.PI / 180));
        context.globalAlpha = annotation.opacity ?? 1;

        if (annotation.type === 'text') {
          drawTextAnnotation(context, annotation, rect);
          context.restore();
          return;
        }

        if (annotation.type === 'audio') {
          await drawAudioAnnotation(context, annotation, rect);
          context.restore();
          return;
        }

        if (annotation.type === 'image' && isMarkupAnnotation(annotation)) {
          drawMarkupAnnotationToCanvas(context, annotation, rect);
          context.restore();
          return;
        }

        if (annotation.type === 'video' || annotation.type === 'link' || annotation.type === 'image') {
          const source = normalizeAssetUrl(annotation.src, annotationSourceAssetType(annotation));
          if (source) {
            const rendered = await loadRenderableImage(source);
            try {
              context.save();
              if (annotation.type === 'image' && annotation.flipX) {
                context.scale(-1, 1);
              }
              drawImageWithinRect(context, rendered.image, -rect.width / 2, -rect.height / 2, rect.width, rect.height);
              context.restore();
            } finally {
              rendered.revoke?.();
            }
          }
        }

        context.restore();
      }

      function drawMarkupAnnotationToCanvas(context, annotation, rect) {
        const key = markupKeyForAnnotation(annotation);
        const strokeWidth = Math.max(2, clampNumber(Number(annotation.markupStrokeWidth ?? (isLineMarkupKey(key) ? 2.5 : 4)), 1, 10) * 2);
        context.lineWidth = strokeWidth;
        context.strokeStyle = '#000000';
        context.fillStyle = '#000000';
        context.lineCap = 'round';
        context.lineJoin = 'round';

        if (key === 'x') {
          context.beginPath();
          context.moveTo((-rect.width / 2) + (rect.width * 0.18), (-rect.height / 2) + (rect.height * 0.18));
          context.lineTo((rect.width / 2) - (rect.width * 0.18), (rect.height / 2) - (rect.height * 0.18));
          context.moveTo((rect.width / 2) - (rect.width * 0.18), (-rect.height / 2) + (rect.height * 0.18));
          context.lineTo((-rect.width / 2) + (rect.width * 0.18), (rect.height / 2) - (rect.height * 0.18));
          context.stroke();
          return;
        }

        if (key === 'circle-d') {
          context.setLineDash([18, 12]);
          context.beginPath();
          context.ellipse(0, 0, rect.width * 0.36, rect.height * 0.28, 0, 0, Math.PI * 2);
          context.stroke();
          context.setLineDash([]);
          return;
        }

        if (key === 'square-d') {
          context.setLineDash([18, 12]);
          context.strokeRect((-rect.width / 2) + (rect.width * 0.14), (-rect.height / 2) + (rect.height * 0.14), rect.width * 0.72, rect.height * 0.72);
          context.setLineDash([]);
          return;
        }

        if (key === 'line-d') {
          const start = { x: (-rect.width / 2) + (rect.width * 0.08), y: 0 };
          const bend = normalizeMarkupBend(annotation.bend);
          const control = {
            x: (-rect.width / 2) + ((bend.x / 100) * rect.width),
            y: (-rect.height / 2) + ((bend.y / 100) * rect.height)
          };
          const end = { x: (rect.width / 2) - (rect.width * 0.08), y: 0 };
          context.setLineDash([18, 12]);
          context.beginPath();
          context.moveTo(start.x, start.y);
          context.quadraticCurveTo(control.x, control.y, end.x, end.y);
          context.stroke();
          context.setLineDash([]);
          return;
        }

        if (key === 'arrow-s') {
          const start = { x: (-rect.width / 2) + (rect.width * 0.12), y: 0 };
          const end = { x: (rect.width / 2) - (rect.width * 0.16), y: 0 };
          context.beginPath();
          context.moveTo(start.x, start.y);
          context.lineTo(end.x, end.y);
          context.stroke();
          drawArrowHead(context, end.x, end.y, 0, Math.max(14, strokeWidth * 2.8));
          return;
        }

        if (key === 'arrow-c') {
          const start = { x: (-rect.width / 2) + (rect.width * 0.14), y: (rect.height / 2) - (rect.height * 0.24) };
          const control = { x: (-rect.width / 2) + (rect.width * 0.42), y: (-rect.height / 2) + (rect.height * 0.16) };
          const end = { x: (rect.width / 2) - (rect.width * 0.16), y: (-rect.height / 2) + (rect.height * 0.42) };
          context.beginPath();
          context.moveTo(start.x, start.y);
          context.quadraticCurveTo(control.x, control.y, end.x, end.y);
          context.stroke();
          const angle = Math.atan2(end.y - control.y, end.x - control.x);
          drawArrowHead(context, end.x, end.y, angle, Math.max(14, strokeWidth * 2.8));
        }
      }

      function drawArrowHead(context, x, y, angle, size) {
        context.save();
        context.translate(x, y);
        context.rotate(angle);
        context.beginPath();
        context.moveTo(0, 0);
        context.lineTo(-size, size * 0.48);
        context.lineTo(-size * 0.84, 0);
        context.lineTo(-size, -size * 0.48);
        context.closePath();
        context.fill();
        context.restore();
      }

      function drawHotspotsOnCanvas(context, slide, canvasWidth, canvasHeight) {
        literalHotspots(slide).forEach((hotspot, index) => {
          const rect = stageRectForObject(hotspot, canvasWidth, canvasHeight);
          context.save();
          context.translate(rect.cx, rect.cy);
          context.rotate((hotspot.rotation || 0) * (Math.PI / 180));

          context.fillStyle = hexToRgba(hotspot.color, 0.22);
          context.strokeStyle = hotspot.color;
          context.lineWidth = 6;
          context.shadowColor = hexToRgba(hotspot.color, 0.45);
          context.shadowBlur = 0;
          context.shadowOffsetX = 8;
          context.shadowOffsetY = 8;
          context.fillRect(-rect.width / 2, -rect.height / 2, rect.width, rect.height);
          context.strokeRect(-rect.width / 2, -rect.height / 2, rect.width, rect.height);

          context.shadowColor = 'transparent';
          context.lineWidth = 3;
          context.strokeStyle = hexToRgba(hotspot.color, 0.75);
          context.strokeRect((-rect.width / 2) + 10, (-rect.height / 2) + 10, Math.max(0, rect.width - 20), Math.max(0, rect.height - 20));

          const labelSize = Math.max(28, Math.min(44, rect.width * 0.28));
          const labelX = (-rect.width / 2) + 10;
          const labelY = (-rect.height / 2) + 10;
          context.fillStyle = hotspot.color;
          context.strokeStyle = '#ffffff';
          context.lineWidth = 4;
          context.fillRect(labelX, labelY, labelSize, labelSize);
          context.strokeRect(labelX, labelY, labelSize, labelSize);
          context.fillStyle = '#000000';
          context.font = `700 ${Math.round(labelSize * 0.48)}px ${cssFontValue(getComputedStyle(document.documentElement).getPropertyValue('--body-font'))}`;
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.fillText(String(index + 1), labelX + (labelSize / 2), labelY + (labelSize / 2) + 1);

          context.restore();
        });
      }

      function drawTextAnnotation(context, annotation, rect) {
        const fontFamily = annotation.fontStyle === 'hand'
          ? getComputedStyle(document.documentElement).getPropertyValue('--hand-font')
          : getComputedStyle(document.documentElement).getPropertyValue('--body-font');
        const fontWeight = annotation.fontStyle === 'bold' ? 700 : 500;
        const fontSize = Math.max(18, Math.min(rect.height * (annotation.fontStyle === 'hand' ? 0.62 : 0.55), rect.width * 0.22));
        const lineHeight = fontSize * (annotation.fontStyle === 'hand' ? 1.1 : 1.25);
        context.fillStyle = annotation.color || '#000000';
        context.textAlign = 'left';
        context.textBaseline = 'top';
        context.font = `${fontWeight} ${Math.round(fontSize)}px ${cssFontValue(fontFamily)}`;
        const lines = wrapCanvasText(context, annotation.text || 'new note', rect.width - 10);
        const startX = (-rect.width / 2) + 4;
        let cursorY = (-rect.height / 2) + 4;
        lines.forEach((line) => {
          context.fillText(line, startX, cursorY);
          cursorY += lineHeight;
        });
      }

      async function drawAudioAnnotation(context, annotation, rect) {
        const playIcon = await loadRenderableImage(normalizeAssetUrl('builtin://transport/play'));
        const rewindIcon = await loadRenderableImage(normalizeAssetUrl('builtin://transport/rewind'));
        try {
          const label = String(annotation.label || '').trim();
          if (label) {
            context.fillStyle = '#000000';
            context.font = `700 ${Math.max(16, Math.round(rect.height * 0.16))}px ${cssFontValue(getComputedStyle(document.documentElement).getPropertyValue('--body-font'))}`;
            context.textAlign = 'left';
            context.textBaseline = 'top';
            context.fillText(label.toUpperCase(), (-rect.width / 2) + 4, (-rect.height / 2) + 4);
          }

          const iconSize = Math.min(rect.height * 0.52, rect.width * 0.28);
          const gap = Math.max(10, iconSize * 0.2);
          const startX = (-rect.width / 2) + 4;
          const topY = label ? (-rect.height / 2) + Math.max(24, rect.height * 0.32) : (-rect.height / 2) + 4;
          drawImageWithinRect(context, rewindIcon.image, startX, topY, iconSize, iconSize);
          drawImageWithinRect(context, playIcon.image, startX + iconSize + gap, topY, iconSize, iconSize);
        } finally {
          playIcon.revoke?.();
          rewindIcon.revoke?.();
        }
      }

      function drawStagePlaceholder(context, frame, textValue) {
        context.fillStyle = 'rgba(0, 0, 0, 0.18)';
        context.font = `700 42px ${cssFontValue(getComputedStyle(document.documentElement).getPropertyValue('--body-font'))}`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(String(textValue || '').toUpperCase(), frame.x + (frame.width / 2), frame.y + (frame.height / 2));
      }

      function drawFittedAsset(context, asset, frame, fit, scale = 1, xOffset = 0, yOffset = 0) {
        const naturalWidth = asset.videoWidth || asset.naturalWidth || asset.width || 1;
        const naturalHeight = asset.videoHeight || asset.naturalHeight || asset.height || 1;
        const baseScale = fit === 'cover'
          ? Math.max(frame.width / naturalWidth, frame.height / naturalHeight)
          : Math.min(frame.width / naturalWidth, frame.height / naturalHeight);
        const drawWidth = naturalWidth * baseScale * (scale || 1);
        const drawHeight = naturalHeight * baseScale * (scale || 1);
        const drawX = frame.x + ((frame.width - drawWidth) / 2) + (((xOffset || 0) / 100) * frame.width);
        const drawY = frame.y + ((frame.height - drawHeight) / 2) + (((yOffset || 0) / 100) * frame.height);

        context.save();
        context.beginPath();
        context.rect(frame.x, frame.y, frame.width, frame.height);
        context.clip();
        context.drawImage(asset, drawX, drawY, drawWidth, drawHeight);
        context.restore();
      }

      function drawImageWithinRect(context, asset, x, y, width, height) {
        const naturalWidth = asset.naturalWidth || asset.width || 1;
        const naturalHeight = asset.naturalHeight || asset.height || 1;
        const scale = Math.min(width / naturalWidth, height / naturalHeight);
        const drawWidth = naturalWidth * scale;
        const drawHeight = naturalHeight * scale;
        const drawX = x + ((width - drawWidth) / 2);
        const drawY = y + ((height - drawHeight) / 2);
        context.drawImage(asset, drawX, drawY, drawWidth, drawHeight);
      }

      function stageRectForObject(object, canvasWidth, canvasHeight) {
        return {
          cx: (object.x / 100) * canvasWidth,
          cy: (object.y / 100) * canvasHeight,
          width: (object.w / 100) * canvasWidth,
          height: (object.h / 100) * canvasHeight
        };
      }

      function parseAspectRatio(value) {
        const [width, height] = String(value || '16:9').split(':').map((part) => Number(part));
        if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) {
          return [16, 9];
        }
        return [width, height];
      }

      function wrapCanvasText(context, value, maxWidth) {
        const rawLines = String(value || '').split('\n');
        const lines = [];
        rawLines.forEach((rawLine) => {
          const words = rawLine.split(/\s+/).filter(Boolean);
          if (!words.length) {
            lines.push('');
            return;
          }
          let currentLine = words.shift();
          words.forEach((word) => {
            const next = `${currentLine} ${word}`;
            if (context.measureText(next).width <= maxWidth) {
              currentLine = next;
            } else {
              lines.push(currentLine);
              currentLine = word;
            }
          });
          lines.push(currentLine);
        });
        return lines;
      }

      async function loadRenderableImage(url) {
        const value = previewAssetUrl(normalizeAssetUrl(url));
        if (!value) {
          throw new Error('No image URL was provided.');
        }

        try {
          const response = await fetch(value, { mode: 'cors' });
          if (!response.ok) {
            throw new Error(`Image request failed with ${response.status}.`);
          }
          const blob = await response.blob();
          const objectUrl = URL.createObjectURL(blob);
          try {
            const image = await loadImageFromUrl(objectUrl);
            return {
              image,
              revoke: () => URL.revokeObjectURL(objectUrl)
            };
          } catch (error) {
            URL.revokeObjectURL(objectUrl);
            throw error;
          }
        } catch (error) {
          const image = await loadImageFromUrl(value);
          return { image, revoke: null };
        }
      }

      function loadImageFromUrl(url) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.crossOrigin = 'anonymous';
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error(`Could not load image: ${url}`));
          image.src = url;
        });
      }

      function canvasToBlob(canvas, type) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) {
              resolve(blob);
              return;
            }
            reject(new Error('Canvas export did not return a file.'));
          }, type);
        });
      }

      function cssFontValue(value) {
        return String(value || 'sans-serif').trim() || 'sans-serif';
      }

      function safeJson(value) {
        return JSON.stringify(value, null, 2).replace(/</g, '\\u003c');
      }

      function buildManagedAssetBaseUrls() {
        return {
          image: `${MEDIA_LIBRARY_SITE_ORIGIN}/images/`,
          gif: `${MEDIA_LIBRARY_SITE_ORIGIN}/gifs/`,
          audio: `${MEDIA_LIBRARY_SITE_ORIGIN}/audio/`,
          video: `${MEDIA_LIBRARY_SITE_ORIGIN}/video/`
        };
      }

      function managedAssetOrigin() {
        return MEDIA_LIBRARY_SITE_ORIGIN;
      }

      function slugify(value) {
        return String(value || 'tutorial')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .slice(0, 60) || 'tutorial';
      }

      function titleFromSlug(value) {
        return String(value || '').replace(/[-_]+/g, ' ').replace(/\b\w/g, (letter) => letter.toUpperCase());
      }

      function tutorialPublicUrl() {
        const category = normalizeTutorialFolderPath(`${state.meta.category || selectedTutorialFolderSlug().split('/')[0] || 'learn'}/placeholder`).split('/')[0];
        const filename = String(state.meta.filename || `${selectedTutorialFolderSlug().split('/')[1] || 'tutorial'}.html`).replace(/^\/+/, '');
        return `https://magichashtags.com/learn/${encodeURIComponent(category)}/${filename.split('/').map(encodeURIComponent).join('/')}`;
      }

      function focusPendingBinding() {
        if (!pendingFocus) {
          return;
        }
        const selector = `[data-bind="${cssEscape(pendingFocus)}"]`;
        const target = root.querySelector(selector);
        if (!target) {
          return;
        }
        pendingFocus = null;
        target.focus();
        placeCursorAtEnd(target);
      }

      function placeCursorAtEnd(element) {
        if (!element || !document.createRange || !window.getSelection) {
          return;
        }
        const range = document.createRange();
        range.selectNodeContents(element);
        range.collapse(false);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function placeInputCursorAtEnd(input) {
        if (!input || typeof input.setSelectionRange !== 'function') {
          return;
        }
        const length = input.value.length;
        input.setSelectionRange(length, length);
      }

      function cssEscape(value) {
        if (window.CSS && typeof window.CSS.escape === 'function') {
          return window.CSS.escape(value);
        }
        return String(value).replace(/"/g, '\\"');
      }

      function isEmbeddableUrl(url) {
        return /youtube\.com|youtu\.be|vimeo\.com/i.test(url || '');
      }

      function normalizeAssetUrl(url, assetType = '') {
        const value = String(url || '').trim();
        if (!value) {
          return '';
        }

        if (BUILT_IN_ASSET_URIS[value]) {
          return BUILT_IN_ASSET_URIS[value];
        }

        const managedValue = expandManagedAssetUrl(value, assetType);

        try {
          const parsed = new URL(managedValue, location.href);
          const host = parsed.hostname.replace(/^www\./, '');
          if (host === 'github.com') {
            const parts = parsed.pathname.split('/').filter(Boolean);
            if (parts.length >= 5 && parts[2] === 'blob') {
              const owner = parts[0];
              const repo = parts[1];
              const branch = parts[3];
              const filePath = parts.slice(4).join('/');
              return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;
            }
            if (parts.length >= 5 && parts[2] === 'raw') {
              const owner = parts[0];
              const repo = parts[1];
              const branch = parts[3];
              const filePath = parts.slice(4).join('/');
              return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;
            }
          }
        } catch (error) {
          return managedValue;
        }

        return managedValue;
      }

      function previewAssetUrl(url) {
        const value = String(url || '').trim();
        if (!value || MODE !== 'builder') {
          return value;
        }
        try {
          const parsed = new URL(value, location.href);
          const publicMediaOrigin = new URL(MEDIA_LIBRARY_SITE_ORIGIN);
          if (parsed.origin === publicMediaOrigin.origin) {
            if (location.protocol === 'file:') {
              const tutorialsMarker = '/tutorials/';
              if (location.href.includes(tutorialsMarker)) {
                const mediaRootHref = location.href.split(tutorialsMarker)[0];
                return `${mediaRootHref}${parsed.pathname}`;
              }
              return new URL(`..${parsed.pathname}`, location.href).href;
            }
            if (!isLocalBuilderPreview()) {
              return value;
            }
            return `${parsed.pathname}${parsed.search}${parsed.hash}`;
          }
        } catch (error) {
          return value;
        }
        return value;
      }

      function expandManagedAssetUrl(value, assetType) {
        const baseUrl = MANAGED_ASSET_BASE_URLS[assetType];
        if (!baseUrl) {
          return value;
        }
        if (/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(value)) {
          return value;
        }
        if (value.startsWith('/') || value.startsWith('./') || value.startsWith('../')) {
          return value;
        }
        return `${baseUrl}${value.replace(/^\/+/, '')}`;
      }

      function hexToRgba(value, alpha) {
        const hex = String(value || '').trim().replace('#', '');
        if (!/^[0-9a-f]{6}$/i.test(hex)) {
          return `rgba(255, 144, 231, ${alpha})`;
        }
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, '&#96;');
      }

      function escapeMultiline(value) {
        return escapeHtml(value).replace(/\n/g, '<br />');
      }
    })();
  </script>
</body>
</html>

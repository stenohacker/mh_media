<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Tutorial Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Victor+Mono:wght@400;500;600;700&family=Shadows+Into+Light&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --gray: #cccccc;
      --divider: #bebfcb;
      --yellow: #f1f332;
      --pink: #ff90e7;
      --mauve: #b23386;
      --purple: #91a8ed;
      --green: #24a094;
      --mint: #d3f3f0;
      --light-pink: #fbeaf9;
      --orange-yellow: #ffc900;
      --shell-width: min(1480px, calc(100vw - 24px));
      --outer-shadow: 6px 6px 0 0 #000;
      --inner-shadow: 4px 4px 0 0 #000;
      --title-font: "Victor Mono", ui-monospace, monospace;
      --hand-font: "Shadows Into Light Two", "Shadows Into Light", cursive;
      --body-font: "Victor Mono", ui-monospace, monospace;
      --site-nav-font: "Inter", ui-sans-serif, system-ui, sans-serif;
      --stage-ratio: 16 / 10;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(255, 144, 231, 0.08), transparent 28%),
        radial-gradient(circle at bottom right, rgba(36, 160, 148, 0.08), transparent 32%),
        #050505;
      color: var(--black);
      font-family: var(--body-font);
      overflow-x: hidden;
    }

    body[data-mode="builder"] {
      background: #fff8d2;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 2px solid var(--black);
      background: var(--white);
      color: var(--black);
      cursor: pointer;
      box-shadow: 3px 3px 0 0 #000;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.55rem 0.72rem;
      line-height: 1;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    button.is-active {
      background: var(--yellow);
    }

    button.is-secondary {
      background: var(--light-pink);
    }

    button.is-danger {
      background: #ffdfdf;
    }

    button.is-dark {
      background: var(--black);
      color: var(--white);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 2px solid var(--black);
      border-radius: 0;
      background: var(--white);
      color: var(--black);
      padding: 0.58rem 0.68rem;
      box-shadow: 3px 3px 0 0 #000;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 260;
      background: #000;
      border-bottom: 4px solid #fff;
    }

    .site-header__inner {
      width: min(1280px, calc(100vw - 3rem));
      margin: 0 auto;
      padding: 1rem 0;
    }

    .site-nav {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      min-width: 0;
    }

    .site-nav__brand {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 0 1 auto;
    }

    .site-nav__brand a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      box-shadow: none;
      padding: 0;
      text-decoration: none;
      color: inherit;
      transition: transform 200ms ease;
    }

    .site-nav__brand a:hover,
    .site-nav__brand a:focus-visible {
      transform: translateY(-2px) scale(1.02);
    }

    .site-header-logo {
      display: block;
      width: clamp(10rem, 28vw, 18rem);
      height: auto;
      max-height: 4.6rem;
      object-fit: contain;
    }

    .site-nav__desktop {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .site-nav__link,
    .site-nav__dropdown-trigger,
    .site-header-contact {
      font-family: var(--site-nav-font);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 700;
      font-size: 0.98rem;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .site-nav__link,
    .site-nav__dropdown-trigger {
      color: #fff;
      background: transparent;
      border: 2px solid transparent;
      box-shadow: none;
      padding: 0.75rem 1.5rem;
      min-height: 3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .site-nav__link:hover,
    .site-nav__link:focus-visible,
    .site-nav__dropdown-trigger:hover,
    .site-nav__dropdown-trigger:focus-visible {
      background: #f1f332;
      border-color: #f1f332;
      color: #000;
    }

    .site-header-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.5rem;
      padding: 0 1.5rem;
      background: #fff;
      border: 2px solid #fff;
      box-shadow: none;
      color: #000;
    }

    .site-header-contact:hover,
    .site-header-contact:focus-visible {
      background: #ff90e7;
      border-color: #ff90e7;
      color: #000;
    }

    .site-nav__dropdown {
      position: relative;
    }

    .site-nav__dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 16px);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      min-width: 320px;
      max-width: calc(100vw - 2rem);
      z-index: 280;
    }

    .site-nav__dropdown[data-open="true"] .site-nav__dropdown-menu,
    .site-nav__dropdown:hover .site-nav__dropdown-menu,
    .site-nav__dropdown:focus-within .site-nav__dropdown-menu {
      display: block;
    }

    .site-nav__dropdown-menu::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -16px;
      height: 16px;
    }

    .neo-offset-shadow {
      position: absolute;
      inset: 0;
      transform: translate(4px, 4px);
      background: #000;
      z-index: -1;
    }

    .site-nav__dropdown-card {
      position: relative;
      border: 4px solid #000;
      background: #fff;
      padding: 0.75rem;
      display: grid;
      gap: 0.5rem;
    }

    .site-nav__dropdown-card a,
    .site-nav__mobile-panel a {
      font-family: var(--site-nav-font);
      display: block;
      border: 2px solid #000;
      background: #fff;
      color: #000;
      box-shadow: 4px 4px 0 0 #000;
      padding: 0.78rem 0.95rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.045em;
      line-height: 1.2;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 160ms ease, background-color 160ms ease, color 160ms ease;
    }

    .site-nav__dropdown-card a:hover,
    .site-nav__dropdown-card a:focus-visible,
    .site-nav__mobile-panel a:hover,
    .site-nav__mobile-panel a:focus-visible {
      transform: translate(4px, 4px);
      background: var(--hover-color, var(--yellow));
      color: #000;
    }

    .site-nav__mobile-toggle {
      display: none;
      width: 2.45rem;
      height: 2.45rem;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: #fff;
      padding: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.28rem;
      margin-left: auto;
    }

    .site-nav__mobile-toggle span {
      display: block;
      width: 1.15rem;
      height: 2px;
      background: currentColor;
    }

    .site-nav__mobile-panel {
      display: none;
      position: absolute;
      top: calc(100% + 0.7rem);
      right: 0;
      width: min(19rem, calc(100vw - 2rem));
      border: 4px solid #000;
      background: #fff;
      box-shadow: 8px 8px 0 0 #000;
      padding: 0.55rem;
      gap: 0.45rem;
      z-index: 290;
    }

    .site-nav__mobile-panel:not([hidden]) {
      display: grid;
    }

    .app-shell {
      width: var(--shell-width);
      margin: 0 auto 22px;
      padding-top: 108px;
      display: grid;
      gap: 14px;
    }

    .tutorial-shell {
      display: grid;
      gap: 4px;
    }

    .tutorial-header {
      min-height: 0;
      background: var(--black);
      padding: 2px 10px 10px 2px;
    }

    .tutorial-header__title {
      display: block;
      width: 100%;
      text-align: center;
      text-transform: uppercase;
      font-family: var(--title-font);
      font-size: clamp(2rem, 4vw, 3.15rem);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1;
      border: 2px solid var(--black);
      background: var(--yellow);
      box-shadow: 8px 8px 0 0 var(--white);
      padding: 0.45rem 1rem 0.5rem;
      outline: none;
    }

    .tutorial-divider {
      height: 6px;
      border: 2px solid var(--black);
      background: var(--yellow);
    }

    .tutorial-main {
      display: grid;
      gap: 10px;
      border: 4px solid var(--black);
      background: var(--black);
      box-shadow: var(--outer-shadow);
      padding: 10px 10px 12px;
    }

    .tutorial-main__body {
      display: grid;
      grid-template-columns: minmax(295px, 0.93fr) minmax(0, 2.2fr);
      gap: 10px;
      align-items: start;
      min-width: 0;
    }

    .sidebar-shell,
    .media-column {
      display: grid;
      min-width: 0;
    }

    .sidebar-shell {
      height: 100%;
      min-height: 0;
      background: var(--white);
      overflow: hidden;
    }

    .sidebar-shell__content {
      height: 100%;
      min-height: 0;
      padding: 10px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
    }

    .sidebar-shell__divider {
      height: 4px;
      background: var(--black);
    }

    .sidebar-shell__panel {
      height: 100%;
      min-height: 0;
    }

    .meta-card {
      display: grid;
      gap: 4px;
    }

    .meta-card__label,
    .contents-card__label {
      min-height: 44px;
      border: 3px solid var(--black);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0.62rem 0.8rem;
      font-size: 0.84rem;
      line-height: 1.1;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      outline: none;
    }

    .meta-card__body {
      min-height: 84px;
      border: 3px solid var(--black);
      background: var(--white);
      padding: 0.82rem 0.85rem;
      font-size: 1rem;
      line-height: 1.48;
      overflow: visible;
      overflow-wrap: anywhere;
      outline: none;
      white-space: pre-wrap;
    }

    .contents-card {
      min-height: 0;
      height: 100%;
      background: transparent;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 16px;
      min-width: 0;
    }

    .contents-card__scroller {
      padding: 0;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 8px;
      min-height: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .contents-card__scroller::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .contents-card__gutter {
      position: relative;
      background: #ffff25;
      border-left: 4px solid var(--black);
      overflow: hidden;
    }

    .contents-card__thumb {
      position: absolute;
      left: 2px;
      right: 2px;
      top: 0;
      min-height: 36px;
      border: 2px solid var(--black);
      background: #ffc900;
      box-shadow: 2px 2px 0 0 #000;
      transform: translateY(0);
      transform-origin: top center;
    }

    .contents-card__gutter[data-enabled="false"] .contents-card__thumb {
      opacity: 0.5;
    }

    .hotspot-item {
      display: grid;
      gap: 7px;
    }

    .hotspot-bar {
      min-height: 48px;
      border: 4px solid var(--black);
      box-shadow: var(--inner-shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      padding: 0.7rem 0.85rem;
      font-weight: 700;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: var(--pink);
    }

    .hotspot-bar__title {
      flex: 1 1 auto;
      min-width: 0;
      outline: none;
    }

    .hotspot-bar__tools {
      display: flex;
      align-items: center;
      gap: 0.38rem;
      flex: 0 0 auto;
    }

    .hotspot-mini-button {
      min-width: 2rem;
      min-height: 2rem;
      border-width: 2px;
      box-shadow: 2px 2px 0 0 #000;
      padding: 0;
      font-size: 0.8rem;
      line-height: 1;
      background: #fff;
    }

    .hotspot-detail {
      min-height: 110px;
      border: 3px solid var(--black);
      background: var(--white);
      box-shadow: none;
      padding: 0.8rem 0.85rem;
      overflow: visible;
      overflow-wrap: anywhere;
      outline: none;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .contents-jump {
      min-height: 56px;
      border: 3px solid var(--black);
      background: var(--white);
      box-shadow: none;
      display: grid;
      gap: 0.18rem;
      align-content: center;
      padding: 0.48rem 0.62rem;
      text-align: left;
    }

    .contents-jump__eyebrow {
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .contents-jump__title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .contents-jump--contents {
      background: #ffff25;
    }

    .stage-card {
      position: relative;
      min-height: 0;
      background: var(--white);
      padding: clamp(10px, 1.2vw, 14px);
      display: grid;
    }

    .stage-canvas {
      position: relative;
      aspect-ratio: var(--stage-ratio);
      width: 100%;
      min-height: 360px;
      background: var(--white);
      overflow: hidden;
    }

    .media-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(96%, calc(100% - 18px));
      height: min(94%, calc(100% - 18px));
      transform: translate(-50%, -50%);
      border: 4px solid var(--black);
      background: var(--white);
      box-shadow: var(--inner-shadow);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .media-frame__inner {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: var(--white);
    }

    .media-asset {
      width: 100%;
      height: 100%;
      display: block;
      transform-origin: center center;
      will-change: transform;
    }

    .media-frame__inner[data-fit="contain"] .media-asset {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .media-frame__inner[data-fit="cover"] .media-asset {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media-asset--audio {
      width: min(90%, 560px) !important;
      height: auto !important;
      object-fit: initial !important;
      transform: none !important;
    }

    .media-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 1rem;
      text-align: center;
      color: rgba(0, 0, 0, 0.28);
      font-size: clamp(1rem, 2.7vw, 2.15rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .media-placeholder--blank {
      color: transparent;
    }

    .stage-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .stage-overlay > * {
      pointer-events: auto;
    }

    .stage-object {
      position: absolute;
      transform-origin: center center;
      user-select: none;
    }

    .stage-object.is-selected {
      z-index: 80 !important;
    }

    .stage-object__frame {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .stage-annotation {
      z-index: 12;
    }

    .stage-annotation--text .stage-object__frame {
      min-width: 84px;
      min-height: 42px;
      padding: 0.25rem 0.4rem;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      white-space: pre-wrap;
      line-height: 1.25;
      outline: none;
      background: transparent;
      cursor: text;
    }

    .stage-annotation--text .text-regular {
      font-family: var(--body-font);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .stage-annotation--text .text-bold {
      font-family: var(--body-font);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .stage-annotation--text .text-hand {
      font-family: var(--hand-font);
      font-size: 1.14em;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .stage-annotation--image .stage-object__frame {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: transparent;
    }

    .stage-annotation--image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .stage-markup-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .stage-markup-svg * {
      pointer-events: none;
    }

    .markup-point-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 3px solid var(--black);
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      z-index: 95;
      cursor: move;
      pointer-events: auto;
    }

    .markup-point-handle--curve { background: var(--yellow); }

    .stage-annotation--video,
    .stage-annotation--link {
      cursor: pointer;
    }

    .stage-annotation--video .stage-object__frame,
    .stage-annotation--link .stage-object__frame {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: visible;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .stage-annotation--video img,
    .stage-annotation--link img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .stage-annotation--audio .stage-object__frame {
      width: 100%;
      height: 100%;
      min-height: 58px;
      border: 0;
      background: transparent;
      box-shadow: none;
      display: block;
      position: relative;
      overflow: visible;
      padding: 0;
    }

    .audio-panel__label {
      position: absolute;
      z-index: 2;
      top: 0.15rem;
      left: 0.15rem;
      right: 0.15rem;
      min-height: 0;
      padding: 0.08rem 0.14rem;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      background: transparent;
      border: 0;
      box-shadow: none;
      color: var(--black);
      text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.72);
    }

    .audio-panel__controls {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.45rem;
      width: max-content;
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 0.35rem;
      transform: translateX(-50%);
    }

    .audio-panel__art {
      display: block;
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: contain;
      margin: 0;
      pointer-events: none;
    }

    .video-stage__controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.55rem;
      padding: 0.7rem;
      border-top: 4px solid var(--black);
      background: #f1f332;
    }

    .video-stage__controls .media-control-button {
      width: 4.4rem;
      height: 4.4rem;
      border: 3px solid var(--black);
      background: var(--white);
      box-shadow: 4px 4px 0 var(--black);
    }

    .media-control-button {
      min-height: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
    }

    .media-control-button img {
      width: clamp(2.85rem, 4vw, 3.8rem);
      height: auto;
      display: block;
      pointer-events: none;
    }

    .media-control-button:disabled {
      opacity: 0.45;
    }

    .stage-hotspot {
      z-index: 60;
      cursor: pointer;
    }

    .stage-video-trigger {
      z-index: 59;
      cursor: pointer;
    }

    .stage-hotspot__frame {
      width: 100%;
      height: 100%;
      border: 4px solid var(--hotspot-color, var(--black));
      background: var(--hotspot-fill, rgba(255, 144, 231, 0.18));
      box-shadow: 6px 6px 0 0 var(--hotspot-shadow, rgba(0, 0, 0, 0.25));
      position: relative;
      overflow: visible;
    }

    .stage-video-trigger__frame {
      width: 100%;
      height: 100%;
      border: 4px solid var(--black);
      background: #ffff25;
      box-shadow: var(--inner-shadow);
      display: grid;
      place-items: center;
      position: relative;
      padding: 0.4rem;
      overflow: hidden;
    }

    .stage-hotspot__frame::before {
      content: "";
      position: absolute;
      inset: 8px;

      function readEmbeddedState() {
        const script = document.getElementById('project-state');
        if (!script) {
          return null;

        try {
          return JSON.parse(script.textContent);
        } catch (error) {
          console.error('Could not parse embedded project state.', error);
          return null;
        }

      function loadInitialState() {
        const embedded = readEmbeddedState() || {};
        if (MODE !== 'builder') {
          return embedded;
        }

        const draft = loadLocalDraft();
        if (!draft) {
          return embedded;
        }

        const embeddedAt = Number(embedded?.meta?.updatedAt || 0);
        const draftAt = Number(draft?.meta?.updatedAt || 0);
        return draftAt >= embeddedAt ? draft : embedded;
      }

      function loadLocalDraft() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          console.warn('Local draft could not be read.', error);
          return null;
        }
      }

      function normalizeTutorialMediaCatalog(value) {
        const source = value && typeof value === 'object' ? value : {};
        const catalog = {};
        Object.entries(source).forEach(([rawSlug, rawTypes]) => {
          const tutorialSlug = slugify(rawSlug);
          if (!tutorialSlug || tutorialSlug.startsWith('codex-disposable-') || !rawTypes || typeof rawTypes !== 'object') {
            return;
          }
          catalog[tutorialSlug] = {
            image: uniqueCatalogPaths(Array.isArray(rawTypes.image) ? rawTypes.image : []),
            gif: uniqueCatalogPaths(Array.isArray(rawTypes.gif) ? rawTypes.gif : []),
            video: uniqueCatalogPaths(Array.isArray(rawTypes.video) ? rawTypes.video : []),
            audio: uniqueCatalogPaths(Array.isArray(rawTypes.audio) ? rawTypes.audio : [])
          };
        });
        return catalog;
      }

      function loadSavedTutorialMediaCatalog() {
        try {
          const raw = localStorage.getItem(TUTORIAL_MEDIA_STORAGE_KEY);
          if (!raw) {
            return { folders: [], catalog: {} };
          }
          const parsed = JSON.parse(raw);
          const catalog = normalizeTutorialMediaCatalog(parsed?.catalog);
          const folders = uniqueCatalogPaths([
            ...(Array.isArray(parsed?.folders) ? parsed.folders.map(slugify) : []),
            ...Object.keys(catalog)
          ]).filter((slug) => slug && !slug.startsWith('codex-disposable-'));
          return { folders, catalog };
        } catch (error) {
          console.warn('Saved tutorial folder list could not be read.', error);
          return { folders: [], catalog: {} };
        }
      }

      function saveTutorialMediaCatalog(folders, catalog) {
        try {
          localStorage.setItem(TUTORIAL_MEDIA_STORAGE_KEY, JSON.stringify({ folders, catalog }));
        } catch (error) {
          console.warn('Tutorial folder list could not be saved.', error);
        }
      }

      function loadTutorialCatalogFromFileList(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) {
          setStatus('No tutorial folder was selected. The current folder list was kept.');
          return;
        }

        const folders = new Set();
        const catalog = {};
        files.forEach((file) => {
          const relativePath = String(file.webkitRelativePath || file.name || '');
          const segments = relativePath.split('/').filter(Boolean);
          if (segments.length < 2) {
            return;
          }

          const selectedRootName = segments.shift();
          let topic = '';
          let tutorialFolder = '';
          if (selectedRootName.toLowerCase() === 'tutorials' && segments.length >= 3) {
            topic = segments.shift();
            tutorialFolder = segments.shift();
          } else if (segments.length >= 2) {
            topic = selectedRootName;
            tutorialFolder = segments.shift();
          } else {
            topic = state.meta.category || selectedTutorialFolderSlug().split('/')[0] || 'tutorials';
            tutorialFolder = selectedRootName;
          }
          const tutorialSlug = normalizeTutorialFolderPath(`${topic}/${tutorialFolder}`);
          const filename = segments.join('/');
          const assetType = mediaTypeFromUrl(filename);
          if (!tutorialSlug || tutorialSlug.startsWith('.') || tutorialSlug.startsWith('codex-disposable-') || !assetType || !filename || filename.split('/').some((part) => part.startsWith('.'))) {
            return;
          }

          folders.add(tutorialSlug);
          catalog[tutorialSlug] ||= { image: [], gif: [], video: [], audio: [] };
          catalog[tutorialSlug][assetType].push(filename);
        });

        const nextCatalog = normalizeTutorialMediaCatalog(catalog);
        const nextFolders = uniqueCatalogPaths([...folders, ...Object.keys(nextCatalog)]).sort();
        if (!nextFolders.length) {
          setStatus('No tutorial media files were found. You may choose mh_media/tutorials, one topic folder, or one tutorial assets folder.');
          return;
        }

        tutorialFolderCatalog = Object.freeze(nextFolders);
        tutorialMediaCatalog = Object.freeze(nextCatalog);
        saveTutorialMediaCatalog(nextFolders, nextCatalog);
        setStatus(`Loaded ${nextFolders.length} tutorial asset folder${nextFolders.length === 1 ? '' : 's'}. Choose a topic, then choose a tutorial assets folder.`);
        render();
      }

      function scheduleLocalSave() {
        if (MODE !== 'builder') {
          return;
        }
        clearTimeout(localSaveTimer);
        localSaveTimer = window.setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (error) {
            console.warn('Local autosave failed.', error);
          }
        }, 120);
      }

      function scheduleFileAutosave() {
        if (MODE !== 'builder' || !connectedFileHandle) {
          return;
        }

        clearTimeout(fileSaveTimer);
        fileSaveTimer = window.setTimeout(async () => {
          try {
            await writeHtmlToHandle(connectedFileHandle, serializeDocumentHtml('builder', buildBuilderState()));
            setStatus('Saved back into this builder file.');
          } catch (error) {
            console.warn('File autosave failed.', error);
            setStatus('Autosave stayed local. File overwrite failed in this browser session.');
          }
        }, 500);

      function cloneForHistory(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function pushHistory() {
        const snapshot = cloneForHistory(state);
        const current = historyStack[historyIndex];
        if (JSON.stringify(current) === JSON.stringify(snapshot)) {
          return;
        }
        historyStack = historyStack.slice(0, historyIndex + 1);
        historyStack.push(snapshot);
        if (historyStack.length > HISTORY_LIMIT) {
          historyStack.shift();
        }
        historyIndex = historyStack.length - 1;
      }

      function normalizeState(value, options = {}) {
        const base = value && typeof value === 'object' ? value : {};
        const slides = Array.isArray(base.tutorial?.slides) ? base.tutorial.slides : [];
        const normalizedSlides = slides.length ? slides.map(normalizeSlide) : [createDefaultCover(), createDefaultSlide()];
        const enforceCover = options.enforceCover ?? MODE === 'builder';
        if (enforceCover && normalizedSlides[0].kind !== 'cover') {
          normalizedSlides.unshift(createDefaultCover());
        }

      const normalized = {
          meta: {
            version: 1,
            omitCoverOnExport: Boolean(base.meta?.omitCoverOnExport),
            shareUrl: text(base.meta?.shareUrl),
            navigationName: text(base.meta?.navigationName),
            cardName: text(base.meta?.cardName),
            filename: text(base.meta?.filename),
            mediaTutorialSlug: text(base.meta?.mediaTutorialSlug),
            category: slugify(base.meta?.category || 'sidekicks'),
            summary: text(base.meta?.summary),
            popupDescription: text(base.meta?.popupDescription),
            order: Number(base.meta?.order || 10),
            publishStatus: base.meta?.publishStatus === 'published' ? 'published' : 'draft',
            publicUrl: text(base.meta?.publicUrl),
            updatedAt: Number(base.meta?.updatedAt || Date.now())
          },
          tutorial: {
            title: text(base.tutorial?.title, 'TUTORIAL TITLE'),
            slides: normalizedSlides
          },
          ui: {
            slideIndex: clampNumber(Number(base.ui?.slideIndex || 0), 0, normalizedSlides.length - 1),
            selectedKind: base.ui?.selectedKind || null,
            selectedId: base.ui?.selectedId || null,
            activeHotspotId: base.ui?.activeHotspotId || null
          }
        };

        const slide = normalized.tutorial.slides[normalized.ui.slideIndex];
        if (!slide) {
          normalized.ui.slideIndex = 0;
        }
        const navigableHotspots = literalHotspots(slide);
        if (slide && (!normalized.ui.activeHotspotId || !navigableHotspots.find((item) => item.id === normalized.ui.activeHotspotId))) {
          normalized.ui.activeHotspotId = slide?.hotspotsEnabled ? navigableHotspots[0]?.id || null : null;
        }
        if (slide && (!normalized.ui.selectedId || !findSelectable(slide, normalized.ui.selectedKind, normalized.ui.selectedId))) {
          normalized.ui.selectedKind = null;
          normalized.ui.selectedId = null;
        }
        return normalized;
      }

      function normalizeSlide(value, index) {
        const kind = ['cover', 'slide', 'video'].includes(value?.kind) ? value.kind : (index === 0 ? 'cover' : 'slide');
        const slide = {
          id: text(value?.id, uid(kind === 'cover' ? 'cover' : 'slide')),
          kind,
          title: text(value?.title, kind === 'cover' ? 'TUTORIAL SUBTITLE' : 'SLIDE TITLE'),
          notes: typeof value?.notes === 'string'
            ? value.notes
            : (kind === 'cover' ? 'Tutorial description.' : 'Slide description.'),
          hotspotsEnabled: kind === 'cover' ? false : Boolean(value?.hotspotsEnabled ?? true),
          media: normalizeMedia(value?.media, kind),
          hotspots: [],
          annotations: []
        };

        const rawHotspots = Array.isArray(value?.hotspots) ? value.hotspots.slice(0, MAX_HOTSPOTS) : [];
        const legacyVideoHotspots = rawHotspots.filter((hotspot) => hotspot?.actionType === 'video');
        const legacyLinkHotspots = rawHotspots.filter((hotspot) => hotspot?.actionType === 'link');
        slide.hotspots = rawHotspots
          .filter((hotspot) => hotspot?.actionType !== 'video' && hotspot?.actionType !== 'link')
          .map((hotspot, hotspotIndex) => normalizeHotspot(hotspot, hotspotIndex));

        const rawAnnotations = Array.isArray(value?.annotations) ? value.annotations : [];
        slide.annotations = rawAnnotations.map((annotation, annotationIndex) => normalizeAnnotation(annotation, annotationIndex));
        legacyVideoHotspots.forEach((hotspot, hotspotIndex) => {
          slide.annotations.push(normalizeAnnotation(migrateLegacyVideoHotspot(hotspot), slide.annotations.length + hotspotIndex));
        });
        legacyLinkHotspots.forEach((hotspot, hotspotIndex) => {
          slide.annotations.push(normalizeAnnotation(migrateLegacyLinkHotspot(hotspot), slide.annotations.length + hotspotIndex));
        });

        return slide;
      }

      function normalizeMedia(value, kind) {
        const inferredType = kind === 'video' ? 'video' : mediaTypeFromUrl(value?.url);
        return {
          url: text(value?.url),
          type: ['image', 'gif', 'video', 'audio'].includes(value?.type) ? value.type : inferredType,
          fit: value?.fit === 'cover' ? 'cover' : 'contain',
          aspect: normalizeMediaAspect(value?.aspect),
          matte: text(value?.matte, kind === 'cover' ? '#fbeaf9' : '#ffffff'),
          xOffset: clampNumber(Number(value?.xOffset || 0), -40, 40),
          yOffset: clampNumber(Number(value?.yOffset || 0), -40, 40),
          scale: clampNumber(Number(value?.scale || 1), 1, 3)
        };
      }

      function normalizeMediaAspect(value) {
        const raw = String(value || '').trim();
        if (MEDIA_ASPECTS.some((item) => item.value === raw)) {
          return raw;
        }
        const match = raw.match(/^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/);
        if (!match) {
          return '16:9';
        }
        const width = Number(match[1]);
        const height = Number(match[2]);
        if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) {
          return '16:9';
        }
        return `${trimAspectNumber(width)}:${trimAspectNumber(height)}`;
      }

      function trimAspectNumber(value) {
        const rounded = Math.round(value * 1000) / 1000;
        return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/0+$/, '').replace(/\.$/, '');
      }

      function mediaAspectOptions(currentAspect) {
        const normalizedCurrent = normalizeMediaAspect(currentAspect);
        const options = [...MEDIA_ASPECTS];
        if (!MEDIA_ASPECTS.some((item) => item.value === normalizedCurrent)) {
          options.unshift({ value: normalizedCurrent, label: `${normalizedCurrent} (matched)` });
        }
        return options;
      }

      function normalizeHotspot(value, index) {
        return {
          id: text(value?.id, uid('hotspot')),
          title: text(value?.title, `HOTSPOT ${index + 1}`),
          detail: typeof value?.detail === 'string' ? value.detail : '',
          actionType: ['detail', 'link', 'video'].includes(value?.actionType) ? value.actionType : 'detail',
          actionUrl: text(value?.actionUrl),
          videoNote: typeof value?.videoNote === 'string' ? value.videoNote : '',
          color: HOTSPOT_COLORS.includes(value?.color) ? value.color : HOTSPOT_COLORS[index % HOTSPOT_COLORS.length],
          x: clampPercent(value?.x, 42 + index * 5),
          y: clampPercent(value?.y, 30 + index * 4),
          w: clampPercent(value?.w, 18, 5, 60),
          h: clampPercent(value?.h, 12, 4, 40),
          rotation: clampNumber(Number(value?.rotation || 0), -180, 180)
        };
      }

      function normalizeAnnotation(value, index) {
        const type = ['text', 'image', 'audio', 'video', 'link'].includes(value?.type) ? value.type : 'text';
        const rawLabel = typeof value?.label === 'string' ? value.label : '';
        const markupKey = normalizeMarkupKey(value?.markupKey, value?.src);
        return {
          id: text(value?.id, uid(`annotation-${type}`)),
          type,
          x: clampPercent(value?.x, 18 + index * 4),
          y: clampPercent(value?.y, 16 + index * 4),
          w: clampPercent(value?.w, type === 'audio' ? 30 : (type === 'video' || type === 'link') ? 10 : 24, 6, 85),
          h: clampPercent(value?.h, type === 'audio' ? 18 : (type === 'video' || type === 'link') ? 10 : 14, 4, 80),
          rotation: clampNumber(Number(value?.rotation || 0), -180, 180),
          opacity: clampNumber(Number(value?.opacity ?? 1), 0.1, 1),
          z: Number.isFinite(value?.z) ? Number(value.z) : index,
          text: typeof value?.text === 'string' ? value.text : (type === 'text' ? 'new note' : type === 'video' ? DEFAULT_VIDEO_MODAL_NOTE : ''),
          fontStyle: ['regular', 'bold', 'hand'].includes(value?.fontStyle) ? value.fontStyle : 'regular',
          color: TEXT_COLORS.includes(value?.color) ? value.color : '#000000',
          src: text(value?.src, type === 'video' ? VIDEO_ANNOTATION_ICON_URL : type === 'link' ? LINK_ANNOTATION_ICON_URL : ''),
          modalUrl: text(value?.modalUrl),
          modalBody: typeof value?.modalBody === 'string' ? value.modalBody : '',
          linkUrl: text(value?.linkUrl, text(value?.actionUrl)),
          label: rawLabel.trim().toLowerCase() === 'audio annotation' ? '' : rawLabel,
          flipX: Boolean(value?.flipX),
          naturalAspect: clampNumber(Number(value?.naturalAspect || 0), 0, 100),
          markupKey,
          markupStrokeWidth: clampNumber(Number(value?.markupStrokeWidth ?? (isLineMarkupKey(markupKey) ? 2.5 : 4)), 1, 10),
          bend: markupKey === 'line-d' ? normalizeMarkupBend(value?.bend) : null,
          markupPoints: isLineMarkupKey(markupKey) ? normalizeMarkupPoints(value?.markupPoints, markupKey, value?.bend) : null
        };
      }

      function mediaTypeFromUrl(value) {
        const clean = String(value || '').split(/[?#]/)[0].toLowerCase();
        if (/\.gif$/.test(clean)) return 'gif';
        if (/\.(mp4|webm|mov|m4v)$/.test(clean)) return 'video';
        if (/\.(mp3|wav|m4a|aac|ogg)$/.test(clean)) return 'audio';
        return 'image';
      }

      function isLineMarkupKey(key) {
        return ['line-d', 'arrow-s', 'arrow-c'].includes(key);
      }

      function normalizeMarkupPoints(value, key, legacyBend) {
        const defaults = key === 'arrow-c'
          ? { start: { x: 14, y: 76 }, curve: { x: 42, y: 16 }, end: { x: 84, y: 42 } }
          : { start: { x: 8, y: 50 }, curve: normalizeMarkupBend(legacyBend), end: { x: 92, y: 50 } };
        const point = (candidate, fallback) => ({
          x: clampNumber(Number(candidate?.x ?? fallback.x), 2, 98),
          y: clampNumber(Number(candidate?.y ?? fallback.y), 2, 98)
        });
        return {
          start: point(value?.start, defaults.start),
          curve: point(value?.curve, defaults.curve),
          end: point(value?.end, defaults.end)
        };
      }

      function normalizeMarkupKey(candidate, src) {
        if (MARKUP_PRESETS.some((item) => item.key === candidate)) {
          return candidate;
        }
        return detectMarkupKey(src);
      }

      function detectMarkupKey(src) {
        const match = MARKUP_PRESETS.find((item) => item.url === src);
        return match?.key || '';
      }

      function normalizeMarkupBend(value) {
        return {
          x: clampNumber(Number(value?.x ?? 50), 8, 92),
          y: clampNumber(Number(value?.y ?? 50), 8, 92)
        };
      }

      function markupKeyForAnnotation(annotation) {
        if (!annotation || annotation.type !== 'image') {
          return '';
        }
        return normalizeMarkupKey(annotation.markupKey, annotation.src);
      }

      function isMarkupAnnotation(annotation) {
        return Boolean(markupKeyForAnnotation(annotation));
      }

      function isBendableMarkup(annotation) {
        return markupKeyForAnnotation(annotation) === 'line-d';
      }

      function syncMarkupMetadata(annotation) {
        if (!annotation || annotation.type !== 'image') {
          return;
        }
        const markupKey = normalizeMarkupKey(annotation.markupKey, annotation.src);
        annotation.markupKey = markupKey;
        annotation.bend = markupKey === 'line-d'
          ? normalizeMarkupBend(annotation.bend)
          : null;
      }

      function migrateLegacyVideoHotspot(hotspot) {
        return {
          type: 'video',
          x: hotspot?.x,
          y: hotspot?.y,
          w: 10,
          h: 10,
          rotation: hotspot?.rotation,
          opacity: 1,
          text: typeof hotspot?.videoNote === 'string' && hotspot.videoNote.trim()
            ? hotspot.videoNote
            : text(hotspot?.title, DEFAULT_VIDEO_MODAL_NOTE),
          src: VIDEO_ANNOTATION_ICON_URL,
          modalUrl: text(hotspot?.actionUrl)
        };
      }

      function migrateLegacyLinkHotspot(hotspot) {
        return {
          type: 'link',
          x: hotspot?.x,
          y: hotspot?.y,
          w: hotspot?.w || 10,
          h: hotspot?.h || 10,
          rotation: hotspot?.rotation,
          opacity: 1,
          src: LINK_ANNOTATION_ICON_URL,
          linkUrl: text(hotspot?.actionUrl)
        };
      }

      function createDefaultCover() {
        return normalizeSlide({
          id: 'cover-slide',
          kind: 'cover',
          title: 'TUTORIAL SUBTITLE',
          notes: 'Tutorial description.',
          hotspotsEnabled: false,
          media: {
            url: '',
            fit: 'contain',
            aspect: '16:9',
            matte: '#fbeaf9',
            xOffset: 0,
            yOffset: 0,
            scale: 1
          },
          hotspots: [],
          annotations: []
        }, 0);
      }

      function createDefaultSlide(kind = 'slide') {
        return normalizeSlide({
          kind,
          title: kind === 'video' ? DEFAULT_VIDEO_SLIDE_TITLE : 'SLIDE TITLE',
          notes: kind === 'video' ? DEFAULT_VIDEO_SLIDE_NOTES : 'Slide description.',
          hotspotsEnabled: kind === 'video' ? false : kind !== 'cover',
          media: {
            url: '',
            fit: 'contain',
            aspect: '16:9',
            matte: '#ffffff',
            xOffset: 0,
            yOffset: 0,
            scale: 1
          },
          hotspots: [],
          annotations: []
        }, 1);
      }

      function uid(prefix) {
        if (globalThis.crypto && typeof crypto.randomUUID === 'function') {
          return `${prefix}-${crypto.randomUUID().slice(0, 8)}`;
        }
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function text(value, fallback = '') {
        return typeof value === 'string' && value.trim() ? value : fallback;
      }

      function clampNumber(value, min, max) {
        if (!Number.isFinite(value)) {
          return min;
        }
        return Math.max(min, Math.min(max, value));
      }

      function clampPercent(value, fallback, min = 0, max = 100) {
        const number = Number(value);
        if (!Number.isFinite(number)) {
          return fallback;
        }
        return clampNumber(number, min, max);
      }

      function currentSlide() {
        return state.tutorial.slides[state.ui.slideIndex];
      }

      function isVideoModalTrigger(hotspot) {
        return hotspot?.actionType === 'video';
      }

      function literalHotspots(slide = currentSlide()) {
        return (slide?.hotspots || []).filter((hotspot) => !isVideoModalTrigger(hotspot));
      }

      function firstLiteralHotspotId(slide = currentSlide()) {
        return literalHotspots(slide)[0]?.id || null;
      }

      function selectedHotspot() {
        if (state.ui.selectedKind !== 'hotspot') {
          return null;
        }
        return currentSlide()?.hotspots.find((item) => item.id === state.ui.selectedId) || null;
      }

      function selectedAnnotation() {
        if (state.ui.selectedKind !== 'annotation') {
          return null;
        }
        return currentSlide()?.annotations.find((item) => item.id === state.ui.selectedId) || null;
      }

      function findSelectable(slide, kind, id) {
        if (!slide || !kind || !id) {
          return null;
        }
        if (kind === 'hotspot') {
          return slide.hotspots.find((item) => item.id === id) || null;
        }
        if (kind === 'annotation') {
          return slide.annotations.find((item) => item.id === id) || null;
        }
        return null;
      }

      function renderSiteHeader() {
        return `
          <header class="site-header">
            <div class="site-header__inner">
              <nav class="site-nav" aria-label="Site">
                <div class="site-nav__brand">
                  <a href="${escapeAttr(SITE_HOME_HREF)}" aria-label="Home">
                    <span class="sr-only">Home</span>
                    <img alt="Magic Hashtags Sidekick" class="site-header-logo" decoding="async" loading="eager" src="${escapeAttr(previewAssetUrl(SITE_HEADER_LOGO_URL))}" />
                  </a>
                </div>
                <div class="site-desktop-nav site-nav__desktop">
                  <div class="nav-dropdown site-nav__dropdown" data-site-dropdown>
                    <button type="button" class="site-nav__dropdown-trigger" data-site-dropdown-toggle aria-expanded="false" aria-haspopup="true">
                      instructions
                    </button>
                    <div class="nav-dropdown-menu site-nav__dropdown-menu">
                      <div class="neo-offset-shadow" aria-hidden="true"></div>
                      <div class="site-nav__dropdown-card">
                        ${SITE_INSTRUCTION_LINKS.map((link) => `
                          <a href="${escapeAttr(link.href)}" style="--hover-color:${escapeAttr(link.hover)}"${link.target ? ` target="${escapeAttr(link.target)}" rel="noopener noreferrer"` : ''}>${escapeHtml(link.label)}</a>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                  ${SITE_PRIMARY_LINKS.map((link) => `
                    <a class="site-nav__link" href="${escapeAttr(link.href)}">${escapeHtml(link.label)}</a>
                  `).join('')}
                </div>
                <a class="site-header-contact" href="${escapeAttr(SITE_CONTACT_HREF)}">contact</a>
                <button type="button" class="site-nav__mobile-toggle" data-site-mobile-toggle aria-expanded="false" aria-label="Open navigation">
                  <span></span>
                  <span></span>
                  <span></span>
                </button>
                <div class="site-nav__mobile-panel" data-site-mobile-panel hidden>
                  ${SITE_INSTRUCTION_LINKS.map((link) => `
                    <a href="${escapeAttr(link.href)}"${link.target ? ` target="${escapeAttr(link.target)}" rel="noopener noreferrer"` : ''}>${escapeHtml(link.label)}</a>
                  `).join('')}
                  ${SITE_PRIMARY_LINKS.map((link) => `
                    <a href="${escapeAttr(link.href)}">${escapeHtml(link.label)}</a>
                  `).join('')}
                  <a href="${escapeAttr(SITE_CONTACT_HREF)}">contact</a>
                </div>
              </nav>
            </div>
          </header>
        `;
      }

      function render() {
        const slide = currentSlide();
        root.innerHTML = `
          ${renderSiteHeader()}
          <main class="app-shell">
            <div class="tutorial-shell">
              <header class="tutorial-header">
                <div
                  class="tutorial-header__title"
                  ${MODE === 'builder' ? 'contenteditable="true"' : ''}
                  spellcheck="false"
                  data-placeholder="TUTORIAL TITLE"
                  data-bind="tutorial.title"
                  data-single-line="true"
                >${escapeHtml(state.tutorial.title)}</div>
              </header>
              <div class="tutorial-divider"></div>
              ${renderMain(slide)}
              ${MODE === 'builder' ? renderBuilderDock(slide) : ''}
            </div>
            ${renderContentsModal()}
            ${renderVideoModal()}
          </main>
        `;

        bindInteractiveEvents();
        if (MODE === 'builder') {
          focusPendingBinding();
        }
      }

      function renderMain(slide) {
        return `
          <section class="tutorial-main">
            <div class="tutorial-main__body">
              ${renderSidebar(slide)}
              <div class="media-column">
                <div class="stage-card">
                  ${renderStage(slide)}
                </div>
              </div>
            </div>
            <nav class="nav-row">
              <div class="nav-row__slot">
                <button type="button" class="nav-button" data-action="go-back">Back</button>
              </div>
              <button type="button" class="grid-button" data-action="toggle-contents" aria-label="Open contents">
                <span class="grid-button__icon" aria-hidden="true">
                  <span></span><span></span><span></span>
                  <span></span><span></span><span></span>
                  <span></span><span></span><span></span>
                </span>
                <span class="grid-button__text">Contents</span>
              </button>
              <div class="nav-row__slot is-right">
                <button type="button" class="nav-button" data-action="go-next">Next</button>
              </div>
            </nav>
          </section>
        `;
      }

      function renderSidebar(slide) {
        return `
          <aside class="sidebar-shell">
            <div class="sidebar-shell__content">
              ${renderMetaCard(slide)}
              <div class="sidebar-shell__divider"></div>
              <div class="sidebar-shell__panel">
                ${renderContentsOrHotspots(slide)}
              </div>
            </div>
          </aside>
        `;
      }

      function renderMetaCard(slide) {
        const labelText = slide.title;
        const bodyPlaceholder = slide.kind === 'cover'
          ? 'Tutorial description.'
          : 'Slide description.';
        return `
          <section class="meta-card">
            <div
              class="meta-card__label"
              ${MODE === 'builder' ? 'contenteditable="true"' : ''}
              spellcheck="false"
              data-placeholder="${slide.kind === 'cover' ? 'TUTORIAL SUBTITLE' : 'SLIDE TITLE'}"
              data-bind="slide.title"
              data-single-line="true"
            >${escapeHtml(labelText)}</div>
            <div
              class="meta-card__body"
              ${MODE === 'builder' ? 'contenteditable="true"' : ''}
              spellcheck="false"
              data-placeholder="${escapeAttr(bodyPlaceholder)}"
              data-bind="slide.notes"
            >${escapeMultiline(slide.notes)}</div>
          </section>
        `;
      }

      function renderContentsOrHotspots(slide) {
        if (slide.kind === 'cover') {
          const otherSlides = state.tutorial.slides.slice(1);
          return `
            <section class="contents-card">
              <div class="contents-card__scroller" data-sidebar-scroller>
                ${otherSlides.length ? otherSlides.map((item, index) => `
                  <button type="button" class="contents-jump" data-action="jump-slide" data-slide-index="${index + 1}">
                    <span class="contents-jump__eyebrow">Slide ${index + 1}</span>
                    <span class="contents-jump__title">${escapeHtml(item.title || `Slide ${index + 1}`)}</span>
                  </button>
                `).join('') : `
                  <div class="hotspot-detail">Add slides to build the tutorial list.</div>
                `}
              </div>
              <div class="contents-card__gutter" data-sidebar-track data-enabled="false">
                <div class="contents-card__thumb" data-sidebar-thumb></div>
              </div>
            </section>
          `;
        }

        const hotspots = literalHotspots(slide);
        const hasVideoTriggers = slide.hotspots.some((hotspot) => isVideoModalTrigger(hotspot));
        return `
          <section class="contents-card">
            <div class="contents-card__scroller" data-sidebar-scroller>
              ${hotspots.length ? hotspots.map((hotspot, index) => renderHotspotItem(hotspot, index)).join('') : `
                <div class="hotspot-detail">
                  ${hasVideoTriggers
                    ? 'No literal hotspots on this slide yet. Video modals are edited separately below.'
                    : 'No hotspots on this slide yet. Add a hotspot or use text, image, and audio annotations below.'}
                </div>
              `}
            </div>
            <div class="contents-card__gutter" data-sidebar-track data-enabled="false">
              <div class="contents-card__thumb" data-sidebar-thumb></div>
            </div>
          </section>
        `;
      }

      function renderHotspotItem(hotspot, index) {
        const isActive = state.ui.activeHotspotId === hotspot.id;
        return `
          <div class="hotspot-item">
            <div
              class="hotspot-bar"
              style="background:${escapeAttr(hotspot.color)}"
              data-action="activate-hotspot"
              data-hotspot-id="${hotspot.id}"
            >
              <div
                class="hotspot-bar__title"
                ${MODE === 'builder' ? 'contenteditable="true"' : ''}
                spellcheck="false"
                data-placeholder="HOTSPOT TITLE"
                data-bind="hotspot.title:${hotspot.id}"
                data-single-line="true"
              >${escapeHtml(hotspot.title || `HOTSPOT ${index + 1}`)}</div>
              ${MODE === 'builder' ? `
                <div class="hotspot-bar__tools">
                  <button type="button" class="hotspot-mini-button" data-action="move-hotspot-up-inline" data-hotspot-id="${hotspot.id}" ${index <= 0 ? 'disabled' : ''} aria-label="Move hotspot up">↑</button>
                  <button type="button" class="hotspot-mini-button" data-action="move-hotspot-down-inline" data-hotspot-id="${hotspot.id}" ${index >= literalHotspots(currentSlide()).length - 1 ? 'disabled' : ''} aria-label="Move hotspot down">↓</button>
                </div>
              ` : ''}
            </div>
            ${isActive ? `
              <div
                class="hotspot-detail"
                ${MODE === 'builder' ? 'contenteditable="true"' : ''}
                spellcheck="false"
                data-placeholder="Type hotspot details here."
                data-bind="hotspot.detail:${hotspot.id}"
              >${escapeMultiline(hotspot.detail)}</div>
            ` : ''}
          </div>
        `;
      }

      function renderStage(slide) {
        const mediaStyle = `--media-aspect:${slide.media.aspect.replace(':', ' / ')};`;
        return `
          <div class="stage-canvas" id="stageCanvas">
            <div class="media-frame" style="${mediaStyle}">
              <div class="media-frame__inner" data-fit="${slide.media.fit}" style="aspect-ratio:${slide.media.aspect.replace(':', ' / ')}; background:${escapeAttr(slide.media.matte)}">
                ${renderMedia(slide)}
              </div>
            </div>
            <div class="stage-overlay" id="stageOverlay">
              ${renderAnnotations(slide)}
              ${slide.hotspotsEnabled ? renderHotspots(slide) : ''}
            </div>
          </div>
        `;
      }

      function renderMedia(slide) {
        const url = previewAssetUrl(normalizeAssetUrl(slide.media.url.trim(), slideMediaAssetType(slide)));
        if (!url) {
          if (slide.kind === 'cover') {
            return '<div class="media-placeholder media-placeholder--blank" aria-hidden="true"></div>';
          }
          const placeholder = `${slide.media.type || 'image'} media box`;
          return `<div class="media-placeholder">${placeholder}</div>`;
        }

        if (slide.media.type === 'video') {
          return `
            <video class="media-asset" style="${mediaAssetStyle(slide.media)}" src="${escapeAttr(url)}" controls ${MODE === 'player' ? 'autoplay muted' : ''} playsinline preload="metadata"></video>
          `;
        }

        if (slide.media.type === 'audio') {
          return `<audio class="media-asset media-asset--audio" src="${escapeAttr(url)}" controls preload="metadata"></audio>`;
        }

        return `<img class="media-asset" style="${mediaAssetStyle(slide.media)}" src="${escapeAttr(url)}" alt="" loading="lazy" />`;
      }

      function renderAnnotations(slide) {
        const annotations = [...slide.annotations].sort((a, b) => a.z - b.z);
        return annotations.map((annotation) => renderAnnotation(annotation)).join('');
      }

      function renderAnnotation(annotation) {
        const isSelected = MODE === 'builder'
          && state.ui.selectedKind === 'annotation'
          && state.ui.selectedId === annotation.id;
        const style = annotationStyle(annotation);
        const outlineClass = isSelected ? ' stage-object__outline' : '';

        if (annotation.type === 'text') {
          return `
            <div
              class="stage-object stage-annotation stage-annotation--text${isSelected ? ' is-selected' : ''}"
              data-object-kind="annotation"
              data-object-id="${annotation.id}"
              style="${style}"
            >
              <div
                class="stage-object__frame${outlineClass} ${annotation.fontStyle === 'regular' ? 'text-regular' : annotation.fontStyle === 'bold' ? 'text-bold' : 'text-hand'}"
                ${MODE === 'builder' ? 'contenteditable="true"' : ''}
                spellcheck="false"
                data-placeholder="new note"
                data-bind="annotation.text:${annotation.id}"
                data-object-content="true"
                style="color:${escapeAttr(annotation.color)}"
              >${escapeMultiline(annotation.text || 'new note')}</div>
              ${isSelected ? renderObjectHandles() : ''}
            </div>
          `;
        }

        if (annotation.type === 'image') {
          return `
            <div
              class="stage-object stage-annotation stage-annotation--image${isSelected ? ' is-selected' : ''}"
              data-object-kind="annotation"
              data-object-id="${annotation.id}"
              style="${style}"
            >
                <div class="stage-object__frame${outlineClass}">
                  ${isMarkupAnnotation(annotation)
                    ? renderMarkupAnnotation(annotation)
                    : (annotation.src ? `<img data-annotation-image="${annotation.id}" src="${escapeAttr(previewAssetUrl(normalizeAssetUrl(annotation.src, annotationSourceAssetType(annotation))))}" alt="" loading="lazy" style="transform:${annotation.flipX ? 'scaleX(-1)' : 'none'};" />` : `<div class="media-placeholder">image url</div>`)}
              </div>
              ${isSelected ? renderObjectHandles(annotation) : ''}
            </div>
          `;
        }

        if (annotation.type === 'video') {
          return `
            <div
              class="stage-object stage-annotation stage-annotation--video${isSelected ? ' is-selected' : ''}"
              data-object-kind="annotation"
              data-object-id="${annotation.id}"
              data-action="open-video-annotation"
              data-annotation-id="${annotation.id}"
              style="${style}"
            >
              <div class="stage-object__frame${outlineClass}">
                <img src="${escapeAttr(previewAssetUrl(normalizeAssetUrl(annotation.src, 'image')))}" alt="" loading="lazy" />
              </div>
              ${isSelected ? renderObjectHandles(annotation) : ''}
            </div>
          `;
        }

        if (annotation.type === 'link') {
          return `
            <div
              class="stage-object stage-annotation stage-annotation--link${isSelected ? ' is-selected' : ''}"
              data-object-kind="annotation"
              data-object-id="${annotation.id}"
              data-action="open-link-annotation"
              data-annotation-id="${annotation.id}"
              style="${style}"
            >
              <div class="stage-object__frame${outlineClass}">
                <img src="${escapeAttr(previewAssetUrl(normalizeAssetUrl(annotation.src || LINK_ANNOTATION_ICON_URL, 'image')))}" alt="" loading="lazy" />
              </div>
              ${isSelected ? renderObjectHandles(annotation) : ''}
            </div>
          `;
        }

        const audioLabel = String(annotation.label || '').trim();
        const audioLabelMarkup = MODE === 'builder'
          ? `
              <div
                class="audio-panel__label"
                contenteditable="true"
                spellcheck="false"
                data-placeholder="audio annotation"
                data-bind="annotation.label:${annotation.id}"
                data-single-line="true"
              >${escapeHtml(audioLabel)}</div>
            `
          : (audioLabel ? `<div class="audio-panel__label">${escapeHtml(audioLabel)}</div>` : '');
        return `
          <div
            class="stage-object stage-annotation stage-annotation--audio${isSelected ? ' is-selected' : ''}"
            data-object-kind="annotation"
            data-object-id="${annotation.id}"
            style="${style}"
          >
            <div class="stage-object__frame${outlineClass}">
              <img class="audio-panel__art" src="${escapeAttr(previewAssetUrl(normalizeAssetUrl(AUDIO_ANNOTATION_ICON_URL, 'image')))}" alt="Play audio" loading="lazy" />
              ${audioLabelMarkup}
              <div class="audio-panel__controls">
                <button type="button" class="media-control-button" data-action="rewind-audio" data-media-control="true" data-annotation-id="${annotation.id}" aria-label="Rewind audio">
                  ${renderTransportIcon('rewind')}
                </button>
                <button type="button" class="media-control-button" data-action="toggle-audio" data-media-control="true" data-annotation-id="${annotation.id}" aria-label="${activeAudio === annotation.id ? 'Pause audio' : 'Play audio'}">
                  ${renderTransportIcon(activeAudio === annotation.id ? 'pause' : 'play')}
                </button>
              </div>
            </div>
            ${isSelected ? renderObjectHandles(annotation) : ''}
          </div>
        `;
      }

      function renderHotspots(slide) {
        let hotspotNumber = 0;
        return slide.hotspots.map((hotspot) => {
          const isSelected = MODE === 'builder'
            && state.ui.selectedKind === 'hotspot'
            && state.ui.selectedId === hotspot.id;
          const isVideoTrigger = isVideoModalTrigger(hotspot);
          const objectClass = isVideoTrigger ? 'stage-video-trigger' : 'stage-hotspot';
          const frameClass = isVideoTrigger ? 'stage-video-trigger__frame' : 'stage-hotspot__frame';
          const labelClass = isVideoTrigger ? 'stage-video-trigger__label' : 'stage-hotspot__label';
          const label = isVideoTrigger ? 'Video' : String(++hotspotNumber);
          return `
            <div
              class="stage-object ${objectClass}${isSelected ? ' is-selected' : ''}"
              data-object-kind="hotspot"
              data-object-id="${hotspot.id}"
              data-action="activate-hotspot"
              data-hotspot-id="${hotspot.id}"
              style="${hotspotStyle(hotspot)}"
            >
              <div class="${frameClass}">
                <div class="${labelClass}">${label}</div>
              </div>
              ${isSelected ? renderObjectHandles() : ''}
            </div>
          `;
        }).join('');
      }

      function renderObjectHandles(annotation = null) {
        if (MODE !== 'builder') {
          return '';
        }
        const points = isLineMarkupKey(markupKeyForAnnotation(annotation))
          ? normalizeMarkupPoints(annotation.markupPoints, markupKeyForAnnotation(annotation), annotation.bend)
          : null;
        return `
          <div class="object-handle" data-handle="nw"></div>
          <div class="object-handle" data-handle="ne"></div>
          <div class="object-handle" data-handle="sw"></div>
          <div class="object-handle" data-handle="se"></div>
          <div class="rotate-handle" data-handle="rotate" aria-hidden="true"></div>
          ${points ? `
            <div class="markup-point-handle" data-handle="markup-start" style="left:${points.start.x}%;top:${points.start.y}%" aria-hidden="true"></div>
            <div class="markup-point-handle markup-point-handle--curve" data-handle="markup-curve" style="left:${points.curve.x}%;top:${points.curve.y}%" aria-hidden="true"></div>
            <div class="markup-point-handle" data-handle="markup-end" style="left:${points.end.x}%;top:${points.end.y}%" aria-hidden="true"></div>
          ` : ''}
          <div class="move-grip" data-handle="move">move</div>
        `;
      }

      function renderMarkupAnnotation(annotation) {
        const key = markupKeyForAnnotation(annotation);
        if (!key) {
          return '';
        }
        const markerId = `markup-arrowhead-${escapeAttr(annotation.id)}`;
        const path = isLineMarkupKey(key) ? markupLinePath(annotation) : '';
        const strokeWidth = clampNumber(Number(annotation.markupStrokeWidth ?? (isLineMarkupKey(key) ? 2.5 : 4)), 1, 10);
        if (key === 'x') {
          return `
            <svg class="stage-markup-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path d="M18 18 L82 82 M82 18 L18 82" fill="none" stroke="#000" stroke-linecap="round" stroke-width="${strokeWidth}" vector-effect="non-scaling-stroke"></path>
            </svg>
          `;
        }
        if (key === 'circle-d') {
          return `
            <svg class="stage-markup-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <ellipse cx="50" cy="50" rx="36" ry="28" fill="none" stroke="#000" stroke-dasharray="12 9" stroke-width="${strokeWidth}" vector-effect="non-scaling-stroke"></ellipse>
            </svg>
          `;
        }
        if (key === 'square-d') {
          return `
            <svg class="stage-markup-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <rect x="14" y="14" width="72" height="72" fill="none" stroke="#000" stroke-dasharray="12 9" stroke-width="${strokeWidth}" vector-effect="non-scaling-stroke"></rect>
            </svg>
          `;
        }
        if (key === 'line-d') {
          return `
            <svg class="stage-markup-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path data-markup-primary="true" d="${escapeAttr(path)}" fill="none" stroke="#000" stroke-dasharray="12 10" stroke-linecap="round" stroke-width="${strokeWidth}" vector-effect="non-scaling-stroke"></path>
            </svg>
          `;
        }
        if (key === 'arrow-s') {
          return `
            <svg class="stage-markup-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <marker id="${markerId}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse" markerUnits="strokeWidth">
                  <path d="M0 0 L10 5 L0 10 Z" fill="#000"></path>
                </marker>
              </defs>
              <path data-markup-primary="true" d="${escapeAttr(path)}" fill="none" stroke="#000" stroke-linecap="round" stroke-width="${strokeWidth}" vector-effect="non-scaling-stroke" marker-end="url(#${markerId})"></path>
            </svg>
          `;
        }
        if (key === 'arrow-c') {
          return `
            <svg class="stage-markup-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <marker id="${markerId}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse" markerUnits="strokeWidth">
                  <path d="M0 0 L10 5 L0 10 Z" fill="#000"></path>
                </marker>
              </defs>
              <path data-markup-primary="true" d="${escapeAttr(path)}" fill="none" stroke="#000" stroke-linecap="round" stroke-width="${strokeWidth}" vector-effect="non-scaling-stroke" marker-end="url(#${markerId})"></path>
            </svg>
          `;
        }
        return annotation.src
          ? `<img src="${escapeAttr(previewAssetUrl(normalizeAssetUrl(annotation.src, 'image')))}" alt="" loading="lazy" />`
          : `<div class="media-placeholder">image url</div>`;
      }

      function markupLinePath(annotation) {
        const points = normalizeMarkupPoints(annotation?.markupPoints, markupKeyForAnnotation(annotation), annotation?.bend);
        return `M ${points.start.x} ${points.start.y} Q ${points.curve.x} ${points.curve.y} ${points.end.x} ${points.end.y}`;
      }

      function renderContentsModal() {
        const slides = state.tutorial.slides.map((slide, index) => ({ slide, index }));
        const open = Boolean(state.ui.contentsOpen);
        const hasCover = slides[0]?.slide.kind === 'cover';
        return `
          <div class="modal" id="contentsModal" ${open ? '' : 'hidden'}>
            <div class="modal__panel" role="dialog" aria-modal="true" aria-label="Tutorial contents">
              <div class="modal__header">
                <div>Contents</div>
                <button type="button" data-action="close-contents">Close</button>
              </div>
              <div class="modal__body">
                <div class="contents-grid">
                  ${slides.map(({ slide, index }) => {
                    const slideNumber = hasCover ? index : index + 1;
                    const title = slide.kind === 'cover'

      function buildMediaFolderCatalog(catalog, extraFolders = {}) {
        return {
          image: uniqueCatalogPaths([
            ...deriveFolderPathsFromCatalog(catalog.image || []),
            ...(extraFolders.image || [])
          ]),

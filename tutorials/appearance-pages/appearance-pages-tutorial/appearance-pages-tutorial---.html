          ]),
          video: uniqueCatalogPaths([
            ...deriveFolderPathsFromCatalog(catalog.video || []),
            ...(extraFolders.video || [])
          ])
        };
      }

      function deriveFolderPathsFromCatalog(paths) {
        const folders = [];
        paths.forEach((path) => {
          const segments = String(path || '').split('/').filter(Boolean);
          for (let index = 1; index < segments.length; index += 1) {
            folders.push(segments.slice(0, index).join('/'));
          }
        });
        return uniqueCatalogPaths(folders);
      }

      function uniqueCatalogPaths(values) {
        return Array.from(new Set(values
          .map((value) => String(value || '').trim().replace(/^\/+/, '').replace(/\/+$/, ''))
          .filter(Boolean)));
      }

      function mediaFolderPresetsForAssetType(assetType) {
        const basePresets = [...(MEDIA_FOLDER_PRESETS[assetType] || [])];
        const discoveredFolders = mediaLibraryFolders[assetType] || [];
        const presets = [];
        const seen = new Set();

        basePresets.forEach((preset) => {
          const relative = relativePathWithinManagedAssetType(assetType, preset.url);
          const signature = relative || '__root__';
          if (seen.has(signature)) {
            return;
          }
          seen.add(signature);
          presets.push(preset);
        });

        discoveredFolders.forEach((folderPath) => {
          const relative = String(folderPath || '').trim().replace(/^\/+/, '').replace(/\/+$/, '');
          if (!relative) {
            return;
          }
          if (assetType === 'image' && (relative === 'tutorial-annotations' || relative.startsWith('tutorial-annotations/'))) {
            return;
          }
          if (seen.has(relative)) {
            return;
          }
          seen.add(relative);
          presets.push({
            key: `discovered:${assetType}:${relative}`,
            label: formatDiscoveredFolderLabel(relative),
            url: managedAssetUrlForRelativePath(assetType, relative, true)
          });
        });

        return presets;
      }

      function mediaFolderKeyForValue(assetType, value) {
        const normalizedValue = normalizeAssetUrl(value, assetType);
        const match = mediaFolderPresetsForAssetType(assetType)
          .map((preset) => ({
            key: preset.key,
            normalizedPreset: normalizeAssetUrl(preset.url, assetType)
          }))
          .filter((preset) => normalizedValue === preset.normalizedPreset || normalizedValue.startsWith(preset.normalizedPreset))
          .sort((left, right) => right.normalizedPreset.length - left.normalizedPreset.length)[0];
        return match ? match.key : '';
      }

      function mediaCatalogPathsForAssetType(assetType) {
        return mediaLibraryCatalog[assetType] || [];
      }

      function formatDiscoveredFolderLabel(relativePath) {
        return `${relativePath.replace(/^\/+/, '').replace(/\/+$/, '')}/`;
      }

      function managedAssetUrlForRelativePath(assetType, relativePath, isDirectory = false) {
        const baseUrl = MANAGED_ASSET_BASE_URLS[assetType] || '';
        const normalized = String(relativePath || '').trim().replace(/^\/+/, '').replace(/\/+$/, '');
        if (!normalized) {
          return baseUrl;
        }
        const encodedPath = normalized
          .split('/')
          .filter(Boolean)
          .map((segment) => encodeURIComponent(segment))
          .join('/');
        return `${baseUrl}${encodedPath}${isDirectory ? '/' : ''}`;
      }

      function relativePathWithinManagedAssetType(assetType, value) {
        const normalizedValue = normalizeAssetUrl(value, assetType);
        const baseUrl = MANAGED_ASSET_BASE_URLS[assetType];
        if (!normalizedValue || !baseUrl) {
          return '';
        }
        try {
          const parsedValue = new URL(normalizedValue, location.href);
          const parsedBase = new URL(baseUrl, location.href);
          if (parsedValue.origin !== parsedBase.origin) {
            return '';
          }
          const basePath = parsedBase.pathname.endsWith('/') ? parsedBase.pathname : `${parsedBase.pathname}/`;
          if (!parsedValue.pathname.startsWith(basePath)) {
            return '';
          }
          return decodeURIComponent(parsedValue.pathname.slice(basePath.length)).replace(/^\/+/, '').replace(/\/+$/, '');
        } catch (error) {
          return '';
        }
      }

      function mediaLibraryFilterPrefix(assetType, presetKey) {
        if (!presetKey) {
          return '';
        }
        const preset = mediaFolderPresetsForAssetType(assetType).find((item) => item.key === presetKey);
        if (!preset) {
          return '';
        }
        const relative = relativePathWithinManagedAssetType(assetType, preset.url);
        return relative ? `${relative.replace(/\/+$/, '')}/` : '';
      }

      function mediaLibraryOptionGroups(assetType, presetKey) {
        const prefix = mediaLibraryFilterPrefix(assetType, presetKey);
        const grouped = new Map();
        mediaCatalogPathsForAssetType(assetType)
          .filter((path) => assetType !== 'image' || !path.startsWith('tutorial-annotations/'))
          .filter((path) => !prefix || path.startsWith(prefix))
          .forEach((path) => {
            const displayPath = prefix ? path.slice(prefix.length) : path;
            if (!displayPath) {
              return;
            }
            const slashIndex = displayPath.indexOf('/');
            const groupLabel = slashIndex >= 0 ? `${displayPath.slice(0, slashIndex)}/` : 'Files in this folder';
            if (!grouped.has(groupLabel)) {
              grouped.set(groupLabel, []);
            }
            grouped.get(groupLabel).push({
              value: path,
              label: displayPath
            });
          });
        return Array.from(grouped.entries()).map(([label, options]) => ({ label, options }));
      }

      function renderMediaFolderSelect(assetType, inputId, currentValue, emptyLabel) {
        const presets = mediaFolderPresetsForAssetType(assetType);
        if (!presets.length) {
          return '';
        }
        const selectedKey = mediaFolderKeyForValue(assetType, currentValue);
        return `
          <select data-media-folder-target="${escapeAttr(inputId)}" data-media-folder-asset-type="${escapeAttr(assetType)}" aria-label="${escapeAttr(`${mediaTypeLabel(assetType)} folder`)}">
            <option value="">${escapeHtml(emptyLabel)}</option>
            ${presets.map((preset) => `
              <option value="${escapeAttr(preset.key)}" ${preset.key === selectedKey ? 'selected' : ''}>${escapeHtml(preset.label)}</option>
            `).join('')}
          </select>
        `;
      }

      function renderMediaLibrarySelect(assetType, inputId, currentValue, emptyLabel) {
        const selectedFolderKey = mediaFolderKeyForValue(assetType, currentValue);
        const groups = mediaLibraryOptionGroups(assetType, selectedFolderKey);
        if (!groups.length) {
          return `
            <select disabled aria-label="${escapeAttr(`${mediaTypeLabel(assetType)} file`)}">
              <option value="">${escapeHtml(selectedFolderKey ? 'No known files in this folder yet' : 'Choose a folder first')}</option>
            </select>
          `;
        }
        const selectedPath = relativePathWithinManagedAssetType(assetType, currentValue);
        return `
          <select data-media-library-target="${escapeAttr(inputId)}" data-media-library-asset-type="${escapeAttr(assetType)}" data-media-library-folder-key="${escapeAttr(selectedFolderKey)}" aria-label="${escapeAttr(`${mediaTypeLabel(assetType)} file`)}">
            <option value="">${escapeHtml(emptyLabel)}</option>
            ${groups.map((group) => `
              <optgroup label="${escapeAttr(group.label)}">
                ${group.options.map((option) => `
                  <option value="${escapeAttr(option.value)}" ${option.value === selectedPath ? 'selected' : ''}>${escapeHtml(option.label)}</option>
                `).join('')}
              </optgroup>
            `).join('')}
          </select>
        `;
      }

      function slideMediaAssetType(slide) {
        return ['image', 'gif', 'video', 'audio'].includes(slide?.media?.type)
          ? slide.media.type
          : (slide?.kind === 'video' ? 'video' : 'image');
      }

      function tutorialSlugFromMediaUrl(value) {
        try {
          const parsed = new URL(normalizeAssetUrl(value), location.href);
          const match = parsed.pathname.match(/\/tutorials\/([^/]+\/[^/]+)(?:\/|$)/i);
          return match ? decodeURIComponent(match[1]) : '';
        } catch (error) {
          return '';
        }
      }

      function selectedTutorialFolderSlug() {
        return normalizeTutorialFolderPath(
          state.meta.mediaTutorialSlug
          || tutorialSlugFromMediaUrl(currentSlide()?.media?.url)
          || String(state.meta.filename || '').replace(/\.html$/i, '')
          || state.tutorial.title
          || 'tutorial'
        );
      }

      function tutorialMediaBaseUrl(tutorialSlug) {
        const encoded = normalizeTutorialFolderPath(tutorialSlug).split('/').map(encodeURIComponent).join('/');
        return `${MEDIA_LIBRARY_SITE_ORIGIN}/tutorials/${encoded}/`;
      }

      function normalizeTutorialFolderPath(value) {
        return String(value || '').split('/').filter(Boolean).slice(0, 2).map((segment) => String(segment).trim().replace(/\s+/g, '-').replace(/[^A-Za-z0-9._-]/g, '')).filter(Boolean).join('/');
      }

      function tutorialFolderOptions(currentValue = '') {
        const currentSlug = tutorialSlugFromMediaUrl(currentValue);
        return uniqueCatalogPaths([
          currentSlug,
          selectedTutorialFolderSlug(),
          ...tutorialFolderCatalog
        ]).filter((slug) => !slug.startsWith('codex-disposable-'));
      }

      function renderTutorialFolderSelect(assetType, currentValue) {
        const selectedSlug = tutorialSlugFromMediaUrl(currentValue) || selectedTutorialFolderSlug();
        const options = tutorialFolderOptions(currentValue);
        const selectedTopic = selectedSlug.split('/')[0] || state.meta.category || '';
        const topics = uniqueCatalogPaths(options.map((slug) => slug.split('/')[0]).filter(Boolean));
        const tutorials = options.filter((slug) => slug.split('/')[0] === selectedTopic);
        return `
          <select id="pageTutorialTopic" aria-label="Tutorial topic">
            <option value="">Choose topic</option>
            ${topics.map((topic) => `<option value="${escapeAttr(topic)}" ${topic === selectedTopic ? 'selected' : ''}>${escapeHtml(topic)}</option>`).join('')}
          </select>
          <select id="pageTutorialFolder" aria-label="Tutorial folder">
            <option value="">Choose tutorial assets folder</option>
            ${tutorials.map((slug) => `<option value="${escapeAttr(slug)}" ${slug === selectedSlug ? 'selected' : ''}>${escapeHtml(slug.split('/')[1] || slug)}</option>`).join('')}
          </select>
        `;
      }

      function renderTutorialFileSelect(assetType, currentValue, selectId = 'pageTutorialFile') {
        const tutorialSlug = tutorialSlugFromMediaUrl(currentValue) || selectedTutorialFolderSlug();
        const files = tutorialMediaCatalog[tutorialSlug]?.[assetType] || [];
        const baseUrl = tutorialMediaBaseUrl(tutorialSlug, assetType);
        const currentFile = normalizeAssetUrl(currentValue).startsWith(baseUrl)
          ? decodeURIComponent(normalizeAssetUrl(currentValue).slice(baseUrl.length))
          : '';
        const options = uniqueCatalogPaths([currentFile, ...files]);
        return `
          <select id="${escapeAttr(selectId)}" aria-label="Tutorial ${escapeAttr(mediaTypeLabel(assetType))} file" ${options.length ? '' : 'disabled'}>
            <option value="">${options.length ? `Choose ${escapeHtml(mediaTypeLabel(assetType))} file` : 'No files listed for this tutorial yet'}</option>
            ${options.map((path) => `<option value="${escapeAttr(path)}" ${path === currentFile ? 'selected' : ''}>${escapeHtml(path)}</option>`).join('')}
          </select>
        `;
      }

      function renderTutorialAllMediaSelect(currentValue) {
        const tutorialSlug = tutorialSlugFromMediaUrl(currentValue) || selectedTutorialFolderSlug();
        const catalog = tutorialMediaCatalog[tutorialSlug] || {};
        const items = ['image', 'gif', 'video', 'audio'].flatMap((type) =>
          (catalog[type] || []).map((path) => ({ type, path }))
        );
        const currentType = slideMediaAssetType(currentSlide());
        const baseUrl = tutorialMediaBaseUrl(tutorialSlug);
        const currentPath = normalizeAssetUrl(currentValue).startsWith(baseUrl)
          ? decodeURIComponent(normalizeAssetUrl(currentValue).slice(baseUrl.length))
          : '';
        return `
          <select id="pageTutorialMediaFile" aria-label="Select media from tutorial folder" ${items.length ? '' : 'disabled'}>
            <option value="">${items.length ? 'Select media' : 'No media listed for this tutorial yet'}</option>
            ${items.map(({ type, path }) => `<option value="${escapeAttr(`${type}|${path}`)}" ${type === currentType && path === currentPath ? 'selected' : ''}>${escapeHtml(path)} (${escapeHtml(mediaTypeLabel(type))})</option>`).join('')}
          </select>
        `;
      }

      function mediaTypeLabel(assetType) {
        return assetType === 'gif' ? 'GIF' : assetType;
      }

      function annotationSourceAssetType(annotation) {
        return annotation?.type === 'audio' ? 'audio' : 'image';
      }

      function annotationPickerItems() {
        const discovered = mediaCatalogPathsForAssetType('image')
          .filter((path) => path.startsWith('tutorial-annotations/'))
          .map((path) => ({
            label: decodeURIComponent(path.split('/').pop() || path),
            url: managedAssetUrlForRelativePath('image', path)
          }));
        const fallback = IMAGE_ANNOTATION_PRESETS
          .filter((preset) => preset.key !== 'video-modal' && preset.key !== 'link-annotation');
        const seen = new Set();
        return [...discovered, ...fallback].filter((item) => {
          const key = normalizeAssetUrl(item.url, 'image');
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        }).sort((a, b) => a.label.localeCompare(b.label));
      }

      function renderTransportIcon(type) {
        const builtinUrl = type === 'rewind'
          ? 'builtin://transport/rewind'
          : type === 'pause'
            ? 'builtin://transport/pause'
            : 'builtin://transport/play';
        return `<img src="${escapeAttr(normalizeAssetUrl(builtinUrl))}" alt="" loading="eager" decoding="async" draggable="false" />`;
      }

      function syncTransportToggleButton(button, isPlaying) {
        if (!button) {
          return;
        }
        button.innerHTML = renderTransportIcon(isPlaying ? 'pause' : 'play');
        button.setAttribute('aria-label', isPlaying ? 'Pause media' : 'Play media');
      }

      function bindGlobalEvents() {
        document.addEventListener('keydown', onKeyDown);
        window.addEventListener('resize', syncSidebarScrollbar);
        if (MODE === 'builder') {
          window.addEventListener('focus', scheduleLocalMediaDiscoveryRefresh);
          document.addEventListener('visibilitychange', onDocumentVisibilityChange);
        }
      }

      function onDocumentVisibilityChange() {
        if (document.visibilityState === 'visible') {
          scheduleLocalMediaDiscoveryRefresh();
        }
      }

      function bindSiteHeaderEvents() {
        const mobileToggle = root.querySelector('[data-site-mobile-toggle]');
        const mobilePanel = root.querySelector('[data-site-mobile-panel]');
        const dropdowns = Array.from(root.querySelectorAll('[data-site-dropdown]'));

        const closeMobilePanel = () => {
          if (!mobileToggle || !mobilePanel) {
            return;
          }
          mobilePanel.hidden = true;
          mobileToggle.setAttribute('aria-expanded', 'false');
        };

        const closeDropdowns = (except = null) => {
          dropdowns.forEach((dropdown) => {
            if (dropdown === except) {
              return;
            }
            dropdown.dataset.open = 'false';
            const trigger = dropdown.querySelector('[data-site-dropdown-toggle]');
            if (trigger) {
              trigger.setAttribute('aria-expanded', 'false');
            }
          });
        };

        if (mobileToggle && mobilePanel) {
          mobileToggle.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            const isOpen = !mobilePanel.hidden;
            mobilePanel.hidden = isOpen;
            mobileToggle.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
            closeDropdowns();
          });

          mobilePanel.addEventListener('click', (event) => {
            if (event.target.closest('a')) {
              closeMobilePanel();
            }
          });
        }

        dropdowns.forEach((dropdown) => {
          const trigger = dropdown.querySelector('[data-site-dropdown-toggle]');
          if (!trigger) {
            return;
          }
          trigger.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            const willOpen = dropdown.dataset.open !== 'true';
            closeMobilePanel();
            closeDropdowns(willOpen ? dropdown : null);
            dropdown.dataset.open = willOpen ? 'true' : 'false';
            trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
          });
        });

        document.addEventListener('click', onSiteHeaderDocumentClick);
      }

      function scheduleLocalMediaDiscoveryRefresh() {
        if (MODE !== 'builder' || localMediaDiscoveryRefreshScheduled) {
          return;
        }
        localMediaDiscoveryRefreshScheduled = true;
        Promise.resolve().then(async () => {
          try {
            await refreshLocalMediaDiscovery();
          } finally {
            localMediaDiscoveryRefreshScheduled = false;
          }
        });
      }

      async function refreshLocalMediaDiscovery() {
        if (MODE !== 'builder' || !isLocalBuilderPreview()) {
          return false;
        }
        if (localMediaDiscoveryPromise) {
          return localMediaDiscoveryPromise;
        }
        localMediaDiscoveryPromise = (async () => {
          const [discovered, tutorialDiscovered] = await Promise.all([
            discoverLocalMediaLibrary(),
            discoverLocalTutorialMediaLibrary()
          ]);
          if (!discovered && !tutorialDiscovered) {
            return false;
          }

          const nextCatalog = {
            image: uniqueCatalogPaths(discovered?.image?.files.length ? discovered.image.files : mediaLibraryCatalog.image),
            gif: uniqueCatalogPaths(discovered?.gif?.files.length ? discovered.gif.files : mediaLibraryCatalog.gif),
            audio: uniqueCatalogPaths(discovered?.audio?.files.length ? discovered.audio.files : mediaLibraryCatalog.audio),
            video: uniqueCatalogPaths(discovered?.video?.files.length ? discovered.video.files : mediaLibraryCatalog.video)
          };
          const nextFolders = buildMediaFolderCatalog(nextCatalog, {
            image: discovered?.image?.folders || [],
            gif: discovered?.gif?.folders || [],
            audio: discovered?.audio?.folders || [],
            video: discovered?.video?.folders || []
          });
          const nextTutorialFolders = Object.freeze(tutorialDiscovered?.folders || []);
          const nextTutorialCatalog = Object.freeze(tutorialDiscovered?.catalog || {});

          if (mediaDiscoverySignature(nextCatalog, nextFolders, nextTutorialFolders, nextTutorialCatalog) === mediaDiscoverySignature(mediaLibraryCatalog, mediaLibraryFolders, tutorialFolderCatalog, tutorialMediaCatalog)) {
            return false;
          }

          mediaLibraryCatalog = Object.freeze(nextCatalog);
          mediaLibraryFolders = Object.freeze(nextFolders);
          tutorialFolderCatalog = nextTutorialFolders;
          tutorialMediaCatalog = nextTutorialCatalog;
          saveTutorialMediaCatalog(nextTutorialFolders, nextTutorialCatalog);
          render();
          return true;
        })().finally(() => {
          localMediaDiscoveryPromise = null;
        });
        return localMediaDiscoveryPromise;
      }

      function mediaDiscoverySignature(catalog, folders, tutorialFolders = [], tutorialCatalog = {}) {
        return JSON.stringify({
          catalog,
          folders,
          tutorialFolders,
          tutorialCatalog
        });
      }

      function isLocalBuilderPreview() {
        return location.protocol.startsWith('http') && /^(localhost|127(?:\.\d{1,3}){3}|\[::1\]|::1)$/i.test(location.hostname);
      }

      function localAssetDirectoryHrefs(assetType) {
        const legacyFolder = assetType === 'image' ? 'images/' : assetType === 'gif' ? 'gifs/' : `${assetType}/`;
        return [new URL(`/${legacyFolder}`, location.origin).href];
      }

      async function discoverLocalTutorialMediaLibrary() {
        const result = await walkLocalAssetDirectory(new URL('/tutorials/', location.origin).href, '', new Set(), 0);
        if (!result) return null;
        const catalog = {};
        const folders = new Set();
        result.folders.forEach((path) => {
          const segments = String(path || '').split('/').filter(Boolean);
          const tutorialSlug = segments.length >= 2 ? normalizeTutorialFolderPath(`${segments[0]}/${segments[1]}`) : '';
          if (tutorialSlug && !tutorialSlug.includes('codex-disposable-')) folders.add(tutorialSlug);
        });
        result.files.forEach((path) => {
          const segments = String(path || '').split('/').filter(Boolean);
          if (segments.length < 3) return;
          const tutorialSlug = normalizeTutorialFolderPath(`${segments.shift()}/${segments.shift()}`);
          const type = mediaTypeFromUrl(segments.join('/'));
          if (!type || !segments.length || tutorialSlug.startsWith('codex-disposable-')) return;
          folders.add(tutorialSlug);
          catalog[tutorialSlug] ||= { image: [], gif: [], video: [], audio: [] };
          catalog[tutorialSlug][type].push(segments.join('/'));
        });
        Object.values(catalog).forEach((types) => {
          Object.keys(types).forEach((type) => { types[type] = uniqueCatalogPaths(types[type]); });
        });
        return { folders: Array.from(folders).sort(), catalog };
      }

      async function discoverLocalMediaLibrary() {
        const image = await scanLocalAssetDirectory('image');
        const gif = await scanLocalAssetDirectory('gif');
        const audio = await scanLocalAssetDirectory('audio');
        const video = await scanLocalAssetDirectory('video');
        if (!image && !gif && !audio && !video) {
          return null;
        }
        return {
          image: image || { files: mediaLibraryCatalog.image || [], folders: mediaLibraryFolders.image || [] },
          gif: gif || { files: mediaLibraryCatalog.gif || [], folders: mediaLibraryFolders.gif || [] },
          audio: audio || { files: mediaLibraryCatalog.audio || [], folders: mediaLibraryFolders.audio || [] },
          video: video || { files: mediaLibraryCatalog.video || [], folders: mediaLibraryFolders.video || [] }
        };
      }

      async function scanLocalAssetDirectory(assetType) {
        const combined = { files: [], folders: [] };
        let found = false;
        for (const rootHref of localAssetDirectoryHrefs(assetType)) {
          const result = await walkLocalAssetDirectory(rootHref, '', new Set(), 0);
          if (!result) continue;
          found = true;
          combined.files.push(...result.files);
          combined.folders.push(...result.folders);
        }
        return found ? { files: uniqueCatalogPaths(combined.files), folders: uniqueCatalogPaths(combined.folders) } : null;
      }

      async function walkLocalAssetDirectory(directoryHref, relativePrefix, visited, depth) {
        if (visited.has(directoryHref) || depth > 6) {
          return { files: [], folders: [] };
        }
        visited.add(directoryHref);

        let response;
        try {
          response = await fetch(directoryHref, { cache: 'no-store' });
        } catch (error) {
          return null;
        }
        if (!response.ok) {
          return null;
        }

        const contentType = (response.headers.get('content-type') || '').toLowerCase();
        if (!contentType.includes('text/html')) {
          return null;
        }

        const html = await response.text();
        const links = extractDirectoryListingLinks(html);
        if (!links.length) {
          return { files: [], folders: [] };
        }

        const files = [];
        const folders = [];

        for (const href of links) {
          const normalizedHref = String(href || '').trim();
          if (!normalizedHref || normalizedHref === '../' || normalizedHref.startsWith('?') || normalizedHref.startsWith('#')) {
            continue;
          }
          const decodedHref = decodeURIComponent(normalizedHref);
          const candidate = normalizeDiscoveredRelativePath(`${relativePrefix}${decodedHref}`);
          if (!candidate || isHiddenDiscoveredPath(candidate)) {
            continue;
          }
          if (normalizedHref.endsWith('/')) {
            folders.push(candidate);
            const nested = await walkLocalAssetDirectory(new URL(normalizedHref, directoryHref).href, `${candidate}/`, visited, depth + 1);
            if (nested) {
              folders.push(...nested.folders);
              files.push(...nested.files);
            }
            continue;
          }
          files.push(candidate);
        }

        return {
          files: uniqueCatalogPaths(files),
          folders: uniqueCatalogPaths(folders)
        };
      }

      function extractDirectoryListingLinks(html) {
        const parser = new DOMParser();
        const documentNode = parser.parseFromString(String(html || ''), 'text/html');
        return Array.from(documentNode.querySelectorAll('a[href]'))
          .map((link) => link.getAttribute('href') || '');
      }

      function normalizeDiscoveredRelativePath(value) {
        const withoutHash = String(value || '').split('#')[0].split('?')[0].trim();
        if (!withoutHash) {
          return '';
        }
        const normalized = withoutHash.replace(/\\/g, '/');
        const segments = normalized.split('/').filter(Boolean);
        if (!segments.length || segments.some((segment) => segment === '.' || segment === '..')) {
          return '';
        }
        return segments.join('/');
      }

      function isHiddenDiscoveredPath(relativePath) {
        return relativePath.split('/').some((segment) => segment.startsWith('.'));
      }

      function onSiteHeaderDocumentClick(event) {
        const mobilePanel = root.querySelector('[data-site-mobile-panel]');
        const mobileToggle = root.querySelector('[data-site-mobile-toggle]');
        if (mobilePanel && !mobilePanel.hidden && !event.target.closest('[data-site-mobile-panel], [data-site-mobile-toggle]')) {
          mobilePanel.hidden = true;
          if (mobileToggle) {
            mobileToggle.setAttribute('aria-expanded', 'false');
          }
        }

        root.querySelectorAll('[data-site-dropdown][data-open="true"]').forEach((dropdown) => {
          if (event.target.closest('[data-site-dropdown]') === dropdown) {
            return;
          }
          dropdown.dataset.open = 'false';
          const trigger = dropdown.querySelector('[data-site-dropdown-toggle]');
          if (trigger) {
            trigger.setAttribute('aria-expanded', 'false');
          }
        });
      }

      function bindInteractiveEvents() {
        document.removeEventListener('click', onSiteHeaderDocumentClick);
        bindSiteHeaderEvents();

        root.querySelectorAll('[data-action]').forEach((element) => {
          element.addEventListener('click', onActionClick);
        });

        root.querySelectorAll('[data-bind]').forEach((element) => {
          element.addEventListener('focus', onBoundFocus);
          element.addEventListener('input', onBoundInput);
          element.addEventListener('blur', onBoundBlur);
          element.addEventListener('keydown', onBoundKeydown);
        });

        const objectMediaUrlInput = root.querySelector('#objectMediaUrl');
        if (objectMediaUrlInput) {
          objectMediaUrlInput.addEventListener('input', () => {
            objectMediaUrl = objectMediaUrlInput.value.trim();
            const addButton = root.querySelector('[data-action="add-media-object"]');
            if (addButton) addButton.disabled = !objectMediaUrl;
          });
          objectMediaUrlInput.addEventListener('change', () => {
            objectMediaUrl = objectMediaUrlInput.value.trim();
            setStatus(objectMediaUrl ? `Selected ${objectMediaType} for the Media Box.` : 'Choose a Media Box file.');
            render();
          });
        }

        const objectMediaTypeSelect = root.querySelector('#objectMediaType');
        if (objectMediaTypeSelect) {
          objectMediaTypeSelect.addEventListener('change', () => {
            objectMediaType = objectMediaTypeSelect.value;
            objectMediaUrl = '';
            setStatus(`Media Box now shows ${objectMediaType === 'gif' ? 'GIF' : objectMediaType} folders and files.`);
            render();
          });
        }

        const videoTutorialMediaFile = root.querySelector('#videoTutorialMediaFile');
        if (videoTutorialMediaFile) {
          videoTutorialMediaFile.addEventListener('change', () => {

      function bindSidebarScrollbars() {
        syncSidebarShellHeight();
        const scroller = root.querySelector('[data-sidebar-scroller]');
        const track = root.querySelector('[data-sidebar-track]');
        const thumb = root.querySelector('[data-sidebar-thumb]');
        if (!scroller || !track || !thumb) {
          return;
        }

        scroller.addEventListener('scroll', syncSidebarScrollbar, { passive: true });
        track.addEventListener('pointerdown', onSidebarTrackPointerDown);
        thumb.addEventListener('pointerdown', onSidebarThumbPointerDown);
        window.requestAnimationFrame(syncSidebarScrollbar);
      }

      function syncSidebarShellHeight() {
        const sidebar = root.querySelector('.sidebar-shell');
        const stage = root.querySelector('.stage-card');
        if (!sidebar || !stage) {
          return;
        }
        sidebar.style.height = `${Math.round(stage.getBoundingClientRect().height)}px`;
      }

      function syncSidebarScrollbar() {
        syncSidebarShellHeight();
        const scroller = root.querySelector('[data-sidebar-scroller]');
        const track = root.querySelector('[data-sidebar-track]');
        const thumb = root.querySelector('[data-sidebar-thumb]');
        if (!scroller || !track || !thumb) {
          return;
        }

        const viewportHeight = scroller.clientHeight;
        const scrollHeight = scroller.scrollHeight;
        const trackHeight = track.clientHeight;
        if (!viewportHeight || !scrollHeight || !trackHeight) {
          return;
        }

        const visibleRatio = Math.min(1, viewportHeight / scrollHeight);
        const thumbHeight = Math.min(trackHeight, Math.max(36, Math.round(trackHeight * visibleRatio)));
        const maxThumbOffset = Math.max(0, trackHeight - thumbHeight);
        const maxScroll = Math.max(0, scrollHeight - viewportHeight);
        const scrollRatio = maxScroll ? (scroller.scrollTop / maxScroll) : 0;

        thumb.style.height = `${thumbHeight}px`;
        thumb.style.transform = `translateY(${maxThumbOffset * scrollRatio}px)`;
        track.dataset.enabled = maxScroll > 1 ? 'true' : 'false';
      }

      function onSidebarTrackPointerDown(event) {
        const thumb = event.currentTarget.querySelector('[data-sidebar-thumb]');
        if (event.target === thumb) {
          return;
        }

        const scroller = root.querySelector('[data-sidebar-scroller]');
        if (!scroller) {
          return;
        }

        const rect = event.currentTarget.getBoundingClientRect();
        const clickRatio = clampNumber((event.clientY - rect.top) / rect.height, 0, 1);
        scroller.scrollTop = (scroller.scrollHeight - scroller.clientHeight) * clickRatio;
        syncSidebarScrollbar();
      }

      function onSidebarThumbPointerDown(event) {
        const scroller = root.querySelector('[data-sidebar-scroller]');
        const track = root.querySelector('[data-sidebar-track]');
        if (!scroller || !track) {
          return;
        }

        sidebarScrollbarSession = {
          scroller,
          track,
          thumb: event.currentTarget,
          startY: event.clientY,
          startScrollTop: scroller.scrollTop
        };
        event.currentTarget.setPointerCapture(event.pointerId);
        window.addEventListener('pointermove', onSidebarThumbPointerMove);
        window.addEventListener('pointerup', onSidebarThumbPointerUp);
        event.preventDefault();
      }

      function onSidebarThumbPointerMove(event) {
        if (!sidebarScrollbarSession) {
          return;
        }

        const {
          scroller,
          track,
          thumb,
          startY,
          startScrollTop
        } = sidebarScrollbarSession;
        const maxScroll = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
        const maxThumbTravel = Math.max(1, track.clientHeight - thumb.offsetHeight);
        const deltaY = event.clientY - startY;
        scroller.scrollTop = startScrollTop + ((deltaY / maxThumbTravel) * maxScroll);
        syncSidebarScrollbar();
      }

      function onSidebarThumbPointerUp() {
        if (!sidebarScrollbarSession) {
          return;
        }

        sidebarScrollbarSession = null;
        window.removeEventListener('pointermove', onSidebarThumbPointerMove);
        window.removeEventListener('pointerup', onSidebarThumbPointerUp);
      }

      function bindStagePointerEvents() {
        const overlay = root.querySelector('#stageOverlay');
        if (!overlay || MODE !== 'builder') {
          return;
        }

        overlay.querySelectorAll('.stage-object').forEach((element) => {
          element.addEventListener('pointerdown', onStagePointerDown);
        });
        overlay.querySelectorAll('[data-annotation-image]').forEach((image) => {
          const syncAspect = () => {
            const annotation = currentSlide().annotations.find((item) => item.id === image.dataset.annotationImage);
            if (!annotation || isMarkupAnnotation(annotation) || !image.naturalWidth || !image.naturalHeight) return;
            const aspect = image.naturalWidth / image.naturalHeight;
            if (Math.abs((annotation.naturalAspect || 0) - aspect) < 0.001) return;
            annotation.naturalAspect = aspect;
            const stage = root.querySelector('#stageCanvas');
            if (stage) annotation.h = clampPercent(((annotation.w / 100) * stage.clientWidth / aspect) / stage.clientHeight * 100, annotation.h, 4, 90);
            markDirty();
            applyLiveObjectStyle('annotation', annotation.id);
          };
          if (image.complete) syncAspect(); else image.addEventListener('load', syncAspect, { once: true });
        });
      }

      function onStagePointerDown(event) {
        const object = event.currentTarget;
        const id = object.dataset.objectId;
        const kind = object.dataset.objectKind;
        if (!id || !kind) {
          return;
        }

        if (event.target.closest('[data-media-control="true"]')) {
          selectObject(kind, id, false);
          return;
        }

        if (event.target.closest('[data-object-content="true"]')) {
          selectObject(kind, id, false);
          return;
        }

        const handle = event.target.closest('[data-handle]')?.dataset.handle || null;
        const slide = currentSlide();
        const target = findSelectable(slide, kind, id);
        if (!target) {
          return;
        }

        pushHistory();
        selectObject(kind, id, false);

        const stage = root.querySelector('#stageCanvas');
        if (!stage) {
          return;
        }

        const stageRect = stage.getBoundingClientRect();
        const centerX = stageRect.left + ((target.x || 50) / 100) * stageRect.width;
        const centerY = stageRect.top + ((target.y || 50) / 100) * stageRect.height;
        pointerSession = {
          kind,
          id,
          handle: handle || 'move',
          stageRect,
          startX: event.clientX,
          startY: event.clientY,
          initial: cloneForHistory(target),
          centerX,
          centerY,
          startRotation: Number(target.rotation || 0),
          startPointerAngle: Math.atan2(event.clientY - centerY, event.clientX - centerX)
        };

        object.setPointerCapture(event.pointerId);
        window.addEventListener('pointermove', onStagePointerMove);
        window.addEventListener('pointerup', onStagePointerUp);
      }

      function onStagePointerMove(event) {
        if (!pointerSession) {
          return;
        }

        const slide = currentSlide();
        const target = findSelectable(slide, pointerSession.kind, pointerSession.id);
        if (!target) {
          return;
        }

        const dx = ((event.clientX - pointerSession.startX) / pointerSession.stageRect.width) * 100;
        const dy = ((event.clientY - pointerSession.startY) / pointerSession.stageRect.height) * 100;
        const initial = pointerSession.initial;

        if (pointerSession.handle === 'rotate') {
          const currentAngle = Math.atan2(event.clientY - pointerSession.centerY, event.clientX - pointerSession.centerX);
          const deltaDegrees = (currentAngle - pointerSession.startPointerAngle) * (180 / Math.PI);
          target.rotation = clampNumber(pointerSession.startRotation + deltaDegrees, -180, 180);
        } else if (pointerSession.handle.startsWith('markup-')) {
          if (!isLineMarkupKey(markupKeyForAnnotation(target))) return;
          const pointName = pointerSession.handle.replace('markup-', '');
          const normalizedName = pointName === 'curve' ? 'curve' : pointName;
          target.markupPoints = normalizeMarkupPoints(target.markupPoints, markupKeyForAnnotation(target), target.bend);
          target.markupPoints[normalizedName] = markupPointForPointer(pointerSession, event.clientX, event.clientY);
          markDirty();
          applyLiveMarkupShape(pointerSession.id);
          return;

          target.x = clampPercent(initial.x + dx, initial.x);
          target.y = clampPercent(initial.y + dy, initial.y);

          const newW = clampPercent(initial.w + (dx * signs.w), initial.w, 5, 90);
          let newH = clampPercent(initial.h + (dy * signs.h), initial.h, 4, 90);
          if (target.type === 'image' && !isMarkupAnnotation(target) && target.naturalAspect > 0) {
            newH = clampPercent(((newW / 100) * pointerSession.stageRect.width / target.naturalAspect) / pointerSession.stageRect.height * 100, initial.h, 4, 90);
          }
          target.w = newW;
          target.h = newH;
          target.x = clampPercent(initial.x + (dx * signs.x), initial.x);
          const heightDelta = newH - initial.h;
          target.y = clampPercent(initial.y + (heightDelta * (pointerSession.handle.startsWith('n') ? -0.5 : 0.5)), initial.y);
        }

        markDirty();
        applyLiveObjectStyle(pointerSession.kind, pointerSession.id);
      }

      function onStagePointerUp() {
        if (!pointerSession) {
          return;
        }
        const session = pointerSession;
        pointerSession = null;
        window.removeEventListener('pointermove', onStagePointerMove);
        window.removeEventListener('pointerup', onStagePointerUp);
        commit(session.handle.startsWith('markup-') ? 'Updated markup path.' : 'Updated object position.');
      }

      function resizeSigns(handle) {
        switch (handle) {
          case 'nw':
            return { w: -1, h: -1, x: 0.5, y: 0.5 };
          case 'ne':
            return { w: 1, h: -1, x: 0.5, y: 0.5 };
          case 'sw':
            return { w: -1, h: 1, x: 0.5, y: 0.5 };
          case 'se':
          default:
            return { w: 1, h: 1, x: 0.5, y: 0.5 };

      }

      function bendPointForPointer(session, clientX, clientY) {
        const radians = -((session.startRotation || 0) * (Math.PI / 180));
        const offsetX = clientX - session.centerX;
        const offsetY = clientY - session.centerY;
        const localX = (offsetX * Math.cos(radians)) - (offsetY * Math.sin(radians));
        const localY = (offsetX * Math.sin(radians)) + (offsetY * Math.cos(radians));
        const objectWidth = (session.initial.w / 100) * session.stageRect.width;
        const objectHeight = (session.initial.h / 100) * session.stageRect.height;
        return normalizeMarkupBend({
          x: ((localX / Math.max(objectWidth, 1)) + 0.5) * 100,
          y: ((localY / Math.max(objectHeight, 1)) + 0.5) * 100
        });
      }

      function markupPointForPointer(session, clientX, clientY) {
        return bendPointForPointer(session, clientX, clientY);
      }

      function onActionClick(event) {
        const element = event.currentTarget;
        const action = element.dataset.action;
        if (!action) {
          return;
        }

        if (action === 'toggle-audio') {
          event.preventDefault();
          event.stopPropagation();
          toggleAudioAnnotation(element.dataset.annotationId);
          return;
        }

        if (action === 'rewind-audio') {
          event.preventDefault();
          event.stopPropagation();
          rewindAudioAnnotation(element.dataset.annotationId);
          return;
        }

        if (action === 'toggle-video-modal-playback') {
          event.preventDefault();
          toggleVideoModalPlayback(element);
          return;
        }

        if (action === 'rewind-video-modal') {
          event.preventDefault();
          rewindVideoModal();
          return;
        }

        if (action === 'open-video-annotation') {
          event.preventDefault();
          if (MODE !== 'player') {
            return;
          }
          openVideoAnnotationById(element.dataset.annotationId);
          return;
        }

        if (action === 'open-link-annotation') {
          event.preventDefault();
          if (MODE !== 'player') {
            return;
          }
          openLinkAnnotationById(element.dataset.annotationId);
          return;
        }

        if (action === 'activate-hotspot') {
          if (MODE === 'builder' && event.target.isContentEditable) {
            return;
          }
          event.preventDefault();
          const id = element.dataset.hotspotId;
          activateHotspot(id, true);
          return;
        }

        if (action === 'move-hotspot-up-inline' || action === 'move-hotspot-down-inline') {
          event.preventDefault();
          event.stopPropagation();
          moveHotspotById(element.dataset.hotspotId, action === 'move-hotspot-up-inline' ? -1 : 1);
          return;
        }

        if (action === 'jump-slide') {
          event.preventDefault();
          const index = Number(element.dataset.slideIndex);
          if (Number.isFinite(index)) {
            jumpToSlide(index);
          }
          return;
        }

        if (action === 'set-slide-kind') {
          setSlideKind(element.dataset.slideKind);
          return;
        }

        if (action === 'set-media-fit') {
          currentSlide().media.fit = element.dataset.fit === 'cover' ? 'cover' : 'contain';
          commit('Updated media fit.');
          return;
        }

        if (action === 'set-hotspot-type') {
          const hotspot = selectedHotspot();
          if (!hotspot) {
            return;
          }
          hotspot.actionType = element.dataset.hotspotType || 'detail';
          if (hotspot.actionType !== 'video') {
            hotspot.videoNote = '';
          }
          state.ui.activeHotspotId = isVideoModalTrigger(hotspot) ? null : hotspot.id;
          commit('Updated hotspot behavior.');
          return;
        }

        if (action === 'set-hotspot-color') {
          const hotspot = selectedHotspot();
          if (!hotspot) {
            return;
          }
          hotspot.color = element.dataset.color || hotspot.color;
          commit('Updated hotspot color.');
          return;
        }

        if (action === 'set-text-style') {
          const annotation = selectedAnnotation();
          if (!annotation || annotation.type !== 'text') {
            return;
          }
          annotation.fontStyle = element.dataset.textStyle || 'regular';
          commit('Updated text style.');
          return;
        }

        if (action === 'set-text-color') {
          const annotation = selectedAnnotation();
          if (!annotation || annotation.type !== 'text') {
            return;
          }
          annotation.color = element.dataset.color || annotation.color;
          commit('Updated text color.');
          return;
        }

        if (action === 'prepare-media-annotation') {
          objectMediaType = element.dataset.mediaType || 'image';
          objectMediaUrl = '';
          setStatus(`Choose a ${objectMediaType === 'gif' ? 'GIF' : objectMediaType} file from the selected tutorial assets folder.`);
          render();
          root.querySelector('#objectTutorialMediaFile')?.focus();
          return;
        }

        const handlers = {
          'go-next': moveNext,
          'go-back': moveBack,
          'toggle-contents': () => {
            state.ui.contentsOpen = true;
            render();
          },
          'close-contents': () => {
            state.ui.contentsOpen = false;
            render();
          },
          'close-video': closeVideoModal,
          'add-slide': () => addSlide('slide'),
          'add-video-slide': () => addSlide('video'),
          'duplicate-slide': duplicateSlide,
          'delete-slide': deleteSlide,
          'move-slide-backward': () => moveSlide(-1),
          'move-slide-forward': () => moveSlide(1),
          'toggle-hotspots': toggleHotspots,
          'toggle-omit-cover': toggleOmitCover,
          'clear-builder': clearBuilder,
          'copy-tutorial-link': () => { void copyTutorialLink(); },
          'open-tutorial-link': openTutorialLink,
          'add-hotspot': () => addHotspot('detail'),
          'add-video-modal': () => addAnnotation('video'),
          'add-link': () => addAnnotation('link'),
          'add-video-hotspot': () => addHotspot('video'),
          'add-text': () => addAnnotation('text'),
          'add-image': () => addAnnotation('image'),
          'add-audio': () => addAnnotation('audio'),
          'add-media-object': addMediaObject,
          'duplicate-selected': duplicateSelected,
          'delete-selected': deleteSelected,
          'move-hotspot-up': () => moveHotspotById(state.ui.selectedId, -1),
          'move-hotspot-down': () => moveHotspotById(state.ui.selectedId, 1),
          'preview-hotspot-modal': previewSelectedHotspotModal,
          'preview-video-annotation': previewSelectedVideoAnnotation,
          'bring-forward': bringForward,
          'send-backward': sendBackward,
          'flip-image': flipSelectedImage,
          'media-up': () => nudgeMedia(0, -4),
          'media-left': () => nudgeMedia(-4, 0),
          'media-right': () => nudgeMedia(4, 0),
          'media-down': () => nudgeMedia(0, 4),
          'match-media-aspect': () => { void matchPageMediaAspect(); },
          'media-zoom-in': () => zoomMedia(0.12),
          'media-zoom-out': () => zoomMedia(-0.12),
          'media-reset': resetMediaTransform,
          'refresh-tutorial-folders': () => {
            const picker = root.querySelector('#tutorialFolderPicker');
            if (picker) picker.click();
          },
          'undo': undo,
          'redo': redo,
          'connect-tutorial-catalog': () => { void connectTutorialCatalog(); },
          'save-tutorial-listing': () => { void saveTutorialListing(); },
          'connect-file': connectProjectFile,
          'save-builder': saveBuilderFile,
          'export-png': exportStagePng,
          'export-player': exportPlayerHtml,
          
        };

        const handler = handlers[action];
        if (handler) {
          handler();
        }
      }

      function onBoundFocus(event) {
        editingBinding = event.currentTarget.dataset.bind || null;
        if (editingBinding?.startsWith('hotspot.title:')) {
          const id = editingBinding.split(':')[1];
          if (state.ui.activeHotspotId !== id) {
            state.ui.activeHotspotId = id;
            state.ui.selectedKind = 'hotspot';
            state.ui.selectedId = id;
            pendingFocus = editingBinding;
            render();
            return;
          }
          state.ui.selectedKind = 'hotspot';
          state.ui.selectedId = id;
        }
        if (editingBinding?.startsWith('hotspot.detail:')) {
          const id = editingBinding.split(':')[1];
          state.ui.activeHotspotId = id;
          state.ui.selectedKind = 'hotspot';
          state.ui.selectedId = id;
        }
        if (editingBinding?.startsWith('annotation.text:') || editingBinding?.startsWith('annotation.label:')) {
          const id = editingBinding.split(':')[1];
          if (state.ui.selectedId !== id || state.ui.selectedKind !== 'annotation') {
            state.ui.selectedKind = 'annotation';
            state.ui.selectedId = id;
            pendingFocus = editingBinding;
            render();
            return;
          }
          state.ui.selectedKind = 'annotation';
          state.ui.selectedId = id;
        }
        if (editingBinding?.startsWith('video-modal.note:') || editingBinding?.startsWith('video-modal.body:')) {
          const id = editingBinding.split(':')[1];
          if (state.ui.selectedId !== id || state.ui.selectedKind !== 'annotation') {
            state.ui.selectedKind = 'annotation';
            state.ui.selectedId = id;
            pendingFocus = editingBinding;
            render();
            return;
          }
          state.ui.selectedKind = 'annotation';
          state.ui.selectedId = id;
        }
        pushHistory();
      }

      function onBoundInput(event) {
        applyBoundValue(event.currentTarget);
        markDirty();
      }

      function onBoundBlur(event) {
        applyBoundValue(event.currentTarget);
        editingBinding = null;
        commit('Updated text.');
      }

      function onBoundKeydown(event) {
        if (event.currentTarget.dataset.singleLine === 'true' && event.key === 'Enter') {
          event.preventDefault();
          event.currentTarget.blur();
        }
      }

      function applyBoundValue(element) {
        const binding = element.dataset.bind;
        if (!binding) {
          return;
        }

        const value = element.innerText.replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n').trimEnd();
        if (binding === 'tutorial.title') {
          state.tutorial.title = value || 'TUTORIAL TITLE';
          return;
        }
        if (binding === 'slide.title') {
          currentSlide().title = value || (currentSlide().kind === 'cover' ? 'TUTORIAL SUBTITLE' : 'SLIDE TITLE');
          return;
        }
        if (binding === 'slide.notes') {
          currentSlide().notes = value;
          return;
        }

        if (binding.startsWith('hotspot.title:')) {
          const id = binding.split(':')[1];
          const hotspot = currentSlide().hotspots.find((item) => item.id === id);
          if (hotspot) {
            hotspot.title = value || (isVideoModalTrigger(hotspot) ? 'Video Modal' : `HOTSPOT ${hotspotIndex(id) + 1}`);
          }
          return;
        }
        if (binding.startsWith('hotspot.detail:')) {
          const id = binding.split(':')[1];
          const hotspot = currentSlide().hotspots.find((item) => item.id === id);
          if (hotspot) {
            hotspot.detail = value;
          }
          return;
        }
        if (binding.startsWith('annotation.text:')) {
          const id = binding.split(':')[1];
          const annotation = currentSlide().annotations.find((item) => item.id === id);
          if (annotation) {
            annotation.text = value || 'new note';
          }
          return;
        }
        if (binding.startsWith('annotation.label:')) {
          const id = binding.split(':')[1];
          const annotation = currentSlide().annotations.find((item) => item.id === id);
          if (annotation) {
            annotation.label = value || '';
          }
          return;
        }
        if (binding.startsWith('video-modal.note:')) {
          const id = binding.split(':')[1];
          const annotation = currentSlide().annotations.find((item) => item.id === id);
          if (annotation) {
            annotation.text = value || DEFAULT_VIDEO_MODAL_NOTE;
          }
          if (state.ui.videoModal?.sourceKind === 'annotation' && state.ui.videoModal.sourceId === id) {
            state.ui.videoModal.note = value || DEFAULT_VIDEO_MODAL_NOTE;
          }
          return;
        }
        if (binding.startsWith('video-modal.body:')) {
          const id = binding.split(':')[1];
          const annotation = currentSlide().annotations.find((item) => item.id === id);
          if (annotation) {
            annotation.modalBody = value;
          }
          if (state.ui.videoModal?.sourceKind === 'annotation' && state.ui.videoModal.sourceId === id) {
            state.ui.videoModal.body = value;
          }
        }
      }

      function onKeyDown(event) {
        if (MODE !== 'builder') {
          if (event.key === 'Escape' && (state.ui.contentsOpen || state.ui.videoModal)) {
            state.ui.contentsOpen = false;
            state.ui.videoModal = null;
            render();
          }
          return;
        }

        const tag = document.activeElement?.tagName || '';
        const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable;

        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'z') {
          event.preventDefault();
          if (event.shiftKey) {
            redo();
          } else {
            undo();
          }
          return;
        }

        if (event.key === 'Escape') {
          state.ui.contentsOpen = false;
          state.ui.videoModal = null;
          if (!isTyping) {
            state.ui.selectedKind = null;
            state.ui.selectedId = null;
          }
          render();
          return;
        }

        if (isTyping) {
          return;
        }

        if (event.key === 'Delete' || event.key === 'Backspace') {
          if (state.ui.selectedId) {
            event.preventDefault();
            deleteSelected();
          }
          return;
        }

        if (event.key === 'ArrowRight' && state.ui.selectedId) {
          event.preventDefault();
          nudgeSelected(1, 0);
          return;
        }
        if (event.key === 'ArrowLeft' && state.ui.selectedId) {
          event.preventDefault();
          nudgeSelected(-1, 0);
          return;
        }
        if (event.key === 'ArrowUp' && state.ui.selectedId) {
          event.preventDefault();
          nudgeSelected(0, -1);
          return;
        }
        if (event.key === 'ArrowDown' && state.ui.selectedId) {
          event.preventDefault();
          nudgeSelected(0, 1);
          return;
        }
      }

      function markDirty() {
        state.meta.updatedAt = Date.now();
        scheduleLocalSave();
        scheduleFileAutosave();
      }

      function commit(message, options = {}) {
        markDirty();
        pushHistory();
        if (message) {
          setStatus(message);
        }
        if (options.skipRender) {
          return;
        }
        render();
      }

      function setStatus(message) {
        statusMessage = message;
      }

      function applyLiveObjectStyle(kind, id) {
        const slide = currentSlide();
        const target = findSelectable(slide, kind, id);
        const element = root.querySelector(`.stage-object[data-object-kind="${kind}"][data-object-id="${id}"]`);
        if (!target || !element) {
          return;
        }
        element.style.cssText = kind === 'hotspot' ? hotspotStyle(target) : annotationStyle(target);
      }

      function applyLiveMarkupShape(id) {
        const annotation = currentSlide()?.annotations.find((item) => item.id === id);
        const element = root.querySelector(`.stage-object[data-object-kind="annotation"][data-object-id="${id}"]`);
        if (!annotation || !element || !isMarkupAnnotation(annotation)) {
          return;
        }
        const path = element.querySelector('[data-markup-primary="true"]');
        if (path && isLineMarkupKey(markupKeyForAnnotation(annotation))) {
          path.setAttribute('d', markupLinePath(annotation));
        }
        const points = normalizeMarkupPoints(annotation.markupPoints, markupKeyForAnnotation(annotation), annotation.bend);
        [['start','markup-start'],['curve','markup-curve'],['end','markup-end']].forEach(([name, handleName]) => {
          const handle = element.querySelector(`[data-handle="${handleName}"]`);
          if (!handle) return;
          handle.style.left = `${points[name].x}%`;
          handle.style.top = `${points[name].y}%`;
        });
      }

      function selectObject(kind, id, rerender = true) {
        state.ui.selectedKind = kind;
        state.ui.selectedId = id;
        if (kind === 'hotspot') {
          const hotspot = currentSlide()?.hotspots.find((item) => item.id === id);
          state.ui.activeHotspotId = hotspot && !isVideoModalTrigger(hotspot) ? id : null;
        }
        if (rerender) {
          render();
        }
      }

      function activateHotspot(id, fromClick) {
        const slide = currentSlide();
        const hotspot = slide.hotspots.find((item) => item.id === id);
        if (!hotspot) {
          return;
        }
        state.ui.activeHotspotId = isVideoModalTrigger(hotspot) ? null : hotspot.id;
        state.ui.selectedKind = MODE === 'builder' ? 'hotspot' : state.ui.selectedKind;
        state.ui.selectedId = MODE === 'builder' ? hotspot.id : state.ui.selectedId;

        if (fromClick && MODE === 'player') {
          if (hotspot.actionType === 'link' && hotspot.actionUrl) {
            window.open(hotspot.actionUrl, '_blank', 'noopener,noreferrer');
          }
          if (hotspot.actionType === 'video' && hotspot.actionUrl) {
            state.ui.videoModal = {
              title: hotspot.title,
              note: hotspot.videoNote,
              url: hotspot.actionUrl
            };
          }
        }
        render();
      }

      function moveNext() {
        const slide = currentSlide();
        const hotspots = literalHotspots(slide);
        if (slide.kind !== 'cover' && slide.hotspotsEnabled && hotspots.length) {
          const index = hotspotIndex(state.ui.activeHotspotId);
          if (index >= 0 && index < hotspots.length - 1) {
            state.ui.activeHotspotId = hotspots[index + 1].id;
            render();
            return;
          }
        }

        if (state.ui.slideIndex < state.tutorial.slides.length - 1) {
          jumpToSlide(state.ui.slideIndex + 1);
        }
      }

      function moveBack() {
        const slide = currentSlide();
        const hotspots = literalHotspots(slide);
        if (slide.kind !== 'cover' && slide.hotspotsEnabled && hotspots.length) {
          const index = hotspotIndex(state.ui.activeHotspotId);
          if (index > 0) {
            state.ui.activeHotspotId = hotspots[index - 1].id;
            render();
            return;
          }
        }

        if (state.ui.slideIndex > 0) {
          jumpToSlide(state.ui.slideIndex - 1);
        }
      }

      function jumpToSlide(index) {
        state.ui.slideIndex = clampNumber(index, 0, state.tutorial.slides.length - 1);
        state.ui.contentsOpen = false;
        state.ui.videoModal = null;
        state.ui.selectedKind = null;
        state.ui.selectedId = null;
        const slide = currentSlide();
        state.ui.activeHotspotId = slide.hotspotsEnabled ? firstLiteralHotspotId(slide) : null;
        render();
      }

      function setSlideKind(kind) {
        const slide = currentSlide();
        if (!slide || slide.kind === 'cover' || !['slide', 'video'].includes(kind)) {
          return;
        }
        pushHistory();
        slide.kind = kind;
        slide.media.type = kind === 'video' ? 'video' : (slide.media.type === 'video' ? 'image' : slide.media.type);
        slide.hotspotsEnabled = true;
        commit(`Switched page to ${kind}.`);
      }

      function addSlide(kind) {
        pushHistory();
        const newSlide = createDefaultSlide(kind);
        state.tutorial.slides.splice(state.ui.slideIndex + 1, 0, newSlide);
        state.ui.slideIndex += 1;
        state.ui.selectedKind = null;
        state.ui.selectedId = null;
        state.ui.activeHotspotId = null;
        commit(kind === 'video' ? 'Added a new video page.' : 'Added a new slide.');
      }

      function duplicateSlide() {
        if (!currentSlide() || currentSlide().kind === 'cover') {
          return;
        }
        pushHistory();
        const duplicated = normalizeSlide(cloneForHistory(currentSlide()), state.ui.slideIndex + 1);
        duplicated.id = uid(duplicated.kind === 'cover' ? 'cover' : 'slide');
        duplicated.hotspots = duplicated.hotspots.map((hotspot) => ({ ...hotspot, id: uid('hotspot') }));
        duplicated.annotations = duplicated.annotations.map((annotation) => ({ ...annotation, id: uid(`annotation-${annotation.type}`) }));
        state.tutorial.slides.splice(state.ui.slideIndex + 1, 0, duplicated);
        state.ui.slideIndex += 1;
        commit('Duplicated this page.');
      }

      function deleteSlide() {
        if (state.ui.slideIndex === 0 || state.tutorial.slides.length <= 1) {
          return;
        }
        pushHistory();
        state.tutorial.slides.splice(state.ui.slideIndex, 1);
        state.ui.slideIndex = clampNumber(state.ui.slideIndex - 1, 0, state.tutorial.slides.length - 1);
        state.ui.selectedKind = null;
        state.ui.selectedId = null;
        const slide = currentSlide();
        state.ui.activeHotspotId = slide?.hotspotsEnabled ? firstLiteralHotspotId(slide) : null;
        commit('Deleted this page.');
      }

      function moveSlide(direction) {
        const index = state.ui.slideIndex;
        const targetIndex = index + direction;
        if (index <= 0 || targetIndex <= 0 || targetIndex >= state.tutorial.slides.length) {
          return;
        }
        pushHistory();
        const [slide] = state.tutorial.slides.splice(index, 1);
        state.tutorial.slides.splice(targetIndex, 0, slide);
        state.ui.slideIndex = targetIndex;
        commit('Reordered this page.');
      }

      function toggleHotspots() {
        const slide = currentSlide();
        if (!slide || slide.kind === 'cover') {
          return;
        }

      async function matchPageMediaAspect() {
        const slide = currentSlide();
        if (!slide) {
          return;
        }
        if (!['image', 'gif'].includes(slide.media.type)) {
          setStatus('Match Image only applies to image pages, not video pages.');
          render();
          return;
        }
        const source = normalizeAssetUrl(slide.media.url, slideMediaAssetType(slide));
        if (!source) {
          setStatus('Add an image URL first, then use Match Image.');
          render();
          return;
        }

        try {
          const rendered = await loadRenderableImage(source);
          try {
            const width = rendered.image.naturalWidth || rendered.image.width || 0;
            const height = rendered.image.naturalHeight || rendered.image.height || 0;
            const aspect = simplifyAspectRatio(width, height);
            if (!aspect) {
              throw new Error('Image dimensions were unavailable.');
            }
            slide.media.aspect = aspect;
            commit(`Matched media box to image ratio (${aspect}).`);
          } finally {
            rendered.revoke?.();
          }
        } catch (error) {
          console.warn('Could not match image aspect ratio.', error);
          setStatus('Could not read image dimensions from that URL.');
          render();
        }
      }

      function simplifyAspectRatio(width, height) {
        const safeWidth = Math.round(Number(width) || 0);
        const safeHeight = Math.round(Number(height) || 0);
        if (!safeWidth || !safeHeight) {
          return '';
        }
        const divisor = greatestCommonDivisor(safeWidth, safeHeight);
        return `${safeWidth / divisor}:${safeHeight / divisor}`;
      }

      function greatestCommonDivisor(left, right) {
        let a = Math.abs(Math.round(left));
        let b = Math.abs(Math.round(right));
        while (b) {
          const next = a % b;
          a = b;
          b = next;
        }
        return a || 1;
      }

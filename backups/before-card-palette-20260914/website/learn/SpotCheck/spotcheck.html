    <script>

      // Mobile/tablet navigation: build from the existing desktop header links.
      (() => {
        const toggle = document.querySelector("[data-mobile-nav-toggle]");
        const panel = document.querySelector("[data-mobile-nav-panel]");
        const desktopNav = document.querySelector(".site-desktop-nav");
        if (!toggle || !panel || !desktopNav) return;

        const addLink = (source) => {
          const href = source.getAttribute("href");
          const label = (source.textContent || "").trim();
          if (!href || !label) return;
          const link = document.createElement("a");
          link.href = href;
          link.textContent = label;
          panel.appendChild(link);
        };

        desktopNav.querySelectorAll("a").forEach(addLink);

        const contact = document.createElement("button");
        contact.type = "button";
        contact.textContent = "Contact";
        contact.setAttribute("data-open-contact", "");
        panel.appendChild(contact);

        const close = () => {
          panel.hidden = true;
          toggle.setAttribute("aria-expanded", "false");
        };

        toggle.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const isOpen = !panel.hidden;
          panel.hidden = isOpen;
          toggle.setAttribute("aria-expanded", isOpen ? "false" : "true");
        });

        panel.addEventListener("click", (event) => {
          if (event.target.closest("a, button")) close();
        });

        document.addEventListener("click", (event) => {
          if (panel.hidden) return;
          if (event.target.closest("[data-mobile-nav-panel], [data-mobile-nav-toggle]")) return;
          close();
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") close();
        });
      })();


      // Instructions nav dropdown: click to toggle, click outside to close.
      (() => {
        const dropdowns = Array.from(document.querySelectorAll(".nav-dropdown"));
        if (!dropdowns.length) return;

        const closeAll = (except) => {
          dropdowns.forEach((dd) => {
            if (except && dd === except) return;
            dd.dataset.open = "false";
            const btn = dd.querySelector("button");
            if (btn) btn.setAttribute("aria-expanded", "false");
          });
        };

        dropdowns.forEach((dd) => {
          if (!dd.dataset.open) dd.dataset.open = "false";
          const btn = dd.querySelector("button");
          const menu = dd.querySelector(".nav-dropdown-menu");
          if (!btn || !menu) return;

          btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const isOpen = dd.dataset.open === "true";
            closeAll(dd);
            dd.dataset.open = isOpen ? "false" : "true";
            btn.setAttribute("aria-expanded", isOpen ? "false" : "true");
          });

          menu.addEventListener("click", (e) => e.stopPropagation());
        });

        document.addEventListener("click", () => closeAll());
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeAll();
        });
      })();

      // Contact modal open/close.
      const contactModal = document.querySelector("[data-contact-modal]");
      const contactOverlay = document.querySelector("[data-contact-overlay]");

      function setContactOpen(open) {
        if (!contactModal || !contactOverlay) return;
        contactModal.setAttribute("data-open", open ? "true" : "false");
        contactOverlay.setAttribute("data-open", open ? "true" : "false");
        contactModal.setAttribute("aria-hidden", open ? "false" : "true");
        document.body.style.overflow = open ? "hidden" : "";
      }

      function openContactModal() {
        setContactOpen(true);
      }

      function closeContactModal() {
        setContactOpen(false);
      }

      document.addEventListener("click", (e) => {
        const openBtn = e.target && e.target.closest ? e.target.closest("[data-open-contact]") : null;
        if (openBtn) {
          e.preventDefault();
          openContactModal();
          return;
        }

        const closeBtn = e.target && e.target.closest ? e.target.closest("[data-close-contact]") : null;
        if (closeBtn) {
          closeContactModal();
          return;
        }

        const overlayClick = e.target && e.target.matches ? e.target.matches("[data-contact-overlay]") : false;
        if (overlayClick) closeContactModal();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeContactModal();
      });

      // Contact form topic -> enable message, store label.
      (() => {
        const topicSelect = document.getElementById("topicSelect");
        const messageBox = document.getElementById("messageBox");
        const topicLabel = document.getElementById("topicLabel");
        if (!topicSelect || !messageBox) return;

        topicSelect.addEventListener("change", function () {
          if (this.value) {
            messageBox.disabled = false;
            messageBox.placeholder = "Type your message here...";
            if (topicLabel) topicLabel.value = this.options[this.selectedIndex].text;
          } else {
            messageBox.disabled = true;
            messageBox.placeholder = "Select a topic first...";
            if (topicLabel) topicLabel.value = "";
          }
        });
      })();
    </script>

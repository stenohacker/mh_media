<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>Check Back Soon | Magic Hashtags</title>
  <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles/site-system.css?v=20260902-hanken-1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #aeb4bf;
      color: #000;
      font-family: var(--font-interface);
    }

    .coming-soon {
      width: min(46rem, 100%);
      border: 4px solid #000;
      background: #fff;
    }

    .coming-soon img {
      display: block;
      width: 100%;
      height: auto;
      border-bottom: 4px solid #000;
      background: #000;
    }

    .coming-soon__copy {
      padding: clamp(1.5rem, 5vw, 3rem);
      text-align: center;
    }

    .coming-soon h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 4.8rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 0.95;
      text-transform: uppercase;
    }

    .coming-soon a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      margin-top: 1.5rem;
      border: 3px solid #000;
      padding: 0.65rem 1rem;
      background: #f1f332;
      color: #000;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .coming-soon a:hover,
    .coming-soon a:focus-visible {
      background: #ff90e7;
      outline: 0;
    }
  </style>
</head>
<body>
  <main class="coming-soon">
    <img src="/images/working-on-it.gif" alt="Working on it">
    <div class="coming-soon__copy">
      <h1>Check back soon</h1>
      <a href="/reporter-tools.html">Return to Reporter Tools</a>
    </div>
  </main>
</body>
</html>

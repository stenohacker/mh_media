      if (target.id === "selectedOpacity") {
        const selected = selectedObject();
        if (selected) {
          selected.opacity = clamp(Number(target.value) / 100, .1, 1);
          const element = root.querySelector(`[data-object][data-id="${CSS.escape(selected.id)}"]`);
          element?.style.setProperty("--opacity", selected.opacity);
          scheduleSave();
        }
      }
      if (target.id === "markupWidth") {
        const selected = selectedObject();
        if (selected?.type === "markup") {
          selected.strokeWidth = clamp(Number(target.value), 1, 10);
          const element = root.querySelector(`[data-object][data-id="${CSS.escape(selected.id)}"]`);
          element?.style.setProperty("--markup-width", selected.strokeWidth);
          scheduleSave();
        }
      }
      if (target.id === "markupTransparency") {
        const selected = selectedObject();
        if (selected?.type === "markup") {
          selected.opacity = clamp(1 - Number(target.value) / 100, .1, 1);
          const element = root.querySelector(`[data-object][data-id="${CSS.escape(selected.id)}"]`);
          element?.style.setProperty("--opacity", selected.opacity);
          scheduleSave();
        }
      }
      if (target.id === "markupColor") {
        markupColorDefault = target.value;
        const selected = selectedObject();
        if (selected?.type === "markup") {
          selected.markupColor = target.value;
          const element = root.querySelector(`[data-object][data-id="${CSS.escape(selected.id)}"]`);
          element?.style.setProperty("--markup-color", selected.markupColor);
          scheduleSave();
        }
      }
      if (target.id === "textAnnotationColor") {
        const selected = selectedObject();
        if (selected?.type === "text") {
          selected.textColor = target.value;
          const element = root.querySelector(`[data-object][data-id="${CSS.escape(selected.id)}"] .object-frame`);
          if (element) element.style.color = selected.textColor;
          scheduleSave();
        }
      }
      if (target.id === "coverColor") {
        const selected = selectedObject();
        if (selected?.type === "cover") {
          selected.fillColor = target.value;
          const element = root.querySelector(`[data-object][data-id="${CSS.escape(selected.id)}"]`);
          element?.style.setProperty("--cover-color", selected.fillColor);
          scheduleSave();
        }
      }
      if (target.id === "backgroundColor") {
        currentSlide().media.matte = target.value;
        root.querySelector("[data-stage]")?.style.setProperty("--stage-matte", target.value);
        scheduleSave();
      }
      if (target.id === "blurStrength") {
        const selected = selectedObject();
        const value = clamp(Number(target.value), 1, 30);
        const output = document.getElementById("blurStrengthValue");
        if (output) output.textContent = `${value}px`;
        if (selected?.type === "blur") {
          selected.blurStrength = value;
          const element = root.querySelector(`[data-object][data-id="${CSS.escape(selected.id)}"]`);
          element?.style.setProperty("--blur-strength", `${value}px`);
          scheduleSave();
        }
      }
      if (target.matches("[data-meta]")) {
        const key = target.dataset.meta;
        const previousMediaBase = key === "mediaFolder" ? mediaBase() : "";
	        state.meta[key] = target.type === "checkbox"
	          ? target.checked
	          : key === "order"
	            ? Number(target.value || 10)
	            : target.value;
        markTouched(key);
        state.meta.publicUrl = publicUrl();
        if (previousMediaBase) syncMediaUrlSeeds(previousMediaBase);
        if (key !== "publicUrl" && !state.meta.touched.publicUrl) {
          const publicUrlField = root.querySelector('[data-meta="publicUrl"]');
          if (publicUrlField) publicUrlField.value = state.meta.publicUrl;
        }
        scheduleSave();
      }
      const editable = target.isContentEditable ? target : target.closest?.('[contenteditable="true"]');
      if (!editable) return;
      const binding = editable.dataset.bind || "";
      const value = editable.classList.contains("mixed-body-editor")
        ? (() => {
          let numberedIndex = 0;
          return Array.from(editable.querySelectorAll(":scope > .mixed-body-line"))
          .map((line) => {
            const text = line.innerText.replace(/\r/g, "").replace(/\n+$/, "");
            const kind = lineListKind(line);
            if (kind === "numbered") return `${++numberedIndex}. ${text}`;
            numberedIndex = 0;
            return kind === "pipe" ? `| ${text}` : text;
          })
          .join("\n");
        })()
        : editable.innerText.replace(/\n+$/, "");
      if (binding === "tutorial.title") {
        const previousMediaBase = mediaBase();
        state.tutorial.title = value;
        applySmartDefaults();
        syncMediaUrlSeeds(previousMediaBase);
        scheduleSave();
      } else if (binding.startsWith("slide.title:")) {
        currentSlide().title = value;
        scheduleSave();
      } else if (binding.startsWith("slide.description:")) {
        currentSlide().description = value;
        scheduleSave();
      } else if (binding.startsWith("hotspot.title:")) {
        const item = currentSlide().hotspots.find((hotspot) => hotspot.id === binding.split(":")[1]);
        if (item) item.title = value;
        scheduleSave();
      } else if (binding.startsWith("hotspot.body:")) {
        const item = currentSlide().hotspots.find((hotspot) => hotspot.id === binding.split(":")[1]);
        if (item) item.body = value;
        scheduleSave();
      } else if (binding.startsWith("annotation.text:")) {
        const item = currentSlide().annotations.find((annotation) => annotation.id === binding.split(":")[1]);
        if (item) item.text = value;
        scheduleSave();
      } else if (binding.startsWith("annotation.introTitle:")) {
        const item = currentSlide().annotations.find((annotation) => annotation.id === binding.split(":")[1]);
        if (item?.type === "slide-intro") item.introTitle = value;
        scheduleSave();
      } else if (binding.startsWith("annotation.introBody:")) {
        const item = currentSlide().annotations.find((annotation) => annotation.id === binding.split(":")[1]);
        if (item?.type === "slide-intro") item.introBody = value;
        scheduleSave();
      } else if (binding.startsWith("annotation.calloutTitle:")) {
        const item = currentSlide().annotations.find((annotation) => annotation.id === binding.split(":")[1]);
        if (item?.type === "callout") item.calloutTitle = value;
        scheduleSave();
      } else if (binding.startsWith("annotation.calloutBody:")) {
        const item = currentSlide().annotations.find((annotation) => annotation.id === binding.split(":")[1]);
        if (item?.type === "callout") item.calloutBody = value;
        scheduleSave();
      }
    }

    function normalizeMainMediaInput(target) {
      let value = target.value.trim();
      const base = mediaBase();
      const appended = value.slice(base.length);
      if (value.startsWith(base) && /^https?:\/\//i.test(appended)) {
        value = appended;
        target.value = value;
      }
      return value;
    }

    function onFocusIn(event) {
      const target = event.target;
      if (target.id === "mainMediaUrl" && !currentSlide().media.url && target.value === mediaBase()) {
        target.select();
      }
    }

    function syncLiveEditableBeforeRender(target = document.activeElement) {
      const editable = target?.isContentEditable
        ? target
        : target?.closest?.('[contenteditable="true"]');
      if (!editable || !root.contains(editable)) return false;
      editable.dispatchEvent(new Event("input", { bubbles: true }));
      return true;
    }

    function onFocusOut(event) {
      if (event.target.isContentEditable) {
        syncLiveEditableBeforeRender(event.target);
        commit("", false);
      }
    }

    function refreshMainMediaLayer() {
      const layer = root.querySelector(".media-layer");
      if (!layer) return;
      layer.outerHTML = renderMainMedia(currentSlide());
      syncRuntimeMedia();
    }

    function selectObject(kind, id, additive = false) {
      if (MODE !== "builder") return;
      syncObjectSelection();
      const key = selectionKey(kind, id);
      if (!selectionEntry(key)) return;
      if (kind === "hotspot" && state.ui.activeHotspotId !== id) stopAudio();
      if (additive) {
        if (multiSelection.includes(key)) {
          multiSelection = multiSelection.filter((entry) => entry !== key);
        } else {
          multiSelection.push(key);
        }
      } else if (!multiSelection.includes(key)) {
        multiSelection = [key];
      }
      const primary = additive && !multiSelection.includes(key)
        ? selectionEntry(multiSelection[multiSelection.length - 1])
        : selectionEntry(key);
      state.ui.selectedKind = primary?.kind || null;
      state.ui.selectedId = primary?.id || null;
      if (kind === "hotspot" && multiSelection.includes(key)) state.ui.activeHotspotId = id;
      render();
    }

    function onPointerDown(event) {
      if (MODE !== "builder" || event.button !== 0) return;
      if (event.target.closest(".builder-toolbar button") && document.activeElement?.isContentEditable) {
        syncLiveEditableBeforeRender();
        event.preventDefault();
        return;
      }
      if (event.target.closest(".body-list-toggle")) {
        rememberMixedBodySelection();
        event.preventDefault();
        return;
      }
      syncLiveEditableBeforeRender();
      const popupResizeHandle = event.target.closest("[data-popup-resize-handle]");
      if (popupResizeHandle) {
        const popup = popupResizeHandle.closest(".slide-sidebar.is-demo-popup");
        const body = popup?.closest(".tutorial-body.is-demo-centered-slide");
        const hotspot = currentSlide().hotspots.find((item) => item.id === popupResizeHandle.dataset.id);
        if (!popup || !body || !hotspot) return;
        const rect = body.getBoundingClientRect();
        const popupRect = popup.getBoundingClientRect();
        const left = clamp((popupRect.left - rect.left) / Math.max(rect.width, 1) * 100, 0, 100);
        const right = clamp((popupRect.right - rect.left) / Math.max(rect.width, 1) * 100, 0, 100);
        const top = clamp((popupRect.top - rect.top) / Math.max(rect.height, 1) * 100, 0, 100);
        const bottom = clamp((popupRect.bottom - rect.top) / Math.max(rect.height, 1) * 100, 0, 100);
        popupDrag = {
          mode: "resize",
          id: hotspot.id,
          handle: popupResizeHandle.dataset.handle || "se",
          rect,
          popup,
          startX: event.clientX,
          startY: event.clientY,
          original: { left, right, top, bottom },
          minW: clamp(180 / Math.max(rect.width, 1) * 100, 12, 50),
          minH: clamp(120 / Math.max(rect.height, 1) * 100, 10, 50)
        };
        hotspot.popupX = (left + right) / 2;
        hotspot.popupY = (top + bottom) / 2;
        hotspot.popupW = Math.max(popupDrag.minW, right - left);
        hotspot.popupH = Math.max(popupDrag.minH, bottom - top);
        popup.classList.remove("demo-popup-left", "demo-popup-right", "demo-popup-top", "demo-popup-bottom");
        popup.classList.add("is-custom-position", "is-custom-size");
        popup.style.setProperty("--popup-x", `${hotspot.popupX}%`);
        popup.style.setProperty("--popup-y", `${hotspot.popupY}%`);
        popup.style.setProperty("--popup-width", `${hotspot.popupW}%`);
        popup.style.setProperty("--popup-height", `${hotspot.popupH}%`);
        popupResizeHandle.setPointerCapture?.(event.pointerId);
        event.preventDefault();
        return;
      }
      const popupHandle = event.target.closest("[data-popup-drag-handle]");
      if (popupHandle) {
        const popup = popupHandle.closest(".slide-sidebar.is-demo-popup");
        const body = popup?.closest(".tutorial-body.is-demo-centered-slide");
        const hotspot = currentSlide().hotspots.find((item) => item.id === popupHandle.dataset.id);
        if (!popup || !body || !hotspot) return;
        const rect = body.getBoundingClientRect();
        const popupRect = popup.getBoundingClientRect();
        popupDrag = {
          mode: "move",
          id: hotspot.id,
          rect,
          popup,
          minX: clamp(popupRect.width / Math.max(rect.width, 1) * 50 + 1, 2, 48),
          minY: clamp(popupRect.height / Math.max(rect.height, 1) * 50 + 1, 2, 48)
        };
        hotspot.popupX = clamp((popupRect.left + popupRect.width / 2 - rect.left) / Math.max(rect.width, 1) * 100, popupDrag.minX, 100 - popupDrag.minX);
        hotspot.popupY = clamp((popupRect.top + popupRect.height / 2 - rect.top) / Math.max(rect.height, 1) * 100, popupDrag.minY, 100 - popupDrag.minY);
        popup.classList.remove("demo-popup-left", "demo-popup-right", "demo-popup-top", "demo-popup-bottom");
        popup.classList.add("is-custom-position");
        popup.style.setProperty("--popup-x", `${hotspot.popupX}%`);
        popup.style.setProperty("--popup-y", `${hotspot.popupY}%`);
        popupHandle.setPointerCapture?.(event.pointerId);
        event.preventDefault();
        return;
      }
      if (event.target.closest("button,[contenteditable=true],input,select,textarea")) return;
      const objectElement = event.target.closest("[data-object]");
      if (!objectElement) return;
      if (event.shiftKey) return;
      const kind = objectElement.dataset.kind;
      const id = objectElement.dataset.id;
      const wasSelected = isObjectSelected(kind, id);
      const dragSelection = wasSelected ? selectedObjects() : [];
      if (!wasSelected) multiSelection = [selectionKey(kind, id)];
      state.ui.selectedKind = kind;
      state.ui.selectedId = id;
      if (kind === "hotspot") {
        if (state.ui.activeHotspotId !== id) stopAudio();
        state.ui.activeHotspotId = id;
      }
      const slide = currentSlide();
      const item = kind === "hotspot"
        ? slide.hotspots.find((entry) => entry.id === id)
        : slide.annotations.find((entry) => entry.id === id);
      if (!item || item.locked) return;
      objectElement.classList.add("is-selected");
      const stage = objectElement.closest("[data-stage]");
      const rect = stage.getBoundingClientRect();
      drag = {
        id, kind,
        wasSelected,
        moved: false,
        groupOriginals: dragSelection.filter(({ item }) => !item.locked).map(({ item, kind }) => ({ item, kind, x: item.x, y: item.y })),
        handle: event.target.closest("[data-handle]")?.dataset.handle || "move",
        startX: event.clientX,
        startY: event.clientY,
        rect,
        objectRect: objectElement.getBoundingClientRect(),
        startAngle: Math.atan2(
          event.clientY - (objectElement.getBoundingClientRect().top + objectElement.getBoundingClientRect().height / 2),
          event.clientX - (objectElement.getBoundingClientRect().left + objectElement.getBoundingClientRect().width / 2)
        ),
        original: { x: item.x, y: item.y, w: item.w, h: item.h, rotation: item.rotation || 0 }
      };
      objectElement.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    }

    function onPointerMove(event) {
      if (drag) requestAnimationFrame(syncSelectionControls);
      if (popupDrag) {
        const hotspot = currentSlide().hotspots.find((item) => item.id === popupDrag.id);
        if (!hotspot) return;
        if (popupDrag.mode === "resize") {
          const dx = (event.clientX - popupDrag.startX) / Math.max(popupDrag.rect.width, 1) * 100;
          const dy = (event.clientY - popupDrag.startY) / Math.max(popupDrag.rect.height, 1) * 100;
          const handle = popupDrag.handle;
          let { left, right, top, bottom } = popupDrag.original;
          if (handle.includes("w")) left = clamp(left + dx, 0, right - popupDrag.minW);
          if (handle.includes("e")) right = clamp(right + dx, left + popupDrag.minW, 100);
          if (handle.includes("n")) top = clamp(top + dy, 0, bottom - popupDrag.minH);
          if (handle.includes("s")) bottom = clamp(bottom + dy, top + popupDrag.minH, 100);
          hotspot.popupX = (left + right) / 2;
          hotspot.popupY = (top + bottom) / 2;
          hotspot.popupW = right - left;
          hotspot.popupH = bottom - top;
          popupDrag.popup.style.setProperty("--popup-width", `${hotspot.popupW}%`);
          popupDrag.popup.style.setProperty("--popup-height", `${hotspot.popupH}%`);
        } else {
          hotspot.popupX = clamp((event.clientX - popupDrag.rect.left) / Math.max(popupDrag.rect.width, 1) * 100, popupDrag.minX, 100 - popupDrag.minX);
          hotspot.popupY = clamp((event.clientY - popupDrag.rect.top) / Math.max(popupDrag.rect.height, 1) * 100, popupDrag.minY, 100 - popupDrag.minY);
        }
        popupDrag.popup.style.setProperty("--popup-x", `${hotspot.popupX}%`);
        popupDrag.popup.style.setProperty("--popup-y", `${hotspot.popupY}%`);
        scheduleSave();
        event.preventDefault();
        return;
      }
      if (!drag) return;
      const item = selectedObject();
      if (!item || item.id !== drag.id) return;
      const dx = (event.clientX - drag.startX) / drag.rect.width * 100;
      const dy = (event.clientY - drag.startY) / drag.rect.height * 100;
      if (Math.abs(dx) > .2 || Math.abs(dy) > .2) drag.moved = true;
      if (drag.handle === "rotate" && (item.type === "shape" || (item.type === "markup" && isRotatableMarkup(item.markup)))) {
        const centerX = drag.objectRect.left + drag.objectRect.width / 2;
        const centerY = drag.objectRect.top + drag.objectRect.height / 2;
        const currentAngle = Math.atan2(event.clientY - centerY, event.clientX - centerX);
        const degrees = drag.original.rotation + (currentAngle - drag.startAngle) * 180 / Math.PI;
        item.rotation = ((degrees + 180) % 360 + 360) % 360 - 180;
        const element = root.querySelector(`[data-object][data-id="${CSS.escape(item.id)}"]`);
        if (element) element.style.cssText = objectStyle(item);
        scheduleSave();
        return;
      }
      if (drag.handle.startsWith("markup-") && item.type === "markup" && isPathMarkup(item.markup)) {
        const pointName = drag.handle.replace("markup-", "");
        item.markupPoints = normalizeMarkupPoints(item.markupPoints, item.markup);
        item.markupPoints[pointName] = {
          x: clamp((event.clientX - drag.objectRect.left) / Math.max(drag.objectRect.width, 1) * 100, 2, 98),
          y: clamp((event.clientY - drag.objectRect.top) / Math.max(drag.objectRect.height, 1) * 100, 2, 98)
        };
        const element = root.querySelector(`[data-object][data-id="${CSS.escape(item.id)}"]`);
        applyLiveMarkupShape(item, element);
        scheduleSave();
        return;
      }
      if (drag.handle === "move") {
        if (drag.groupOriginals.length > 1) {
          const groupDx = clamp(dx, Math.max(...drag.groupOriginals.map(o => STAGE_OBJECT_MIN_POSITION - o.x)), Math.min(...drag.groupOriginals.map(o => STAGE_OBJECT_MAX_POSITION - o.x)));
          const groupDy = clamp(dy, Math.max(...drag.groupOriginals.map(o => STAGE_OBJECT_MIN_POSITION - o.y)), Math.min(...drag.groupOriginals.map(o => STAGE_OBJECT_MAX_POSITION - o.y)));
          drag.groupOriginals.forEach((original) => {
            original.item.x = original.x + groupDx;
            original.item.y = original.y + groupDy;
            const element = root.querySelector(`[data-object][data-id="${CSS.escape(original.item.id)}"]`);
            const slot = original.kind === "hotspot" ? hotspotSlotIndex(original.item.id) : -1;
            if (element) element.style.cssText = objectStyle(original.item) + (slot >= 0 ? `;--hotspot-color:${hotspotStyle(slot).color}` : "");
          });
          scheduleSave();
          return;
        }
        item.x = clamp(drag.original.x + dx, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        item.y = clamp(drag.original.y + dy, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
      } else if (["markup", "cover", "blur", "slide-intro", "callout"].includes(item.type)) {
        const changesWidth = drag.handle.includes("e") || drag.handle.includes("w");
        const changesHeight = drag.handle.includes("n") || drag.handle.includes("s");
        const directionX = drag.handle.includes("e") ? 1 : -1;
        const directionY = drag.handle.includes("s") ? 1 : -1;
        if (changesWidth) {
          item.w = clamp(drag.original.w + dx * directionX, 5, 95);
          item.x = clamp(drag.original.x + (item.w - drag.original.w) / 2 * directionX, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        }
        if (changesHeight) {
          item.h = clamp(drag.original.h + dy * directionY, 4, 95);
          item.y = clamp(drag.original.y + (item.h - drag.original.h) / 2 * directionY, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        }
      } else {
        const directionX = drag.handle.includes("e") ? 1 : -1;
        const directionY = drag.handle.includes("s") ? 1 : -1;
        const aspect = drag.original.w / Math.max(drag.original.h, 1);
        const proposedW = clamp(drag.original.w + dx * directionX, 5, 95);
        const proposedHFromW = proposedW / aspect;
        const proposedH = clamp(Math.abs(dy) > Math.abs(dx) ? drag.original.h + dy * directionY : proposedHFromW, 4, 95);
        item.w = clamp(proposedH * aspect, 5, 95);
        item.h = proposedH;
        item.x = clamp(drag.original.x + (item.w - drag.original.w) / 2 * directionX, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        item.y = clamp(drag.original.y + (item.h - drag.original.h) / 2 * directionY, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
      }
      const element = root.querySelector(`[data-object][data-id="${CSS.escape(item.id)}"]`);
      const slotIndex = drag.kind === "hotspot" ? hotspotSlotIndex(item.id) : -1;
      const slotColor = slotIndex >= 0 ? hotspotStyle(slotIndex).color : "";
      if (element) element.style.cssText = objectStyle(item) + (slotColor ? `;--hotspot-color:${slotColor}` : "");
      scheduleSave();
    }

    function applyLiveMarkupShape(item, element) {
      if (!item || !element || item.type !== "markup" || !isPathMarkup(item.markup)) return;
      element.querySelector('[data-markup-primary="true"]')?.setAttribute("d", markupPath(item));
      const arrowSvg = element.querySelector("svg[data-arrow-points]");
      if (arrowSvg) {
        arrowSvg.dataset.arrowPoints = JSON.stringify(normalizeMarkupPoints(item.markupPoints, item.markup));
        updateArrowGeometry(arrowSvg);
      }
      const points = normalizeMarkupPoints(item.markupPoints, item.markup);
      for (const [name, handle] of [["start", "markup-start"], ["curve", "markup-curve"], ["end", "markup-end"]]) {
        const node = element.querySelector(`[data-handle="${handle}"]`);
        if (!node) continue;
        node.style.left = `${points[name].x}%`;
        node.style.top = `${points[name].y}%`;
      }
    }

    function onPointerUp() {
      if (popupDrag) {
        const message = popupDrag.mode === "resize" ? "Resized hotspot text box." : "Updated hotspot text box position.";
        popupDrag = null;
        commit(message);
        return;
      }
      if (!drag) return;
      const completedDrag = drag;
      drag = null;
      const annotation = completedDrag.kind === "annotation"
        ? currentSlide().annotations.find((item) => item.id === completedDrag.id)
        : null;
      if (!completedDrag.moved && completedDrag.wasSelected && annotation?.type === "video") {
        openVideo(annotation.id);
        return;
      }
      commit("Updated object position or size.");
    }

    function onDoubleClick(event) {
      const object = event.target.closest('[data-object][data-kind="annotation"]');
      if (!object) return;
      const annotation = currentSlide().annotations.find((item) => item.id === object.dataset.id);
      if (annotation?.type === "video") openVideo(annotation.id);
      if (annotation?.type === "link") openLink(annotation.url);
    }

    function placeCaretInMixedBodyLine(line, offset = 0) {
      const selection = window.getSelection();
      if (!selection || !line) return;
      line.normalize();
      const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
      let textNode = walker.nextNode(), remaining = Math.max(0, offset);
      while (textNode && remaining > textNode.length) {
        const next = walker.nextNode();
        if (!next) { remaining = textNode.length; break; }
        remaining -= textNode.length;
        textNode = next;
      }
      const range = document.createRange();
      if (textNode) {
        range.setStart(textNode, clamp(remaining, 0, textNode.textContent.length));
      } else {
        range.setStart(line, 0);
      }
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function insertMixedBodyLine(event, editor) {
      event.preventDefault();
      const selection = window.getSelection();
      const range = selection?.rangeCount ? selection.getRangeAt(0) : null;
      const rangeElement = range?.startContainer?.nodeType === 1
        ? range.startContainer
        : range?.startContainer?.parentElement;
      let line = rangeElement?.closest?.(".mixed-body-line");
      if (!line || line.parentElement !== editor) line = editor.querySelector(".mixed-body-line:last-child");
      if (!line) {
        line = document.createElement("div");
        line.className = "mixed-body-line";
        line.dataset.listKind = "plain";
        line.dataset.pipe = "false";
        editor.append(line);
      }

      if (range && !range.collapsed && line.contains(range.startContainer) && line.contains(range.endContainer)) {
        range.deleteContents();
      }

      let offset = line.innerText.replace(/\r/g, "").replace(/\n+$/, "").length;
      if (range && line.contains(range.startContainer)) {
        const beforeCaret = document.createRange();
        beforeCaret.selectNodeContents(line);
        beforeCaret.setEnd(range.startContainer, range.startOffset);
        offset = beforeCaret.toString().length;
      }

      const text = line.innerText.replace(/\r/g, "").replace(/\n+$/, "");
      const currentKind = lineListKind(line);
      if (currentKind !== "plain" && !text) {
        setLineListKind(line, "plain");
        placeCaretInMixedBodyLine(line);
        editor.dispatchEvent(new Event("input", { bubbles: true }));
        updateBodyListToggleState(editor, [line]);
        return;
      }

      const nextLine = document.createElement("div");
      nextLine.className = "mixed-body-line";
      setLineListKind(nextLine, currentKind);
      line.removeAttribute("data-placeholder");
      const tail = document.createRange();
      tail.selectNodeContents(line);
      if (range && line.contains(range.startContainer)) tail.setStart(range.startContainer, range.startOffset);
      else tail.collapse(false);
      nextLine.append(tail.extractContents());
      line.after(nextLine);

      placeCaretInMixedBodyLine(nextLine);
      editor.dispatchEvent(new Event("input", { bubbles: true }));
      lastMixedBodySelection = { editor, lines: [nextLine] };
      updateBodyListToggleState(editor, [nextLine]);
    }

    function onKeyDown(event) {
      const mixedBodyEditor = MODE === "builder" && !event.shiftKey && event.key === "Enter"
        ? event.target.closest?.(".mixed-body-editor")
        : null;
      if (mixedBodyEditor) {
        insertMixedBodyLine(event, mixedBodyEditor);
        return;
      }
      const saveShortcut = MODE === "builder"
        && (event.ctrlKey || event.metaKey)
        && !event.altKey
        && event.key.toLowerCase() === "s";
      if (saveShortcut) {
        event.preventDefault();
        const saved = saveStateNow();
        showToast(saved ? `Saved browser draft for ${DRAFT_FILENAME}.` : draftStorageError);
        return;
      }
      const undoShortcut = MODE === "builder"
        && (event.ctrlKey || event.metaKey)
        && !event.altKey
        && !event.shiftKey
        && event.key.toLowerCase() === "z";
      if (undoShortcut) {
        event.preventDefault();
        undoLastChange();
        return;
      }
      const typingTarget = event.target.isContentEditable || event.target.closest?.("input,textarea,select");
      const deleteShortcut = MODE === "builder"
        && !typingTarget
        && !event.ctrlKey
        && !event.metaKey
        && !event.altKey
        && (event.key === "Delete" || event.key === "Backspace");
      if (deleteShortcut && state.ui.selectedKind === "annotation" && state.ui.selectedId) {
        event.preventDefault();
        deleteSelected();
        return;
      }
      if (deleteShortcut && state.ui.selectedKind === "hotspot" && state.ui.selectedId) {
        event.preventDefault();
        showToast("Use the hotspot delete button.");
        return;
      }
      if (event.key === "Escape") {
        if (state.ui.videoModalId) closeVideo();
        else if (state.ui.contentsOpen) closeContents();
        else closeSiteNavigation();
        return;
      }
      if (event.key === "Tab" && (state.ui.videoModalId || state.ui.contentsOpen)) {
        const modal = document.querySelector(state.ui.videoModalId ? "#videoModal" : "#contentsModal");
        const focusable = Array.from(modal?.querySelectorAll('button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])') || [])
          .filter((node) => !node.hidden);
        if (focusable.length) {
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      }
      if ((event.key === "Enter" || event.key === " ") && event.target.closest?.('.annotation-video[data-id]')) {
        event.preventDefault();
        openVideo(event.target.closest('.annotation-video').dataset.id);
        return;
      }
      if ((event.key === "Enter" || event.key === " ")
          && !event.target.isContentEditable
          && !event.target.closest?.("button,a,input,select,textarea")) {
        const hotspotTrigger = event.target.closest?.('[data-action="activate-hotspot"][data-id]');
        if (hotspotTrigger) {

    function activateHotspot(id) {
      if (!id) return;

      state.ui.activeHotspotId = id;
      if (MODE === "builder") {

    function drawAttentionToHotspot(id, scrollRow = true) {
      if (!id) return;
      window.clearTimeout(hotspotAttentionTimer);
      root.querySelectorAll(".hotspot-object.is-attention").forEach((element) => {
        element.classList.remove("is-attention");
      });
      const escapedId = CSS.escape(id);
      const marker = root.querySelector(`.hotspot-object[data-id="${escapedId}"]`);
      const entry = root.querySelector(`.hotspot-entry[data-id="${escapedId}"]`);
      if (marker) {
        void marker.offsetWidth;
        marker.classList.add("is-attention");
      }
      if (scrollRow) entry?.querySelector(".hotspot-row")?.scrollIntoView({ block: "nearest" });
      hotspotAttentionTimer = window.setTimeout(() => {
        root.querySelectorAll(".hotspot-object.is-attention").forEach((element) => {
          element.classList.remove("is-attention");
        });
      }, 850);
    }

    function moveHotspot(id, direction) {
      const list = currentSlide().hotspots;
      const index = list.findIndex((item) => item.id === id);
      const target = index + direction;
      if (index < 0 || target < 0 || target >= list.length) return;
      stopAudio();

      // This is deliberately a content swap, not an array reorder. IDs, marker
      // numbers, artwork, colors, geometry, stacking, locks, and groups stay in
      // their numbered slots.
      const sourceTitle = list[index].title;
      const sourceBody = list[index].body;
      list[index].title = list[target].title;
      list[index].body = list[target].body;
      list[target].title = sourceTitle;
      list[target].body = sourceBody;

      const targetId = list[target].id;
      state.ui.activeHotspotId = targetId;
      state.ui.selectedKind = "hotspot";
      state.ui.selectedId = targetId;
      commit("Moved hotspot title and body; numbered marker stayed fixed.");

      const normalizedValue = normalizeHostedAnnotationUrl(type, value);
      if (input && normalizedValue !== value) input.value = normalizedValue;
      if (type === "image" || type === "gif") {
        addImageAnnotation(type, normalizedValue, type === "gif" ? "GIF" : "Image");
        return;

      const slide = currentSlide();
      const annotation = normalizeAnnotation({

        x: 50,

    function topZ() {
      const slide = currentSlide();
      return Math.max(1, ...slide.hotspots.map((item) => item.z), ...slide.annotations.map((item) => item.z));
    }

    function moveSelectedZ(direction) {
      const item = selectedObject();
      if (!item) return;
      const slide = currentSlide();
      const layers = [
        ...slide.annotations.map((entry, index) => ({ item: entry, domOrder: index })),
        ...slide.hotspots.map((entry, index) => ({ item: entry, domOrder: slide.annotations.length + index }))
      ].sort((a, b) => a.item.z - b.item.z || a.domOrder - b.domOrder);
      const currentIndex = layers.findIndex((entry) => entry.item === item);
      if (currentIndex < 0) return;
      if (direction === "front") {
        if (currentIndex === layers.length - 1) {
          showToast("Object is already at the front.");
          return;
        }
        const [selectedLayer] = layers.splice(currentIndex, 1);
        layers.push(selectedLayer);
      } else {
        if (currentIndex === 0) {
          showToast("Object is already at the back.");
          return;
        }
        [layers[currentIndex - 1], layers[currentIndex]] = [layers[currentIndex], layers[currentIndex - 1]];
      }
      layers.forEach((entry, index) => {
        entry.item.z = index + 1;
      });
      commit(direction === "front" ? "Brought object to front." : "Sent object backward.");
    }

    function toggleSelectedLock() {
      const entries = selectedObjects();
      if (!entries.length) return;
      const lockItems = !entries.every(({ item }) => item.locked);
      entries.forEach(({ item }) => {

      });
      commit(lockItems
        ? `Locked ${entries.length === 1 ? "item" : `${entries.length} items`} and kept ${entries.length === 1 ? "it" : "them"} visible.`
        : `Unlocked ${entries.length === 1 ? "item" : `${entries.length} items`}.`);
    }

      if (!grouping.valid) {
        showToast("Select exactly one hotspot plus one or more annotations, then click Group with hotspot.");
        return;

      const { hotspot, annotations } = grouping;
      const removeGroup = annotations.every(({ item }) => item.hotspotGroupId === hotspot.id);
      annotations.forEach(({ item }) => {

      commit(removeGroup
        ? `Ungrouped ${annotations.length === 1 ? "annotation" : `${annotations.length} annotations`} from ${hotspot.title || "this hotspot"}.`
        : `Grouped ${annotations.length === 1 ? "annotation" : `${annotations.length} annotations`} with ${hotspot.title || "this hotspot"}.`);
    }

      if (!shape) return;

      commit(shape.flipX ? "Flipped shape side to side." : "Restored shape direction.");
    }

    function arrangeSelected(mode) {
      const arrangement = arrangementEntries();
      const entries = arrangement.entries;
      const distribution = mode === "horizontal" || mode === "vertical";
      const minimum = distribution ? 3 : 2;
      if (entries.length < minimum) {
        if (entries.length === 1 && !distribution) {
          const item = entries[0].item;
          const pageHeight = 100;
          if (mode === "left") item.x = item.w / 2;
          if (mode === "center") item.x = 50;
          if (mode === "right") item.x = 100 - item.w / 2;
          if (mode === "top") item.y = item.h / 2;
          if (mode === "middle") item.y = pageHeight / 2;
          if (mode === "bottom") item.y = pageHeight - item.h / 2;
          commit("Aligned selected item to the slide.");
          return;
        }
        showToast(distribution ? "Select at least three unlocked items." : "Select at least two unlocked items.");
        return;
      }
      if (mode === "left") {
        const left = Math.min(...entries.map(({ item }) => item.x - item.w / 2));
        entries.forEach(({ item }) => {
          item.x = clamp(left + item.w / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "center") {
        const left = Math.min(...entries.map(({ item }) => item.x - item.w / 2));
        const right = Math.max(...entries.map(({ item }) => item.x + item.w / 2));
        const center = (left + right) / 2;
        entries.forEach(({ item }) => {
          item.x = clamp(center, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "right") {
        const right = Math.max(...entries.map(({ item }) => item.x + item.w / 2));
        entries.forEach(({ item }) => {
          item.x = clamp(right - item.w / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "top") {
        const top = Math.min(...entries.map(({ item }) => item.y - item.h / 2));
        entries.forEach(({ item }) => {
          item.y = clamp(top + item.h / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "middle") {
        const top = Math.min(...entries.map(({ item }) => item.y - item.h / 2));
        const bottom = Math.max(...entries.map(({ item }) => item.y + item.h / 2));
        const middle = (top + bottom) / 2;
        entries.forEach(({ item }) => {
          item.y = clamp(middle, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "bottom") {
        const bottom = Math.max(...entries.map(({ item }) => item.y + item.h / 2));
        entries.forEach(({ item }) => {
          item.y = clamp(bottom - item.h / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "horizontal") {
        const ordered = entries.slice().sort((a, b) => a.item.x - b.item.x);
        const start = ordered[0].item.x - ordered[0].item.w / 2;
        const last = ordered[ordered.length - 1].item;
        const end = last.x + last.w / 2;
        const totalWidth = ordered.reduce((sum, { item }) => sum + item.w, 0);
        const gap = (end - start - totalWidth) / (ordered.length - 1);
        let cursor = start;
        ordered.forEach(({ item }) => {
          item.x = clamp(cursor + item.w / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
          cursor += item.w + gap;
        });
      } else if (mode === "vertical") {
        const ordered = entries.slice().sort((a, b) => a.item.y - b.item.y);
        const start = ordered[0].item.y - ordered[0].item.h / 2;
        const last = ordered[ordered.length - 1].item;
        const end = last.y + last.h / 2;
        const totalHeight = ordered.reduce((sum, { item }) => sum + item.h, 0);
        const gap = (end - start - totalHeight) / (ordered.length - 1);
        let cursor = start;
        ordered.forEach(({ item }) => {
          item.y = clamp(cursor + item.h / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
          cursor += item.h + gap;
        });
      }
      const target = arrangement.usesAllHotspots ? "all hotspots" : "selected items";
      const messages = {
        left: `Aligned ${target} left.`,
        center: `Aligned ${target} to center.`,
        top: `Aligned ${target} to top.`,
        middle: `Aligned ${target} to middle.`,
        bottom: `Aligned ${target} to bottom.`,
        horizontal: `Distributed ${target} horizontally.`,
        vertical: `Distributed ${target} vertically.`
      };
      commit(messages[mode]);
    }

    function deleteSelected() {
      const slide = currentSlide();
      if (!state.ui.selectedId) return;
      stopAudio();
      if (state.ui.selectedKind === "hotspot") {
        const deletedHotspotId = state.ui.selectedId;
        slide.hotspots = slide.hotspots.filter((item) => item.id !== deletedHotspotId);
        slide.hotspots.forEach((item, index) => {
          item.color = hotspotStyle(index).color;
        });
        [...slide.hotspots, ...slide.annotations].forEach((item) => {
          if (item.hotspotGroupId === deletedHotspotId) item.hotspotGroupId = "";
        });
        state.ui.activeHotspotId = slideIntroCard(slide) ? null : slide.hotspots[0]?.id || null;
      } else {
        const deletedAnnotation = slide.annotations.find((item) => item.id === state.ui.selectedId);
        slide.annotations = slide.annotations.filter((item) => item.id !== state.ui.selectedId);
        if (deletedAnnotation?.type === "slide-intro") {
          state.ui.activeHotspotId = slide.hotspots[0]?.id || null;
        }
      }
      state.ui.selectedId = null;
      state.ui.selectedKind = null;
      commit("Deleted selected object.");

    function deleteSlide() {
      if (state.ui.slideIndex === 0) return;
      stopAudio();

    function moveSlide(direction) {
      const index = state.ui.slideIndex;
      const target = index + direction;
      if (index <= 0 || target <= 0 || target >= state.tutorial.slides.length) return;
      const [slide] = state.tutorial.slides.splice(index, 1);
      state.tutorial.slides.splice(target, 0, slide);
      state.ui.slideIndex = target;
      commit("Reordered slide.");
    }

      currentSlide().media.fit = ["match", "contain", "cover"].includes(value) ? value : "contain";
      commit(`Set media to ${value}.`);

    function nudgeMedia(dx, dy) {
      const media = currentSlide().media;

      media.y = clamp(media.y + dy, -40, 40);

      currentSlide().media.scale = clamp(currentSlide().media.scale + amount, MEDIA_MIN_SCALE, MEDIA_MAX_SCALE);

    function demoSlideDurationMs(slide = currentSlide()) {
      const seconds = slide?.demo?.timing === "manual"
        ? slide.demo.duration
        : state.meta.demoDefaultDuration;
      return clamp(Number(seconds) || DEMO_DEFAULT_DURATION, DEMO_MIN_DURATION, DEMO_MAX_DURATION) * 1000;
    }

    function syncDemoAudioTiming(slide = currentSlide()) {
      const hasAudio = Boolean(String(slide?.demo?.audioUrl || "").trim());
      if (hasAudio) slide.demo.timing = "audio";
      else if (slide?.demo?.timing === "audio") slide.demo.timing = "default";
      const timingSelect = root.querySelector("#demoTimingMode");
      if (timingSelect) timingSelect.value = slide.demo.timing;
      const durationInput = root.querySelector("#demoSlideDuration");
      if (durationInput) durationInput.disabled = slide.demo.timing !== "manual";
    }

    function demoSlideProgress() {
      if (!demoStarted) return 0;
      const slide = currentSlide();
      if (slide?.demo?.timing === "audio" && demoAudio && Number.isFinite(demoAudio.duration) && demoAudio.duration > 0) {
        return clamp(demoAudio.currentTime / demoAudio.duration, 0, 1);
      }
      if (demoTotalMs <= 0) return 0;
      const remaining = demoPlaying && demoDeadline
        ? Math.max(0, demoDeadline - performance.now())
        : demoRemainingMs;
      return clamp(1 - (remaining / demoTotalMs), 0, 1);
    }

    function demoOverallProgress() {
      if (demoFinished) return 100;
      const count = Math.max(1, state.tutorial.slides.length);
      return clamp(((state.ui.slideIndex + demoSlideProgress()) / count) * 100, 0, 100).toFixed(1);
    }

    function formatDemoTime(seconds) {
      const value = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(value / 60);
      const remainder = Math.floor(value % 60);
      return `${minutes}:${String(remainder).padStart(2, "0")}`;
    }

    function demoProgressText() {
      return `${Math.round(Number(demoOverallProgress()))}% complete`;
    }

    function updateDemoPlaybackUi() {
      if (!IS_DEMO_PLAYER || demoSeekPreview !== null) return;
      const seek = root.querySelector("[data-demo-seek]");
      const toggle = root.querySelector('[data-action="demo-toggle"]');
      const value = String(demoOverallProgress());
      const text = demoProgressText();
      if (seek) {
        seek.value = value;
        seek.setAttribute("aria-valuetext", text);
      }
      if (toggle) toggle.textContent = demoStarted && demoPlaying ? "Pause" : demoFinished ? "Replay" : "Play";
    }

    function clearDemoTimers() {
      window.clearTimeout(demoTimer);
      window.clearInterval(demoProgressTimer);
      demoTimer = 0;
      demoProgressTimer = 0;
      demoDeadline = 0;
    }

    function ensureDemoAudio() {
      if (!demoAudio) {
        demoAudio = new Audio();
        demoAudio.preload = "metadata";
      }
      return demoAudio;
    }

    function primeDemoAudio() {
      if (demoAudioPrimed) return;
      const audioSlide = state.tutorial.slides.find((slide) => String(slide?.demo?.audioUrl || "").trim());
      const url = String(audioSlide?.demo?.audioUrl || "").trim();
      if (!url) return;
      const audio = ensureDemoAudio();
      let absoluteUrl = url;
      try { absoluteUrl = new URL(url, location.href).href; } catch (_) {}
      audio.pause();
      audio.src = absoluteUrl;
      audio.muted = true;
      audio.load();
      let settled = false;
      demoAudioPrimePromise = new Promise((resolve) => {
        const finish = (primed) => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timeout);
          audio.pause();
          try { audio.currentTime = 0; } catch (_) {}
          audio.muted = false;
          demoAudioPrimed = primed;
          resolve();
        };
        const timeout = window.setTimeout(() => finish(false), 1500);
        try {
          const playRequest = audio.play();
          if (playRequest && typeof playRequest.then === "function") playRequest.then(() => finish(true)).catch(() => finish(false));
          else finish(true);
        } catch (_) {
          finish(false);
        }
      });
    }

    function prepareDemoAudio(slide, fraction = 0, resume = false) {
      const url = String(slide?.demo?.audioUrl || "").trim();
      if (!url) return null;
      const audio = ensureDemoAudio();
      let absoluteUrl = url;
      try { absoluteUrl = new URL(url, location.href).href; } catch (_) {}
      if (!resume || audio.src !== absoluteUrl) {
        audio.pause();
        audio.src = absoluteUrl;
        audio.load();
      }
      const applyFraction = () => {
        if (fraction > 0 && Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = clamp(fraction, 0, .999) * audio.duration;
        } else if (!resume && fraction <= 0) {
          audio.currentTime = 0;
        }
        if (slide.demo.timing === "audio" && Number.isFinite(audio.duration) && audio.duration > 0) {
          demoTotalMs = audio.duration * 1000;
          demoRemainingMs = Math.max(0, (audio.duration - audio.currentTime) * 1000);
        }
        updateDemoPlaybackUi();
      };
      if (audio.readyState >= 1) applyFraction();
      else audio.addEventListener("loadedmetadata", applyFraction, { once: true });
      return audio;
    }

    function scheduleDemoTimer(milliseconds) {
      const delay = Math.max(0, Number(milliseconds) || 0);
      window.clearTimeout(demoTimer);
      demoRemainingMs = delay;
      demoDeadline = performance.now() + delay;
      demoTimer = window.setTimeout(advanceDemoPlayback, delay);
    }

    function startDemoProgressTicker() {
      window.clearInterval(demoProgressTimer);
      demoProgressTimer = window.setInterval(updateDemoPlaybackUi, 120);
      updateDemoPlaybackUi();
    }

    async function startDemoSlidePlayback({ fraction = 0, resume = false } = {}) {
      if (!IS_DEMO_PLAYER || !demoPlaying) return;
      const playbackRequest = ++demoPlaybackRequest;
      clearDemoTimers();
      const slide = currentSlide();
      const slideId = slide.id;
      await playerVisualReadyPromise;
      if (!IS_DEMO_PLAYER || !demoPlaying || playbackRequest !== demoPlaybackRequest || currentSlide()?.id !== slideId) return;
      await demoAudioPrimePromise;
      if (!IS_DEMO_PLAYER || !demoPlaying || playbackRequest !== demoPlaybackRequest || currentSlide()?.id !== slideId) return;
      const timing = slide.demo.timing;
      if (resume && demoAudioEndDelayActive) {
        scheduleDemoTimer(demoRemainingMs || DEMO_AUDIO_END_DELAY_MS);
        startDemoProgressTicker();
        return;
      }
      if (!resume) demoAudioEndDelayActive = false;
      if (!resume) {
        demoTotalMs = demoSlideDurationMs(slide);
        demoRemainingMs = demoTotalMs * (1 - clamp(fraction, 0, .999));
      }
      const audio = prepareDemoAudio(slide, fraction, resume);
      if (audio) {
        const slideId = slide.id;
        audio.onended = () => {
          if (demoPlaying && currentSlide()?.id === slideId && timing === "audio") {
            demoAudioEndDelayActive = true;
            scheduleDemoTimer(DEMO_AUDIO_END_DELAY_MS);
          }
        };
        audio.onerror = () => {
          if (!demoPlaying || currentSlide()?.id !== slideId) return;
          demoAudioEndDelayActive = false;
          if (timing === "audio") {
            demoTotalMs = demoSlideDurationMs(slide);
            scheduleDemoTimer(demoTotalMs * (1 - clamp(fraction, 0, .999)));
          }
          updateDemoPlaybackUi();
        };
        audio.play().catch(() => {
          demoAudioEndDelayActive = false;
          if (timing === "audio" && demoPlaying) {
            demoTotalMs = demoSlideDurationMs(slide);
            scheduleDemoTimer(demoRemainingMs || demoTotalMs);
          }
          updateDemoPlaybackUi();
        });
      }
      if (timing !== "audio" || !audio) scheduleDemoTimer(demoRemainingMs || demoTotalMs);
      startDemoProgressTicker();
    }

    function stopDemoSlidePlayback() {
      if (demoPlaying && demoDeadline) demoRemainingMs = Math.max(0, demoDeadline - performance.now());
      clearDemoTimers();
      if (demoAudio) demoAudio.pause();
    }

    function pauseDemoPlayback() {
      if (!demoStarted || !demoPlaying) return;
      stopDemoSlidePlayback();
      demoPlaying = false;
      updateDemoPlaybackUi();
    }

    function resumeDemoPlayback() {
      if (!demoStarted || demoPlaying) return;
      if (demoFinished) {
        restartDemoPlayback();
        return;
      }
      primeDemoAudio();
      demoPlaying = true;
      startDemoSlidePlayback({ resume: true });
      updateDemoPlaybackUi();
    }

    function setDemoSlide(index, { fraction = 0, play = demoPlaying } = {}) {
      stopDemoSlidePlayback();
      demoAudioEndDelayActive = false;
      state.ui.slideIndex = clamp(index, 0, state.tutorial.slides.length - 1);
      const slide = currentSlide();
      state.ui.activeHotspotId = slideIntroCard(slide) ? null : slide.hotspots[0]?.id || null;
      state.ui.selectedKind = null;
      state.ui.selectedId = null;
      state.ui.contentsOpen = false;
      state.ui.videoModalId = null;
      demoFinished = false;
      demoPlaying = Boolean(play);
      demoTotalMs = demoSlideDurationMs(slide);
      demoRemainingMs = demoTotalMs * (1 - clamp(fraction, 0, .999));
      render();
      if (demoPlaying) startDemoSlidePlayback({ fraction });
      else prepareDemoAudio(slide, fraction, false);
      updateDemoPlaybackUi();
    }

    function advanceDemoPlayback() {
      stopDemoSlidePlayback();
      demoAudioEndDelayActive = false;
      if (state.ui.slideIndex >= state.tutorial.slides.length - 1) {
        demoFinished = true;
        demoPlaying = false;
        demoRemainingMs = 0;
        updateDemoPlaybackUi();
        return;
      }
      setDemoSlide(state.ui.slideIndex + 1, { fraction: 0, play: true });
    }

    function restartDemoPlayback() {
      demoStarted = true;
      demoFinished = false;
      demoPlaying = true;
      setDemoSlide(0, { fraction: 0, play: true });
      primeDemoAudio();
    }

    function toggleDemoPlayback() {
      if (!demoStarted || demoFinished) restartDemoPlayback();
      else if (demoPlaying) pauseDemoPlayback();
      else resumeDemoPlayback();
    }

    function previewDemoSeek(value) {
      if (demoSeekPreview === null) {
        demoSeekResumeAfter = demoPlaying;
        pauseDemoPlayback();
      }
      demoSeekPreview = clamp(Number(value), 0, 100);
    }

    function commitDemoSeek(value) {
      const percent = clamp(Number(value), 0, 100);
      const count = Math.max(1, state.tutorial.slides.length);
      const position = percent >= 100 ? count - Number.EPSILON : (percent / 100) * count;
      const index = Math.min(count - 1, Math.floor(position));
      const fraction = clamp(position - index, 0, .999);
      const shouldResume = demoSeekResumeAfter;
      demoSeekPreview = null;
      demoSeekResumeAfter = false;
      demoStarted = true;
      setDemoSlide(index, { fraction, play: shouldResume });
    }

    function readerNext() {
      if (IS_DEMO_PLAYER) {
        const slide = currentSlide();
        const index = slide.hotspots.findIndex((item) => item.id === state.ui.activeHotspotId);
        if (slide.hotspots.length && index < slide.hotspots.length - 1) {
          state.ui.activeHotspotId = slide.hotspots[Math.max(0, index + 1)].id;
          render();
          drawAttentionToHotspot(state.ui.activeHotspotId);
          updateDemoPlaybackUi();
        } else if (state.ui.slideIndex < state.tutorial.slides.length - 1) {
          setDemoSlide(state.ui.slideIndex + 1, { play: demoPlaying });
        }
        return;
      }
      const slide = currentSlide();
      if (slide.hotspots.length) {
        const index = slide.hotspots.findIndex((item) => item.id === state.ui.activeHotspotId);
        if (index < slide.hotspots.length - 1) {
          stopAudio();
          const nextHotspotId = slide.hotspots[index + 1].id;
          state.ui.activeHotspotId = nextHotspotId;
          state.ui.selectedKind = null;
          state.ui.selectedId = null;
          multiSelection = [];
          render();
          drawAttentionToHotspot(nextHotspotId);
          return;
        }
      }
      if (state.ui.slideIndex < state.tutorial.slides.length - 1) jumpSlide(state.ui.slideIndex + 1);
    }

    function readerBack() {
      if (IS_DEMO_PLAYER) {
        const slide = currentSlide();
        const index = slide.hotspots.findIndex((item) => item.id === state.ui.activeHotspotId);
        if (index === 0 && slideIntroCard(slide)) {
          state.ui.activeHotspotId = null;
          render();
          updateDemoPlaybackUi();
        } else if (index > 0) {
          state.ui.activeHotspotId = slide.hotspots[index - 1].id;
          render();
          drawAttentionToHotspot(state.ui.activeHotspotId);
          updateDemoPlaybackUi();
        } else if (state.ui.slideIndex > 0) {
          setDemoSlide(state.ui.slideIndex - 1, { play: demoPlaying });
          const previous = currentSlide();
          if (previous.hotspots.length) {
            state.ui.activeHotspotId = previous.hotspots[previous.hotspots.length - 1].id;
            render();
            updateDemoPlaybackUi();
          }
        }
        return;
      }
      const slide = currentSlide();
      if (slide.hotspots.length) {
        const index = slide.hotspots.findIndex((item) => item.id === state.ui.activeHotspotId);
        if (index === 0 && slideIntroCard(slide)) {
          stopAudio();
          state.ui.activeHotspotId = null;
          state.ui.selectedKind = null;
          state.ui.selectedId = null;
          multiSelection = [];
          render();
          return;
        }
        if (index > 0) {
          stopAudio();
          const previousHotspotId = slide.hotspots[index - 1].id;
          state.ui.activeHotspotId = previousHotspotId;
          state.ui.selectedKind = null;
          state.ui.selectedId = null;
          multiSelection = [];
          render();
          drawAttentionToHotspot(previousHotspotId);
          return;
        }
      }
      if (state.ui.slideIndex > 0) {
        jumpSlide(state.ui.slideIndex - 1, true);
      }
    }

    function jumpSlide(index, useLastHotspot = false) {
      if (IS_DEMO_PLAYER) {
        setDemoSlide(index, { play: demoPlaying });
        return;
      }
      stopAudio();
      state.ui.slideIndex = clamp(index, 0, state.tutorial.slides.length - 1);
      const slide = currentSlide();
      const lastHotspot = slide.hotspots[slide.hotspots.length - 1];
      state.ui.activeHotspotId = useLastHotspot
        ? lastHotspot?.id || null
        : slideIntroCard(slide)
          ? null
          : slide.hotspots[0]?.id || null;
      state.ui.selectedKind = null;
      state.ui.selectedId = null;
      multiSelection = [];
      state.ui.contentsOpen = false;
      state.ui.videoModalId = null;
      render();
      drawAttentionToHotspot(state.ui.activeHotspotId);
    }

    function openContents(trigger) {
      if (IS_DEMO_PLAYER) pauseDemoPlayback();
      state.ui.contentsOpen = true;
      render();
      setTimeout(() => document.querySelector(".contents-card")?.focus(), 0);
    }

    function closeContents() {
      state.ui.contentsOpen = false;
      render();
      setTimeout(() => root.querySelector('[data-action="open-contents"]')?.focus(), 0);
    }

    function openVideo(id) {

      if (!annotation?.url) {
        showToast("Add the video URL first.");
        return;
      }
      if (IS_DEMO_PLAYER) pauseDemoPlayback();
      lastVideoTriggerId = id;

      setTimeout(() => document.querySelector('[data-action="close-video"]')?.focus(), 0);

    async function toggleVideo() {
      const video = document.getElementById("videoModalMedia");
      if (!video) return;
      if (video.paused) {

    async function toggleMainVideo() {
      const video = root.querySelector("[data-main-video]");
      if (!video) return;
      if (video.paused) {
        if (Number.isFinite(video.duration) && video.currentTime >= video.duration) video.currentTime = 0;
        try {
          await video.play();

    function openLink(url) {
      if (!url) return;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function stopAudio() {
      if (window.__tutorialAudio) {
        window.__tutorialAudio.pause();
        window.__tutorialAudio.currentTime = 0;
      }
      activeAudio = null;
      audioPlaying = false;
    }

    function rewindAudio(id) {
      if (window.__tutorialAudio && activeAudio === id) window.__tutorialAudio.currentTime = 0;
      else {
        const annotation = currentSlide().annotations.find((item) => item.id === id);
        if (!annotation?.url) return;
        stopAudio();
        window.__tutorialAudio = createTutorialAudio(annotation.url, id);
        activeAudio = id;
        audioPlaying = false;
        window.__tutorialAudio.currentTime = 0;
      }
      render();
    }

    function createTutorialAudio(url, id) {
      const audio = new Audio();
      audio.preload = "metadata";
      audio.crossOrigin = "anonymous";
      audio.src = normalizeHostedAnnotationUrl("audio", url);
      const updateTimeline = () => {
        if (window.__tutorialAudio === audio && activeAudio === id) updateAudioTimeline(id);
      };
      audio.addEventListener("loadedmetadata", updateTimeline);
      audio.addEventListener("durationchange", updateTimeline);
      audio.addEventListener("timeupdate", updateTimeline);
      audio.addEventListener("ended", () => {
        if (window.__tutorialAudio !== audio || activeAudio !== id) return;
        activeAudio = null;
        audioPlaying = false;
        render();
      });
      return audio;
    }

    function updateAudioTimeline(id) {
      const audio = window.__tutorialAudio;
      const timeline = root.querySelector(`[data-audio-timeline][data-id="${CSS.escape(id)}"]`);
      if (!audio || activeAudio !== id || !timeline) return;
      const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
      const currentTime = clamp(audio.currentTime, 0, duration);
      timeline.max = String(duration);
      timeline.value = String(currentTime);
      timeline.setAttribute("aria-valuetext", `${formatVideoTime(currentTime)} of ${formatVideoTime(duration)}`);
    }

    function audioFailureMessage(audio) {
      const code = audio?.error?.code || 0;
      if (code === 2) return "Audio could not load because of a network error. Check the direct file URL.";
      if (code === 3) return "The browser could not decode this audio file.";
      if (code === 4) return "Audio URL did not return a supported audio file. Check the hosted path.";
      return "The browser could not start this audio. Check that the URL opens the audio file directly.";
    }

    async function toggleAudio(id) {
      const annotation = currentSlide().annotations.find((item) => item.id === id);
      if (!annotation?.url) return;
      if (!window.__tutorialAudio || activeAudio !== id) {
        stopAudio();
        window.__tutorialAudio = createTutorialAudio(annotation.url, id);
        activeAudio = id;
        audioPlaying = false;
      }
      if (window.__tutorialAudio.paused) {
        try {
          await window.__tutorialAudio.play();
          audioPlaying = true;
        } catch (_) {
          audioPlaying = false;
          showToast(audioFailureMessage(window.__tutorialAudio));
        }
      } else {
        window.__tutorialAudio.pause();
        audioPlaying = false;
      }
      render();
      if (audioPlaying) updateAudioTimeline(id);
    }

    function metadataForExport(exportState) {
      const cover = exportState.tutorial.slides[0];
      const title = exportState.meta.socialTitle || exportState.tutorial.title || "Magic Hashtags Tutorial";
      const description = exportState.meta.socialDescription || exportState.meta.summary || cover?.description || "An interactive tutorial from Magic Hashtags.";
      const image = exportState.meta.socialImage || cover?.media?.url || SITE_HEADER_LOGO_URL;
      return { title, description, image, alt: exportState.meta.socialImageAlt || `${title} tutorial preview`, url: publicUrl(exportState.meta) };

    function applyHeadMetadata(documentElement, exportState) {
      const head = documentElement.querySelector("head");
      const metadata = metadataForExport(exportState);
      head.querySelector("title").textContent = `${metadata.title} | Magic Hashtags`;
      setMeta(head, "name", "description", metadata.description);
      setMeta(head, "property", "og:type", "website");
      setMeta(head, "property", "og:site_name", "Magic Hashtags");
      setMeta(head, "property", "og:title", metadata.title);
      setMeta(head, "property", "og:description", metadata.description);
      setMeta(head, "property", "og:url", metadata.url);
      setMeta(head, "property", "og:image", metadata.image);
      setMeta(head, "property", "og:image:alt", metadata.alt);
      setMeta(head, "name", "twitter:card", "summary_large_image");
      setMeta(head, "name", "twitter:title", metadata.title);
      setMeta(head, "name", "twitter:description", metadata.description);
      setMeta(head, "name", "twitter:image", metadata.image);
      setMeta(head, "name", "twitter:image:alt", metadata.alt);
      let canonical = head.querySelector('link[rel="canonical"]');
      if (!canonical) {
        canonical = documentElement.ownerDocument.createElement("link");
        canonical.rel = "canonical";
        head.append(canonical);
      }
      canonical.href = metadata.url;
    }

    function setMeta(head, attribute, key, content) {
      let node = head.querySelector(`meta[${attribute}="${key}"]`);
      if (!node) {
        node = head.ownerDocument.createElement("meta");
        node.setAttribute(attribute, key);
        head.append(node);
      }
      node.content = content;
    }

  `;

    async function copyPublicUrl() {
      const value = publicUrl();
      if (!value) {
        showToast("Add a learning section and tutorial slug first.");
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
      } catch (_) {
        const input = document.createElement("textarea");
        input.value = value;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.append(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }
      showToast("Copied the public social share URL.");
    }

    function download(filename, contents, type) {
      const blob = new Blob([contents], { type: `${type};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Tutorial Builder Centered v1</title>
  <link id="hanken-grotesk-preload" rel="preload" href="../../website/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>

  <style id="hanken-grotesk-font-face">
    @font-face {
      font-family: "Hanken Grotesk";
      src:
        url("../../website/fonts/hanken-grotesk-latin.woff2") format("woff2"),
        url("https://magichashtags.com/fonts/hanken-grotesk-latin.woff2") format("woff2");

      font-display: swap;
    }
    @font-face {
      font-family: "Hanken Grotesk";
      src:
        url("../../website/fonts/hanken-grotesk-latin-italic.woff2") format("woff2"),
        url("https://magichashtags.com/fonts/hanken-grotesk-latin-italic.woff2") format("woff2");

      font-weight: 100 900;
      font-display: swap;

  </style>
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --yellow: #f1f332;
      --pink: #ff90e7;
      --green: #24a094;
      --purple: #91a8ed;
      --orange: #ffc900;
      --soft-pink: #fbeaf9;
      --gray: #d7d7d7;
      --muted: #6d6d6d;
      --font-interface: "Hanken Grotesk", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      --mono: var(--font-interface);
      --sans: var(--font-interface);
      --body: var(--font-interface);
      --hand: "Shadows Into Light Two", cursive;
      --border-width: 3px;
      --border-heavy: 4px;
      --shadow-small: 4px 4px 0 var(--black);
      --shadow-medium: 7px 7px 0 var(--black);
      --shadow-large: 10px 10px 0 var(--black);
      --panel-border: 4px solid var(--black);
      --shadow: var(--shadow-medium);
      --small-shadow: var(--shadow-small);
      --shell: min(1500px, calc(100vw - clamp(32px, 5vw, 72px)));
      --page-media-aspect: 5 / 3;
    }

    * {
      box-sizing: border-box;
      font-synthesis: none;
    }
    html { min-height: 100%; }
    body {
      min-height: 100%;
      margin: 0;
      color: var(--black);
      background: #fff7c8;
      font-family: var(--font-interface);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0;
    }

    body[data-mode="player"] {
      padding: 0;
      background: #9ca3af;
      font-family: var(--font-interface);
      font-weight: 400;
    }
    body[data-mode="player"] :where(button, input, textarea, select, option, code, pre, kbd, samp) {
      font-family: var(--font-interface) !important;
      font-synthesis: none;
    }
    body[data-mode="player"] .tutorial-title { font-weight: 500; }
    body[data-mode="player"] :where(
      .slide-sidebar__title,
      .hotspot-row__title,
      .slide-intro-card__title,
      .standalone-callout-card__title,
      .modal-header,
      .contents-card-title,
      .tutorial-link-callout h2
    ) { font-weight: 600; }
    body[data-mode="player"] :where(button, .tutorial-link-callout__button) { font-weight: 700; }
    body[data-mode="player"] :where(
      .site-nav__link,
      button.site-nav__dropdown-trigger,
      .site-header-contact
    ) { font-weight: 600; }

    button, input, select, textarea {
      font-family: var(--font-interface);
      font-synthesis: none;
    }
    button, select, input, textarea { border-radius: 0; }
    button {
      min-height: 36px;
      border: 3px solid var(--black);
      padding: 7px 10px;
      color: var(--black);
      background: var(--white);
      box-shadow: var(--shadow-small);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: .025em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: var(--yellow);
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--black);
    }
    button:active:not(:disabled) {
      transform: translate(4px, 4px);
      box-shadow: none;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [contenteditable="true"]:focus-visible {
      outline: 3px solid var(--black);
      outline-offset: 3px;
    }
    button:disabled { cursor: not-allowed; opacity: .4; }
    button.is-active { background: var(--yellow); }
    button.is-danger { background: #ffdede; }
    button.is-dark { color: var(--white); background: var(--black); }
    button.icon-button {
      display: inline-flex;
      width: 38px;
      min-width: 38px;
      height: 36px;
      padding: 5px;
      align-items: center;
      justify-content: center;
    }
    button.icon-button svg { width: 21px; height: 21px; }

    input, select, textarea {
      width: 100%;
      min-height: 40px;
      border: 3px solid var(--black);
      padding: 8px 10px;
      color: var(--black);
      background: var(--white);
      box-shadow: none;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: .005em;
    }
    textarea { min-height: 74px; resize: vertical; }
    label {
      display: grid;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    [hidden] { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 260;
      border-bottom: 4px solid var(--white);
      background: var(--black);
    }
    .site-header__inner {
      width: min(1280px, calc(100vw - 3rem));
      margin: 0 auto;
      padding: 1rem 0;
    }
    .site-nav {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      min-width: 0;
    }
    .site-nav__brand {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 0 1 auto;
    }
    .site-nav__brand a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      padding: 0;
      color: inherit;
      background: transparent;
      box-shadow: none;
      text-decoration: none;
      transition: transform 200ms ease;
    }
    .site-nav__brand a:hover,
    .site-nav__brand a:focus-visible {
      transform: translateY(-2px);
    }
    .site-header-logo {
      display: block;
      width: clamp(10rem, 28vw, 18rem);
      height: auto;
      max-height: 4.6rem;
      object-fit: contain;
    }
    .site-nav__desktop {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 1rem;
      min-width: 0;
      flex-wrap: wrap;
    }
    .site-nav__link,
    button.site-nav__dropdown-trigger,
    .site-header-contact {
      font-family: var(--sans);
      font-size: .98rem;
      font-weight: 600;
      letter-spacing: .05em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }
    .site-nav__link,
    button.site-nav__dropdown-trigger {
      min-height: 3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px solid transparent;
      padding: .75rem 1.5rem;
      color: var(--white);
      background: transparent;
      box-shadow: none;
    }
    .site-nav__link:hover,
    .site-nav__link:focus-visible,
    button.site-nav__dropdown-trigger:hover:not(:disabled),
    button.site-nav__dropdown-trigger:focus-visible {
      border-color: var(--yellow);
      color: var(--black);
      background: var(--yellow);
      box-shadow: none;
      transform: none;
    }
    .site-header-contact {
      min-height: 3.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--white);
      padding: 0 1.5rem;
      color: var(--black);
      background: var(--white);
      box-shadow: none;
    }
    .site-header-contact:hover,
    .site-header-contact:focus-visible {
      border-color: var(--pink);
      color: var(--black);
      background: var(--pink);
    }
    .site-nav__dropdown { position: relative; }
    .site-nav__dropdown-menu {
      position: absolute;
      top: calc(100% + 16px);
      left: 50%;
      z-index: 280;
      width: min(42rem, calc(100vw - 2rem));
      min-width: 0;
      max-width: calc(100vw - 2rem);
      display: none;
      transform: translateX(-50%);
    }
    .site-nav__dropdown[data-open="true"] .site-nav__dropdown-menu,
    .site-nav__dropdown:hover .site-nav__dropdown-menu,
    .site-nav__dropdown:focus-within .site-nav__dropdown-menu {
      display: block;
    }
    .site-nav__dropdown-menu::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -16px;
      height: 16px;
    }
    .site-nav__dropdown-shadow {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--black);
      transform: translate(4px, 4px);
    }
    .site-nav__dropdown-card {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .5rem;
      border: 4px solid var(--black);
      padding: .75rem;
      background: var(--white);
    }
    .site-nav__dropdown-card a,
    .site-nav__mobile-panel a {
      display: block;
      border: 3px solid var(--black);
      padding: .78rem .95rem;
      color: var(--black);
      background: var(--white);
      box-shadow: none;
      font-family: var(--sans);
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .045em;
      line-height: 1.2;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
      transition: transform 160ms ease, background-color 160ms ease;
    }
    .site-nav__dropdown-card a:hover,
    .site-nav__dropdown-card a:focus-visible,
    .site-nav__mobile-panel a:hover,
    .site-nav__mobile-panel a:focus-visible {
      color: var(--black);
      background: var(--hover-color, var(--yellow));
      transform: none;
    }
    button.site-nav__mobile-toggle {
      width: 2.45rem;
      min-width: 2.45rem;
      height: 2.45rem;
      min-height: 2.45rem;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .28rem;
      margin-left: auto;
      border: 0;
      padding: 0;
      color: var(--white);
      background: transparent;
      box-shadow: none;
    }
    button.site-nav__mobile-toggle:hover:not(:disabled),
    button.site-nav__mobile-toggle:focus-visible {
      color: var(--yellow);
      background: transparent;
      box-shadow: none;
      transform: none;
    }
    .site-nav__mobile-toggle span {
      display: block;
      width: 1.15rem;
      height: 2px;
      background: currentColor;
    }
    .site-nav__mobile-panel {
      position: absolute;
      top: calc(100% + .7rem);
      right: 0;
      z-index: 290;
      width: min(19rem, calc(100vw - 2rem));
      display: none;
      gap: .45rem;
      border: 4px solid var(--black);
      padding: .55rem;
      background: var(--white);
      box-shadow: none;
    }
	    .site-nav__mobile-panel:not([hidden]) { display: grid; }

    .site-nav__mobile-tools {
      border: 0;
      background: transparent;
    }
    .site-nav__mobile-tools summary {
      display: block;
      border: 3px solid var(--black);
      padding: .72rem .8rem;
      color: var(--black);
      background: var(--white);
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .045em;
      line-height: 1.1;
      text-transform: uppercase;
      cursor: pointer;
    }
    .site-nav__mobile-tools summary:hover,
    .site-nav__mobile-tools summary:focus-visible {
      background: var(--yellow);
      outline: 0;
    }
    .site-nav__mobile-tools-links {
      display: grid;
      gap: .4rem;
      padding: .4rem 0 .15rem .55rem;
    }

	    .tutorial-page-links {
	      width: var(--shell);
	      display: grid;
	      gap: 6px;
	      margin: 0 auto 6px;
	    }
	    .tutorial-breadcrumbs {
	      display: flex;
	      flex-wrap: wrap;
	      align-items: center;
	      gap: 8px;
	      border: 3px solid var(--black);
	      padding: 5px 8px;
	      background: var(--white);
	      box-shadow: none;
	      font-size: 12px;
	      font-weight: 600;
	      letter-spacing: .045em;
	      text-transform: uppercase;
	    }
	    .tutorial-breadcrumbs a {
	      color: var(--black);
	      text-decoration: none;
	    }
	    .tutorial-breadcrumbs a:hover,
	    .tutorial-breadcrumbs a:focus-visible {
	      background: var(--yellow);
	      outline: 2px solid var(--black);
	      outline-offset: 2px;
	    }
	    .tutorial-breadcrumbs span { opacity: .55; }
	    .tutorial-link-callout {
	      display: flex;
	      align-items: center;
	      justify-content: space-between;
	      gap: 18px;
	      border: 4px solid var(--black);
	      padding: 14px 16px;
	      background: var(--yellow);
	      box-shadow: var(--shadow);
	    }
	    .tutorial-link-callout--related { background: var(--soft-pink); }
	    .tutorial-link-callout__copy { min-width: 0; }
	    .tutorial-link-callout__eyebrow {
	      margin: 0 0 3px;
	      font-size: 11px;
	      font-weight: 600;
	      letter-spacing: .06em;
	      text-transform: uppercase;
	    }
	    .tutorial-link-callout h2 {
	      margin: 0;
	      font-size: clamp(16px, 2.2vw, 22px);
	      line-height: 1.2;
	      text-transform: uppercase;
	    }
	    .tutorial-link-callout p {
	      margin: 4px 0 0;
	      font-size: 14px;
	      font-weight: 500;
	      line-height: 1.4;
	    }
	    .tutorial-link-callout__button {
	      flex: 0 0 auto;
	      display: inline-flex;
	      align-items: center;
	      justify-content: center;
	      min-height: 44px;
	      border: 3px solid var(--black);
	      padding: 8px 12px;
	      color: var(--black);
	      background: var(--white);
	      box-shadow: var(--shadow-small);
	      font-size: 12px;
	      font-weight: 600;
	      letter-spacing: .045em;
	      text-decoration: none;
	      text-transform: uppercase;
	    }
	    .tutorial-link-callout__button:hover,
	    .tutorial-link-callout__button:focus-visible {
	      background: var(--pink);
	      transform: translate(2px, 2px);
	      box-shadow: 2px 2px 0 var(--black);
	    }

	    .builder-app { width: 100%; padding: 12px 0 48px; }
    .builder-toolbar,
    .tutorial-shell,
    .builder-lower,
    .metadata-panel {
      width: var(--shell);
      margin-inline: auto;
    }

    .builder-toolbar {
      position: sticky;
      top: 0;
      z-index: 90;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(440px, 480px);
      align-items: start;
      gap: 10px;
      padding: 6px;
      border: 3px solid var(--black);
      background: var(--white);
      box-shadow: var(--shadow);
      overflow: visible;
    }
    .builder-toolbar button {
      min-height: 36px;
      padding: 4px 7px;
      font-size: 12px;
    }
    .toolbar-controls {
      display: grid;
      grid-template-columns: max-content 104px max-content 116px;
      grid-template-areas:
        "arrange opacity hotspot shapes"
        "markups width text cards"
        "effects effects effects effects";
      align-items: center;
      gap: 6px 10px;
      min-width: 0;
    }
    .toolbar-cluster {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .toolbar-arrange { grid-area: arrange; }
    .toolbar-opacity-control { grid-area: opacity; }
    .toolbar-hotspot { grid-area: hotspot; }
    .toolbar-shapes { grid-area: shapes; }
    .toolbar-markups { grid-area: markups; }
    .toolbar-width-control { grid-area: width; }
    .toolbar-text { grid-area: text; }
    .toolbar-cards { grid-area: cards; }
    .toolbar-effects { grid-area: effects; }
    .toolbar-media-controls { grid-area: effects; }
    @media (min-width: 921px) {
      .toolbar-controls {
        grid-template-columns: max-content 104px 156px 116px;
      }
      .toolbar-text {
        z-index: 1;
        width: max-content;
      }
      .toolbar-cards {
        transform: translateX(240px);
      }
    }
    .builder-toolbar button.toolbar-square,
    .toolbar-icon-select {
      width: 36px;
      min-width: 36px;
      height: 36px;
      min-height: 36px;
    }
    .builder-toolbar button.toolbar-square {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .builder-toolbar button.toolbar-compact-word {
      padding-inline: 2px;
      font-size: 9px;
      letter-spacing: 0;
    }
    .toolbar-icon-image {
      display: block;
      width: 24px;
      height: 24px;
      object-fit: contain;
      pointer-events: none;
    }
    .builder-toolbar button.toolbar-word-button {
      width: auto;
      min-width: 0;
      white-space: nowrap;
    }
    .builder-toolbar button.toolbar-group-button { min-width: 72px; }
    .builder-toolbar button.toolbar-background-button { min-width: 78px; }
    .builder-toolbar button.toolbar-blur-button { min-width: 54px; }
    .builder-toolbar button.toolbar-card-button { min-width: 94px; }
    .builder-toolbar button.toolbar-callout-button { min-width: 82px; }
    .toolbar-icon-select {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--black);
      color: var(--black);
      background: var(--white);
      box-shadow: var(--shadow-small);
    }
    .toolbar-icon-select:hover {
      background: var(--yellow);
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--black);
    }
    .toolbar-icon-select:focus-within {
      outline: 3px solid var(--black);
      outline-offset: 3px;
    }
    .toolbar-icon-select select,
    .toolbar-color-control input[type="color"] {
      position: absolute;
      inset: 0;
      width: 100%;
      min-width: 0;
      height: 100%;
      min-height: 0;
      margin: 0;
      border: 0;
      padding: 0;
      opacity: 0;
      box-shadow: none;
      cursor: pointer;
    }
    .toolbar-slider-control {
      display: grid;
      align-items: center;
      min-width: 0;
    }
    .toolbar-slider-control input[type="range"] { width: 100%; }
    .toolbar-shapes select {
      width: 116px;
      min-width: 116px;
      height: 36px;
      min-height: 36px;
      padding: 4px 24px 4px 8px;
      font-size: 12px;
      text-transform: uppercase;
    }
    .toolbar-effects {
      flex-wrap: nowrap;
      justify-self: start;
    }
    .stage-media-controls.toolbar-media-controls {
      position: static;
      z-index: auto;
      justify-self: end;
      max-width: none;
      height: 36px;
      flex-wrap: nowrap;
      gap: 3px;
      border: 0;
      padding: 0;
      background: transparent;
      box-shadow: none;
    }
    .stage-media-controls.toolbar-media-controls::before {
      padding-inline: 1px;
      font-size: 9px;
    }
    .stage-media-controls.toolbar-media-controls button {
      height: 28px;
      min-height: 28px;
      padding: 2px 4px;
      box-shadow: var(--shadow-small);
      font-size: 8px;
    }
    .stage-media-controls.toolbar-media-controls button.icon-button {
      width: 28px;
      min-width: 28px;
      padding: 2px;
    }
    .draft-save-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .draft-save-summary {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      min-height: 13px;
      padding: 0 2px;
      border: 0;
      background: transparent;
      line-height: 1;
    }
    .draft-file-name {
      min-width: 0;
      overflow: hidden;
      font-size: 8px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .draft-save-status {
      flex: 0 0 auto;
      font-size: 8px;
      font-weight: 600;
      white-space: nowrap;
    }
    .draft-save-status[data-state="saving"] { color: #7a5900; }
    .draft-save-status[data-state="saved"] { color: #17695f; }
    .draft-save-status[data-state="error"] { color: #a40000; }
    .draft-save-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex-wrap: nowrap;
    }
    .builder-toolbar .draft-save-actions button {
      width: auto;
      min-width: 0;
      height: 28px;
      min-height: 28px;
      padding: 2px 5px;
      font-size: 9px;
      letter-spacing: 0;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 2px 2px 0 var(--black);
    }
    .builder-toolbar button.text-style-button {
      width: 36px;
      min-width: 36px;
      height: 36px;
      min-height: 36px;
      padding: 0;
      font-family: var(--font-interface);
      font-size: 16px;
      font-style: normal;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
      text-transform: none;
    }
    .builder-toolbar button.text-style-button--italic {
      font-style: italic;

    function uid(prefix = "item") {
      if (globalThis.crypto && crypto.randomUUID) return `${prefix}-${crypto.randomUUID()}`;
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, Number(value) || 0));
    }

	    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
	    }

	    function safeLinkUrl(value) {
	      const url = String(value || "").trim();
	      return !url || /^(?:javascript|data):/i.test(url) ? "" : url;
	    }

    function readJson(value, fallback) {
      try { return value ? JSON.parse(value) : fallback; }
      catch (_) { return fallback; }
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function hotspotStyle(index) {
      const length = HOTSPOT_STYLES.length;
      const normalizedIndex = ((Number(index) || 0) % length + length) % length;
      return HOTSPOT_STYLES[normalizedIndex];
    }

    function contentsNumberStyle(index) {
      const style = hotspotStyle(index - 1);
      const ink = style.name === "mauve" ? "#ffffff" : "#000000";
      return `--contents-number-color:${style.color};--contents-number-ink:${ink}`;
    }

    function hotspotSlotIndex(id, slide = currentSlide()) {
      return slide?.hotspots?.findIndex((item) => item.id === id) ?? -1;
    }

    function slugify(value) {
      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 80);
    }

    function detectMediaType(url) {
      const value = String(url || "");
      return Object.entries(MEDIA_TYPES).find(([, pattern]) => pattern.test(value))?.[0] || "image";
    }

    function builtInAnnotationFilename(value) {
      const original = String(value || "").trim();
      if (!original || /^data:/i.test(original)) return "";
      try {
        const url = new URL(original, location.href);
        const marker = "/images/tutorial-annotations/";
        const markerIndex = url.pathname.indexOf(marker);
        if (markerIndex < 0) return "";
        const encodedFilename = url.pathname.slice(markerIndex + marker.length);
        return decodeURIComponent(encodedFilename);
      } catch (_) {
        return "";
      }
    }

    function canonicalAnnotationFilename(value) {
      const filename = String(value || "").replace(/^.*\//, "");
      return filename.toLowerCase() === "audio-annotation.png"
        ? "play-audio-annotation.png"
        : filename;
    }

    function encodedAnnotationFilename(value) {
      return canonicalAnnotationFilename(value)
        .split("/")
        .map((part) => encodeURIComponent(part))
        .join("/");
    }

    function annotationAssetUrl(filename) {
      return `${ANNOTATION_ASSET_ROOT}${encodedAnnotationFilename(filename)}`;
    }

    function publicAnnotationAssetUrl(filename) {
      return `${PUBLIC_ANNOTATION_ASSET_ROOT}${encodedAnnotationFilename(filename)}`;
    }

    function resolveAnnotationAssetSrc(value) {
      const filename = builtInAnnotationFilename(value);
      return filename ? annotationAssetUrl(filename) : String(value || "");
    }

    function normalizeShapeAssetUrl(name, value) {
      const filename = builtInAnnotationFilename(value)
        || (String(name || "").toLowerCase() === "audio annotation" ? "play-audio-annotation.png" : "");
      return filename ? publicAnnotationAssetUrl(filename) : encodeURI(String(value || ""));
    }

    function renderAnnotationAssetImage(src, label, loading = "eager") {
      const safeLabel = String(label || "Annotation");
      return `<span class="annotation-asset-fallback" aria-hidden="true">${escapeHtml(safeLabel)}</span><img src="${escapeHtml(resolveAnnotationAssetSrc(src))}" alt="${escapeHtml(safeLabel)}" loading="${loading}" onload="this.hidden=false;this.closest('.annotation-asset-frame')?.classList.remove('has-missing-annotation-art')" onerror="this.hidden=true;this.closest('.annotation-asset-frame')?.classList.add('has-missing-annotation-art')">`;

    function normalizeHotspot(item, index) {
      const hasPopupX = item?.popupX !== null && item?.popupX !== undefined && item?.popupX !== "" && Number.isFinite(Number(item.popupX));

    function normalizeAnnotation(item, index) {
      const type = ["shape", "image", "gif", "video", "audio", "link", "text", "slide-intro", "callout", "markup", "cover", "blur"].includes(item?.type)

      const markup = normalizeMarkupKind(item?.markup);
      const textStyle = item?.textStyle === "bold"

        markupColor: /^#[0-9a-f]{6}$/i.test(String(item?.markupColor || "")) ? String(item.markupColor) : "#000000",
        blurStrength: clamp(item?.blurStrength ?? 12, 1, 30),

        w: clamp(item?.w ?? (type === "audio" ? 30 : type === "slide-intro" ? 38 : type === "callout" ? 34 : 18), 5, 90),
        h: clamp(item?.h ?? (type === "audio" ? 30 : ["cover", "blur"].includes(type) ? 30 : type === "slide-intro" ? 18 : type === "callout" ? 22 : 16), 4, 90),
        z: Number.isFinite(item?.z) ? item.z : index + 50,

    function normalizeMarkupKind(value) {
      const candidate = String(value || "");
      const legacy = {
        line: "line-dotted",
        arrow: "arrow-solid",
        box: "square-solid",
        circle: "circle-solid"
      };
      if (legacy[candidate]) return legacy[candidate];
      const valid = MARKUP_SHAPES.some((shape) => {
        const styles = ["circle", "square"].includes(shape.key) ? CLOSED_MARKUP_STYLES : MARKUP_STYLES;
        return styles.some((style) => candidate === `${shape.key}-${style.key}`);
      }) || ["circle-dotted", "square-dotted"].includes(candidate);
      return valid ? candidate : "line-solid";
    }

    function isPathMarkup(kind) {
      return kind.startsWith("line-") || kind.startsWith("arrow-");
    }

    function normalizeMarkupPoints(points, kind) {
      const defaults = kind.startsWith("arrow-")
        ? { start: { x: 8, y: 64 }, curve: { x: 50, y: 36 }, end: { x: 92, y: 50 } }
        : { start: { x: 8, y: 50 }, curve: { x: 50, y: 50 }, end: { x: 92, y: 50 } };
      const point = (value, fallback) => ({
        x: clamp(value?.x ?? fallback.x, 2, 98),
        y: clamp(value?.y ?? fallback.y, 2, 98)
      });
      return {
        start: point(points?.start, defaults.start),
        curve: point(points?.curve, defaults.curve),
        end: point(points?.end, defaults.end)
      };
    }

    function markupLabel(kind) {
      const [shape, style] = normalizeMarkupKind(kind).split("-");
      const styleLabel = style === "dotted" ? "Dotted" : style === "fill" ? "Filled" : "Solid";
      return `${styleLabel} ${shape}`;
    }

    function createSlide(kind) {
      return normalizeSlide({
        id: uid(kind),
        kind,
        title: kind === "cover" ? "TUTORIAL SUBTITLE" : kind === "video" ? "VIDEO PAGE" : "SLIDE TITLE",
        description: kind === "cover" ? "Tutorial description." : kind === "image" ? "Slide description." : "",
        media: { url: "", type: kind === "video" ? "video" : "image", fit: "contain", matte: kind === "cover" ? "#fbeaf9" : "#ffffff", x: 0, y: 0, scale: 1 },
        hotspots: [],
        annotations: []
      }, kind === "cover" ? 0 : 1);
    }

    function currentSlide() {
      return state.tutorial.slides[state.ui.slideIndex];
    }

    function activeHotspot() {
      return currentSlide()?.hotspots.find((item) => item.id === state.ui.activeHotspotId) || null;
    }

    function slideIntroCard(slide = currentSlide()) {
      return slide?.annotations.find((item) => item.type === "slide-intro") || null;
    }

    function isSlideIntroState(slide = currentSlide()) {
      return Boolean(slideIntroCard(slide)) && !slide.hotspots.some((item) => item.id === state.ui.activeHotspotId);
    }

    function selectedObject() {
      const slide = currentSlide();
      if (!slide || !state.ui.selectedId) return null;
      return state.ui.selectedKind === "hotspot"
        ? slide.hotspots.find((item) => item.id === state.ui.selectedId)
        : slide.annotations.find((item) => item.id === state.ui.selectedId);
    }

    function selectionKey(kind, id) {
      return kind && id ? `${kind}:${id}` : "";
    }

    function selectionEntry(key) {
      if (typeof key !== "string") return null;
      const separator = key.indexOf(":");
      if (separator < 1) return null;
      const kind = key.slice(0, separator);
      const id = key.slice(separator + 1);
      const slide = currentSlide();
      if (!slide || !["hotspot", "annotation"].includes(kind)) return null;
      const item = kind === "hotspot"
        ? slide.hotspots.find((entry) => entry.id === id)
        : slide.annotations.find((entry) => entry.id === id);
      return item ? { key, kind, id, item } : null;
    }

    function syncObjectSelection() {
      if (MODE !== "builder") {
        multiSelection = [];
        return;
      }
      multiSelection = [...new Set(multiSelection)].filter((key) => selectionEntry(key));
      const primaryKey = selectionKey(state.ui.selectedKind, state.ui.selectedId);
      const primary = selectionEntry(primaryKey);
      if (!primary) {
        const fallback = selectionEntry(multiSelection[multiSelection.length - 1]);
        state.ui.selectedKind = fallback?.kind || null;
        state.ui.selectedId = fallback?.id || null;
        if (!fallback) multiSelection = [];
        return;
      }
      if (!multiSelection.includes(primaryKey)) multiSelection = [primaryKey];
    }

    function selectedObjects() {
      syncObjectSelection();
      return multiSelection.map((key) => selectionEntry(key)).filter(Boolean);
    }

    function hotspotGroupingSelection(selection = selectedObjects()) {
      const hotspots = selection.filter(({ kind }) => kind === "hotspot");
      const annotations = selection.filter(({ kind, item }) => kind === "annotation" && item.type !== "slide-intro");
      return {
        hotspot: hotspots.length === 1 ? hotspots[0].item : null,
        annotations,
        valid: hotspots.length === 1
          && annotations.length > 0
          && hotspots.length + annotations.length === selection.length
      };
    }

    function arrangementEntries(selection = selectedObjects()) {
      const unlockedSelection = selection.filter(({ item }) => !item.locked);
      if (unlockedSelection.length !== 1 || unlockedSelection[0].kind !== "hotspot") {
        return { entries: unlockedSelection, usesAllHotspots: false };
      }
      const hotspots = currentSlide().hotspots
        .filter((item) => !item.locked)
        .map((item) => selectionEntry(selectionKey("hotspot", item.id)))
        .filter(Boolean);
      return hotspots.length > 1
        ? { entries: hotspots, usesAllHotspots: true }
        : { entries: unlockedSelection, usesAllHotspots: false };
    }

    function isObjectSelected(kind, id) {
      return MODE === "builder" && multiSelection.includes(selectionKey(kind, id));
    }

    function mediaBase() {
      const folder = slugify(state.meta.mediaFolder || state.meta.tutorialSlug || "");
      return folder ? `${MEDIA_ROOT}${folder}/` : MEDIA_ROOT;
    }

    function syncMediaUrlSeeds(previousBase) {
      const nextBase = mediaBase();
      if (nextBase === previousBase) return;
      [
        root.querySelector("#mainMediaUrl"),
        ...root.querySelectorAll('.annotation-row input:not(#annotation-link-url)')
      ].filter(Boolean).forEach((input) => {
        if (!input.value || input.value === previousBase) input.value = nextBase;
      });
    }

    function updateMediaDropZone() {
      const zone = root.querySelector("[data-media-drop-zone]");
      if (!zone) return;
      zone.dataset.state = mediaDropState;
      const status = zone.querySelector("[data-media-drop-status]");
      if (status) status.textContent = mediaDropStatusText();
      const connectButton = zone.querySelector('[data-action="connect-media-directory"]');
      const existingButton = zone.querySelector('[data-action="select-existing-media-file"]');
      const copyButton = zone.querySelector('[data-action="copy-new-media-file"]');
      if (connectButton) connectButton.textContent = mediaSiteDirectoryHandle ? "Change Media Website Folder" : "Connect Media Website Folder";
      if (existingButton) existingButton.disabled = false;
      if (copyButton) copyButton.disabled = false;
    }

    function formatMediaFileSize(bytes) {
      const size = Number(bytes) || 0;
      if (size < 1024) return `${size} B`;
      if (size < 1024 ** 2) return `${(size / 1024).toFixed(1)} KB`;
      if (size < 1024 ** 3) return `${(size / 1024 ** 2).toFixed(1)} MB`;
      return `${(size / 1024 ** 3).toFixed(2)} GB`;
    }

    function mediaTypeForFile(file) {
      const mime = String(file?.type || "").toLowerCase();
      if (mime === "image/gif") return "gif";
      if (mime.startsWith("image/")) return "image";
      if (mime.startsWith("video/")) return "video";
      if (mime.startsWith("audio/")) return "audio";
      return Object.entries(MEDIA_TYPES).find(([, pattern]) => pattern.test(file?.name || ""))?.[0] || "";
    }

    function webSafeMediaFilename(filename) {
      const original = String(filename || "media").trim();
      const dot = original.lastIndexOf(".");
      const extension = dot > 0 ? original.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g, "") : "";
      const stem = slugify(dot > 0 ? original.slice(0, dot) : original) || "media";
      return `${stem}${extension}`;
    }

    async function availableMediaFilename(directory, preferredName) {
      const dot = preferredName.lastIndexOf(".");
      const stem = dot > 0 ? preferredName.slice(0, dot) : preferredName;
      const extension = dot > 0 ? preferredName.slice(dot) : "";
      for (let index = 1; index < 1000; index += 1) {
        const candidate = index === 1 ? preferredName : `${stem}-${index}${extension}`;
        try {
          await directory.getFileHandle(candidate);
        } catch (error) {
          if (error?.name === "NotFoundError") return candidate;
          throw error;
        }
      }
      throw new Error("Could not create a unique media filename.");
    }

    function openMediaHandleDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(MEDIA_HANDLE_DB, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(MEDIA_HANDLE_STORE)) {
            request.result.createObjectStore(MEDIA_HANDLE_STORE);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Could not open saved folder access."));
      });
    }

    async function rememberMediaSiteDirectory(handle) {
      const database = await openMediaHandleDatabase();
      try {
        await new Promise((resolve, reject) => {
          const transaction = database.transaction(MEDIA_HANDLE_STORE, "readwrite");
          transaction.objectStore(MEDIA_HANDLE_STORE).put(handle, MEDIA_HANDLE_KEY);
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error || new Error("Could not remember the media website folder."));
          transaction.onabort = () => reject(transaction.error || new Error("Could not remember the media website folder."));
        });
      } finally {
        database.close();
      }
    }

    async function savedMediaSiteDirectory() {
      const database = await openMediaHandleDatabase();
      try {
        return await new Promise((resolve, reject) => {
          const request = database.transaction(MEDIA_HANDLE_STORE, "readonly")
            .objectStore(MEDIA_HANDLE_STORE).get(MEDIA_HANDLE_KEY);
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error || new Error("Could not restore the media website folder."));
        });
      } finally {
        database.close();
      }
    }

    async function restoreMediaSiteDirectory() {
      if (!("indexedDB" in window)) return;
      try {
        const handle = await savedMediaSiteDirectory();
        if (!handle || handle.kind !== "directory" || handle.name !== "mh_media") return;
        mediaSiteDirectoryHandle = handle;
        const permission = handle.queryPermission
          ? await handle.queryPermission({ mode: "readwrite" })
          : "granted";
        mediaDropState = permission === "granted" ? "ready" : "remembered";
        mediaDropMessage = permission === "granted"
          ? "Media website connected. Select any existing file inside mh_media."
          : "Media website folder remembered. Select a file to restore access.";
        updateMediaDropZone();
      } catch (_) {
        // Remembering the folder is optional; manual connection remains available.
      }
    }

    async function ensureMediaDirectoryPermission() {
      if (!mediaSiteDirectoryHandle) return false;
      if (!mediaSiteDirectoryHandle.queryPermission) return true;
      if (await mediaSiteDirectoryHandle.queryPermission({ mode: "readwrite" }) === "granted") return true;
      return await mediaSiteDirectoryHandle.requestPermission({ mode: "readwrite" }) === "granted";
    }

    async function connectMediaDirectory() {
      if (!("showDirectoryPicker" in window)) {
        mediaDropState = "error";
        mediaDropMessage = "Folder connection needs Chrome or Edge. The URL field still works normally.";
        updateMediaDropZone();
        showToast(mediaDropMessage);
        return false;
      }
      try {
        const handle = await window.showDirectoryPicker({ id: "magic-hashtags-media-site", mode: "readwrite" });
        if (handle.name !== "mh_media") {
          mediaDropState = "error";
          mediaDropMessage = 'Choose the main "mh_media" folder. Then you can select a file from any folder inside it.';
          updateMediaDropZone();
          showToast(mediaDropMessage);
          return false;
        }
        mediaSiteDirectoryHandle = handle;
        rememberMediaSiteDirectory(handle).catch(() => {});
        mediaDropState = "ready";
        mediaDropMessage = "Media website connected. Select any existing file inside mh_media.";
        updateMediaDropZone();
        showToast("Media website connected. Existing files will be linked without copying them.");
        return true;
      } catch (error) {
        if (error?.name === "AbortError") return false;
        mediaDropState = "error";
        mediaDropMessage = `Could not connect the media website folder: ${error?.message || "folder access failed"}`;
        updateMediaDropZone();
        showToast(mediaDropMessage);
        return false;
      }
    }

    function publicMediaUrl(pathParts) {
      return `${MEDIA_SITE_ORIGIN}/${pathParts.map((part) => encodeURIComponent(part)).join("/")}`;
    }

    function linkMediaToSlide(slideId, file, pathParts, message, stateName = "linked") {
      const mediaType = mediaTypeForFile(file);
      if (!mediaType) throw new Error("Use an image, GIF, audio file, MP4, WebM, MOV, or M4V file.");
      const targetSlide = state.tutorial.slides.find((slide) => slide.id === slideId);
      if (!targetSlide) throw new Error("the destination slide is no longer available");
      targetSlide.media.url = publicMediaUrl(pathParts);
      targetSlide.media.type = mediaType;
      targetSlide.media.fit = ["image", "gif"].includes(mediaType) ? "match" : "contain";
      targetSlide.media.x = 0;
      targetSlide.media.y = 0;
      targetSlide.media.scale = 1;
      targetSlide.media.naturalWidth = 0;
      targetSlide.media.naturalHeight = 0;
      if (targetSlide.kind !== "cover") {
        targetSlide.kind = mediaType === "video" ? "video" : targetSlide.kind === "video" ? "image" : targetSlide.kind;
      }
      mediaDropState = stateName;
      mediaDropMessage = message;
      commit(message);
    }

    async function selectExistingMediaFile() {
      if (!mediaSiteDirectoryHandle) {
        if (await connectMediaDirectory()) {
          mediaDropMessage = "mh_media is connected. Click Choose Image or Video again to select the file.";
          updateMediaDropZone();
          showToast(mediaDropMessage);
        }
        return;
      }
      if (!("showOpenFilePicker" in window)) {
        showToast("File selection needs Chrome or Edge. You can still paste a media URL.");
        return;
      }
      const targetSlideId = currentSlide().id;
      try {
        if (!await ensureMediaDirectoryPermission()) throw new Error("folder access was not granted");
        const [fileHandle] = await window.showOpenFilePicker({
          id: "magic-hashtags-existing-media",
          startIn: mediaSiteDirectoryHandle,
          multiple: false,
          types: [{
            description: "Images, video, GIF, and audio",
            accept: {
              "image/*": [".png", ".jpg", ".jpeg", ".webp", ".gif", ".svg", ".avif"],
              "video/*": [".mp4", ".webm", ".mov", ".m4v"],
              "audio/*": [".mp3", ".m4a", ".wav", ".ogg", ".aac"]
            }
          }]
        });
        if (!fileHandle || fileHandle.kind !== "file") throw new Error("Choose one media file.");
        const pathParts = await mediaSiteDirectoryHandle.resolve(fileHandle);
        if (!pathParts?.length) {
          throw new Error("That file is not inside the connected mh_media folder. Use Copy New File only if it is not on the media website yet.");
        }
        const file = await fileHandle.getFile();
        linkMediaToSlide(targetSlideId, file, pathParts, `Linked existing website file: ${pathParts.join("/")}`);
        showToast(`${file.name} linked and loaded. No file was copied or renamed.`);
      } catch (error) {
        if (error?.name === "AbortError") return;
        mediaDropState = "error";
        mediaDropMessage = `Could not link that file: ${error?.message || "file access failed"}`;
        updateMediaDropZone();
        showToast(mediaDropMessage);
      }
    }

    async function chooseNewMediaFile() {
      if (!mediaSiteDirectoryHandle) {
        if (await connectMediaDirectory()) {
          mediaDropMessage = "mh_media is connected. Click Copy a New File again to select the file.";
          updateMediaDropZone();
          showToast(mediaDropMessage);
        }
        return;
      }
      if (!("showOpenFilePicker" in window)) {
        showToast("File selection needs Chrome or Edge.");
        return;
      }
      try {
        const [fileHandle] = await window.showOpenFilePicker({ id: "magic-hashtags-new-media", multiple: false });
        await copyNewMediaFile(await fileHandle.getFile());
      } catch (error) {
        if (error?.name === "AbortError") return;
        mediaDropState = "error";
        mediaDropMessage = `Could not add that new file: ${error?.message || "file access failed"}`;
        updateMediaDropZone();
        showToast(mediaDropMessage);
      }
    }

    async function copyNewMediaFile(file) {
      if (!file) return;
      const mediaType = mediaTypeForFile(file);
      if (!mediaType) {
        mediaDropState = "error";
        mediaDropMessage = "Use an image, GIF, audio file, MP4, WebM, MOV, or M4V file.";
        updateMediaDropZone();
        showToast(mediaDropMessage);
        return;
      }
      const folder = mediaFolderSlug();
      if (!folder) {
        mediaDropState = "error";
        mediaDropMessage = "Add a short tutorial folder name before copying the new file.";
        updateMediaDropZone();
        root.querySelector("#mediaDropFolder")?.focus();
        showToast(mediaDropMessage);
        return;
      }
      if (!mediaSiteDirectoryHandle) {
        mediaDropState = "error";
        mediaDropMessage = "Connect the main mh_media folder first.";
        updateMediaDropZone();
        showToast(mediaDropMessage);
        return;
      }
      const targetSlideId = currentSlide().id;
      try {
        if (!await ensureMediaDirectoryPermission()) throw new Error("write permission was not granted");
        mediaDropState = "copying";
        mediaDropMessage = `Copying ${file.name} (${formatMediaFileSize(file.size)})…`;
        updateMediaDropZone();
        const tutorialsDirectory = await mediaSiteDirectoryHandle.getDirectoryHandle("tutorials", { create: true });
        const tutorialDirectory = await tutorialsDirectory.getDirectoryHandle(folder, { create: true });
        const filename = await availableMediaFilename(tutorialDirectory, webSafeMediaFilename(file.name));
        const fileHandle = await tutorialDirectory.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(file);
        await writable.close();
        linkMediaToSlide(
          targetSlideId,
          file,
          ["tutorials", folder, filename],
          `Copied and linked tutorials/${folder}/${filename}. Publish the media website when you are ready.`,
          "copied"
        );
        showToast(`${filename} copied and linked. Publish the media website when ready.`);
      } catch (error) {
        mediaDropState = "error";
        mediaDropMessage = `Media copy failed: ${error?.message || "unknown error"}`;
        updateMediaDropZone();
        showToast(mediaDropMessage);
      }
    }

	    function computedPublicUrl(meta = state.meta) {
	      const sectionSlug = slugify(meta.section);
	      const section = PUBLIC_SECTION_FOLDERS[sectionSlug] || sectionSlug;
      const tutorial = slugify(meta.tutorialSlug);
      if (section && tutorial) return `${CANONICAL_SITE}/learn/${section}/${tutorial}/`;
      if (section) return `${CANONICAL_SITE}/learn/${section}/`;
      return `${CANONICAL_SITE}/learn/`;
    }

    function publicUrl(meta = state.meta) {
      if (meta.touched?.publicUrl && String(meta.publicUrl || "").trim()) {
        return String(meta.publicUrl).trim();
      }
      return computedPublicUrl(meta);
    }

    function applySmartDefaults() {
      const touched = state.meta.touched;
      const title = state.tutorial.title === "TUTORIAL TITLE" ? "" : state.tutorial.title.trim();
      const cover = state.tutorial.slides[0];
      const slug = slugify(title);
      const set = (key, value) => {
        if (!touched[key]) state.meta[key] = value;
      };
      set("tutorialSlug", slug);
      set("mediaFolder", slug);
      set("cardTitle", title);
      set("summary", cover?.description || "");
      set("modalDescription", cover?.description || "");
      set("socialTitle", title);
      set("socialDescription", cover?.description || "");
      set("socialImage", cover?.media?.url || "");
	      set("socialImageAlt", title ? `${title} tutorial preview` : "");
	      set("primaryActionLabel", state.meta.pageType === "demo" ? "Open Tutorial" : "Open Tool");
      set("publicUrl", computedPublicUrl());
    }

    function markTouched(key) {
      state.meta.touched[key] = true;
    }

    function scheduleSave() {
      if (MODE !== "builder") return;
      clearTimeout(saveTimer);
      draftSavePhase = "saving";
      updateDraftSaveStatus();
      saveTimer = setTimeout(saveStateNow, 180);
    }

    function saveStateNow() {
      if (MODE !== "builder") return false;
      clearTimeout(saveTimer);
      state.meta.updatedAt = Date.now();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        draftStorageError = "";
        draftSavePhase = "saved";
        lastDraftSavedAt = state.meta.updatedAt;
        updateDraftSaveStatus();
        return true;
      } catch (error) {
        draftStorageError = `Browser autosave failed: ${error?.message || "storage access failed"}`;
        draftSavePhase = "error";
        updateDraftSaveStatus();
        return false;
      }
    }

    function draftSaveStatusText() {
      if (draftSavePhase === "error") return "Autosave failed — use Save Editable Copy";
      if (draftSavePhase === "saving") return "Saving browser draft…";
      if (lastDraftSavedAt) {
        return `Browser draft saved ${new Date(lastDraftSavedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}`;
      }
      return "Browser draft ready";
    }

    function updateDraftSaveStatus() {
      const status = root?.querySelector("[data-draft-save-status]");
      if (!status) return;
      status.dataset.state = draftSavePhase;
      status.textContent = draftSaveStatusText();
      status.title = draftStorageError || `Autosaves this draft in the current browser for ${DRAFT_FILENAME}`;
    }

    function editableCopyFilename() {
      const stem = DRAFT_FILENAME.replace(/\.html?$/i, "");
      const fallbackStem = slugify(state.meta.tutorialSlug || state.tutorial.title) || stem || "tutorial";
      return `${fallbackStem}-editable-builder.html`;
    }

    function historySnapshot() {
      const meta = clone(state.meta);
      delete meta.updatedAt;
      return JSON.stringify({ meta, tutorial: state.tutorial });
    }

    function recordUndoStep() {
      const nextSnapshot = historySnapshot();
      if (!committedSnapshot || nextSnapshot === committedSnapshot) return;
      undoStack.push(committedSnapshot);
      if (undoStack.length > 50) undoStack.shift();
      committedSnapshot = nextSnapshot;
    }

    function undoLastChange() {
      recordUndoStep();
      const previousSnapshot = undoStack.pop();
      if (!previousSnapshot) {
        showToast("Nothing to undo.");
        return;
      }
      const previous = readJson(previousSnapshot, null);
      if (!previous) return;
      state.meta = previous.meta;
      state.tutorial = previous.tutorial;
      normalizeState();
      const slide = currentSlide();
      if (!isSlideIntroState(slide) && !slide.hotspots.some((item) => item.id === state.ui.activeHotspotId)) {
        state.ui.activeHotspotId = slide.hotspots[0]?.id || null;
      }
      const selectedStillExists = state.ui.selectedKind === "hotspot"
        ? slide.hotspots.some((item) => item.id === state.ui.selectedId)
        : state.ui.selectedKind === "annotation"
          ? slide.annotations.some((item) => item.id === state.ui.selectedId)
          : false;
      if (!selectedStillExists) {
        state.ui.selectedKind = null;
        state.ui.selectedId = null;
      }
      state.ui.contentsOpen = false;
      state.ui.videoModalId = null;
      committedSnapshot = historySnapshot();
      scheduleSave();
      render();
      showToast("Undid last change.");
    }

    function commit(message, shouldRender = true) {
      applySmartDefaults();
      recordUndoStep();
      scheduleSave();
      if (message) showToast(message);
      if (shouldRender) render();
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      document.querySelector(".toast")?.remove();
      const node = document.createElement("div");
      node.className = "toast";
      node.setAttribute("role", "status");
      node.textContent = message;
      document.body.append(node);
      toastTimer = setTimeout(() => node.remove(), 2600);
    }

    function icon(name) {

    function toolbarIcon(filename) {
      const encodedFilename = encodeURIComponent(String(filename || ""));
      const localSrc = `../images/tutorial-annotations/builder-toolbar/${encodedFilename}`;

      return `<img class="toolbar-icon-image" src="${escapeHtml(localSrc)}" data-toolbar-fallback="${escapeHtml(hostedSrc)}" alt="" aria-hidden="true" onerror="this.onerror=null;this.src=this.dataset.toolbarFallback">`;
    }

    function isPipeBodyLine(line) {
      return /^\s*\|(?:\s|$)/.test(line);
    }

    function isNumberedBodyLine(line) {
      return /^\s*\d+[.)](?:\s|$)/.test(line);
    }

    function normalizeMixedBodyValue(value, legacyListStyle = "") {
      const normalized = String(value || "").replace(/\r/g, "");
      if (legacyListStyle !== "pipe") return normalized;
      return normalized
        .split("\n")
        .map((line) => line.trim() && !isPipeBodyLine(line) ? `| ${line}` : line)
        .join("\n");
    }

    function mixedBodyLines(value) {
      return String(value || "")
        .replace(/\r/g, "")
        .split("\n")
        .map((line) => {
          const kind = isPipeBodyLine(line) ? "pipe" : isNumberedBodyLine(line) ? "numbered" : "plain";
          const text = kind === "pipe"
            ? line.replace(/^\s*\|\s?/, "")
            : kind === "numbered"
              ? line.replace(/^\s*\d+[.)]\s?/, "")
              : line;
          return { kind, pipe: kind === "pipe", numbered: kind === "numbered", text };
        });
    }

    function bodyHasPipeLines(value) {
      return mixedBodyLines(value).some((line) => line.pipe);
    }

    function bodyHasNumberedLines(value) {
      return mixedBodyLines(value).some((line) => line.numbered);
    }

    function renderMixedBodyContent(value) {
      const blocks = [];
      let paragraphs = [];
      let bullets = [];
      let numbered = [];
      const flushParagraph = () => {
        if (!paragraphs.length) return;
        blocks.push(`<p>${paragraphs.map((line) => escapeHtml(line)).join("<br>")}</p>`);
        paragraphs = [];
      };
      const flushBullets = () => {
        if (!bullets.length) return;
        blocks.push(`<ul class="pipe-list">${bullets.map((line) => `<li>${escapeHtml(line)}</li>`).join("")}</ul>`);
        bullets = [];
      };
      const flushNumbered = () => {
        if (!numbered.length) return;
        blocks.push(`<ol class="numbered-list">${numbered.map((line) => `<li>${escapeHtml(line)}</li>`).join("")}</ol>`);
        numbered = [];
      };

      mixedBodyLines(value).forEach((line) => {
        if (line.pipe) {
          flushParagraph();
          flushNumbered();
          bullets.push(line.text);
          return;
        }
        if (line.numbered) {
          flushParagraph();
          flushBullets();
          numbered.push(line.text);
          return;
        }
        flushBullets();
        flushNumbered();
        if (line.text) {
          paragraphs.push(line.text);
        } else {
          flushParagraph();
        }
      });
      flushParagraph();
      flushBullets();
      flushNumbered();
      return blocks.join("");
    }

    function renderBodyFormatBar(pipeAction, numberedAction, id, pipeActive, numberedActive) {
      if (MODE !== "builder") return "";
      return `
        <div class="body-format-bar">
          <button class="body-list-toggle pipe-list-toggle ${pipeActive ? "is-active" : ""}" type="button"
            data-list-kind="pipe" data-action="${pipeAction}" data-id="${id}" aria-pressed="${pipeActive}"

          <button class="body-list-toggle numbered-list-toggle ${numberedActive ? "is-active" : ""}" type="button"
            data-list-kind="numbered" data-action="${numberedAction}" data-id="${id}" aria-pressed="${numberedActive}"
            title="Toggle a numbered list for the current or selected lines">
            <span class="pipe-list-toggle__mark" aria-hidden="true">1.</span>Numbered
          </button>
        </div>
      `;
    }

    function renderBody(value, options) {
      const { className, binding, label, placeholder } = options;
      if (MODE === "builder") {
        const lines = mixedBodyLines(value);
        const content = lines.map((line, index) => {
          const placeholderAttribute = lines.length === 1 && !line.text
            ? ` data-placeholder="${escapeHtml(placeholder)}"`
            : "";
          const listClass = line.kind === "pipe" ? "is-pipe" : line.kind === "numbered" ? "is-numbered" : "";
          return `<div class="mixed-body-line ${listClass}" data-list-kind="${line.kind}" data-pipe="${line.pipe}"${placeholderAttribute}>${escapeHtml(line.text)}</div>`;
        }).join("");
        return `<div class="${className} mixed-body-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="${escapeHtml(label)}" data-bind="${binding}">${content}</div>`;
      }
      return `<div class="${className} mixed-body">${renderMixedBodyContent(value)}</div>`;
    }

    function isFocusImageSlide(slide = currentSlide()) {

    function focusPopupClasses(slide) {
      const hotspot = slide.hotspots.find((item) => item.id === state.ui.activeHotspotId);
      if (!hotspot) return "is-focus-popup is-empty";
      const sizeClass = Number.isFinite(hotspot.popupW) && Number.isFinite(hotspot.popupH) ? " is-custom-size" : "";
      if (Number.isFinite(hotspot.popupX) && Number.isFinite(hotspot.popupY)) {
        return `is-focus-popup is-custom-position${sizeClass}`;
      }
      const horizontal = hotspot.x <= 50 ? "focus-popup-right" : "focus-popup-left";
      const vertical = hotspot.y <= 50 ? "focus-popup-bottom" : "focus-popup-top";
      return `is-focus-popup ${horizontal} ${vertical}${sizeClass}`;
    }

    function focusPopupStyle(slide) {
      const hotspot = slide.hotspots.find((item) => item.id === state.ui.activeHotspotId);
      if (!hotspot) return "";
      const longestLine = Math.max(
        String(hotspot.title || "").length,
        ...String(hotspot.body || "").replace(/\r/g, "").split("\n").map((line) => line.replace(/^\s*(?:\||\d+[.)])\s?/, "").length)
      );
      const popupWidth = Number.isFinite(hotspot.popupW)
        ? `${hotspot.popupW}%`
        : `${clamp(Math.round(205 + longestLine * 5.2), 245, 440)}px`;
      const popupHeight = Number.isFinite(hotspot.popupH) ? `;--popup-height:${hotspot.popupH}%` : "";
      const position = Number.isFinite(hotspot.popupX) && Number.isFinite(hotspot.popupY)
        ? `;--popup-x:${hotspot.popupX}%;--popup-y:${hotspot.popupY}%`
        : "";
      return ` style="--popup-width:${popupWidth}${popupHeight}${position}"`;

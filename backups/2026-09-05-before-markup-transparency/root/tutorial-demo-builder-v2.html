          return `<div class="mixed-body-line ${listClass}" data-list-kind="${line.kind}" data-pipe="${line.pipe}"${placeholderAttribute}>${escapeHtml(line.text)}</div>`;
        }).join("");
        return `<div class="${className} mixed-body-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="${escapeHtml(label)}" data-bind="${binding}">${content}</div>`;

      return `<div class="${className} mixed-body">${renderMixedBodyContent(value)}</div>`;

      const magnifierSceneWidth = 10000 / width;

      const magnifierSceneLeft = -((Number(item.x) || 0) - width / 2) * 100 / width;
      const magnifierSceneTop = -((Number(item.y) || 0) - height / 2) * 100 / height;
      return `--x:${item.x}%;--y:${item.y}%;--w:${item.w}%;--h:${item.h}%;--z:${item.z};--opacity:${item.opacity};--rotation:${item.rotation || 0}deg;--flip-x:${item.flipX ? -1 : 1};--markup-width:${item.strokeWidth || 5};--markup-color:${item.markupColor || "#000000"};--cover-color:${item.fillColor || "#ffffff"};--blur-strength:${item.blurStrength || 12}px;--text-font-size:${item.textFontSize || 16}px;--text-letter-spacing:${item.textLetterSpacing || 0}px;--text-line-height:${item.textLineHeight || 1.2};--text-align:${item.textAlign || "center"};--crop-x:${item.cropX ?? 50}%;--crop-y:${item.cropY ?? 50}%;--crop-scale:${item.cropScale || 1};--corner-radius:${item.cornerRadius || 0}%;--magnifier-scale:${item.magnification || 2};--magnifier-radius:${magnifierRadius}%;--clip-frame-radius:${clipFrameRadius}%;--magnifier-scene-width:${magnifierSceneWidth}%;--magnifier-scene-height:${magnifierSceneHeight}%;--magnifier-scene-left:${magnifierSceneLeft}%;--magnifier-scene-top:${magnifierSceneTop}%;--magnifier-origin-x:${item.x}%;--magnifier-origin-y:${item.y}%`;

        ...String(hotspot.body || "").replace(/\r/g, "").split("\n").map((line) => line.replace(/^\s*(?:\||\d+[.)])\s?/, "").length)

      const popupWidth = Number.isFinite(hotspot.popupW)
        ? `${hotspot.popupW}%`

      const popupHeight = Number.isFinite(hotspot.popupH) ? `;--popup-height:${hotspot.popupH}%` : "";

        ? `;--popup-x:${hotspot.popupX}%;--popup-y:${hotspot.popupY}%`

    function scheduleDemoStageSize() {

          const stage = stageWrap.querySelector(":scope > .stage");
          if (!stage) return;
          const availableWidth = stageWrap.clientWidth;
          const availableHeight = stageWrap.clientHeight;
          if (!(availableWidth > 0) || !(availableHeight > 0)) return;
          const width = Math.min(availableWidth, availableHeight * SCENE_ASPECT);
          stage.style.width = `${width}px`;
          stage.style.height = "auto";
        });

    function fitRenderedTextCardsToContent({ forceIds = null } = {}) {
      let changed = false;
      root.querySelectorAll("[data-stage]").forEach((stage) => {
        const stageHeight = stage.clientHeight;
        if (!(stageHeight > 0)) return;
        stage.querySelectorAll(":scope > .annotation-text, :scope > .annotation-slide-intro, :scope > .annotation-callout").forEach((object) => {
          const annotation = currentSlide().annotations.find((item) => item.id === object.dataset.id);
          if (!annotation || !["text", "slide-intro", "callout"].includes(annotation.type)) return;
          const frame = object.querySelector(":scope > .object-frame");
          if (!frame) return;
          const shouldFit = Boolean(forceIds?.has(annotation.id));
          if (shouldFit) {
            object.classList.add("is-measuring-text-height");
            const naturalHeight = frame.getBoundingClientRect().height;
            object.classList.remove("is-measuring-text-height");
            const previousHeight = Number(annotation.h) || 1;
            const desiredHeight = clamp((naturalHeight + 2) * 100 / stageHeight, 4, 90);
            if (Math.abs(desiredHeight - previousHeight) > .05) {
              const previousTop = (Number(annotation.y) || 0) - previousHeight / 2;
              annotation.h = desiredHeight;
              annotation.y = previousTop + annotation.h / 2;
              fitStageObjectBounds(annotation);
              object.style.cssText = objectStyle(annotation);
              changed = true;
            }
          }
        });
      });
      if (changed && MODE === "builder") scheduleSave();
      return changed;
    }

            ${button("3-8-add-image-slide.png", 'data-action="add-image-slide" title="Add image slide and choose image" aria-label="Add image slide and choose image"')}
            ${button("3-9-video-slide.png", 'data-action="add-video-slide" title="Add video slide and choose video" aria-label="Add video slide and choose video"')}
            <button class="numbered-toolbar-export-button" type="button" data-action="replace-slide-image" title="Replace this slide's main image or video with an image or GIF without deleting the slide">Replace Image</button>
            <button class="numbered-toolbar-export-button" type="button" data-action="replace-slide-video" title="Replace this slide's main image or video with a video without deleting the slide">Replace Video</button>
            <label class="numbered-toolbar-duration" title="Manual slide duration override; blank uses audio length or 5 seconds"><input id="demoManualDuration" type="number" min="1" max="300" step="0.5" value="${slide.demo.manualDuration ?? ""}" aria-label="Manual slide duration override in seconds" placeholder="5"></label>
            ${button("3-12-zoom-in-main-media.png", 'data-action="media-zoom-in" title="Zoom main media in" aria-label="Zoom main media in"')}
            ${button("3-13-zoom-out-main-media.png", 'data-action="media-zoom-out" title="Zoom main media out" aria-label="Zoom main media out"')}
            ${button("3-14-move-left-main-media.png", 'data-action="media-left" title="Move main media left" aria-label="Move main media left"')}
            ${button("3-15-move-right-main-media.png", 'data-action="media-right" title="Move main media right" aria-label="Move main media right"')}
            ${button("3-16-move-up-main-media.png", 'data-action="media-up" title="Move main media up" aria-label="Move main media up"')}
            ${button("3-17-move-down-main-media.png", 'data-action="media-down" title="Move main media down" aria-label="Move main media down"')}
            ${button("3-20-gif-in-same-tab.png", 'data-action="select-annotation-media" data-type="gif" title="Add uploaded GIF annotation" aria-label="Add uploaded GIF annotation"')}
            ${button("3-21-add-image.png", 'data-action="select-annotation-media" data-type="image" title="Add uploaded image annotation" aria-label="Add uploaded image annotation"')}
            <button class="numbered-toolbar-export-button ${insertedImageCropEditing ? "is-active" : ""}" type="button" data-action="toggle-inserted-image-crop" title="${insertedImageCropEditing ? "Finish cropping the selected inserted image" : "Crop the selected inserted image"}" aria-pressed="${Boolean(insertedImageCropEditing)}" ${selectedInsertedImage ? "" : "disabled"}>${insertedImageCropEditing ? "Done Crop" : "Crop Image"}</button>
            <label class="numbered-toolbar-corners" title="Curve the selected inserted image corners"><select id="insertedImageCornerPreset" aria-label="Selected inserted image corner style" ${selectedInsertedImage ? "" : "disabled"}><option value="0" ${insertedImageCornerRadius === 0 ? "selected" : ""}>Square</option><option value="3" ${insertedImageCornerRadius === 3 ? "selected" : ""}>Soft</option><option value="10" ${insertedImageCornerRadius === 10 ? "selected" : ""}>Rounded</option><option value="50" ${insertedImageCornerRadius === 50 ? "selected" : ""}>Circle</option></select></label>
            <button class="numbered-toolbar-export-button" type="button" data-action="reset-inserted-image" title="Remove cropping and curved corners from the selected inserted image" ${selectedInsertedImage ? "" : "disabled"}>Reset Image</button>
            ${button("3-22-add-link-opens-new-tab.png", 'data-action="activate-annotation-url" data-type="link" title="Place the link annotation using the URL in the box" aria-label="Place link annotation"')}
            <label class="numbered-toolbar-input" title="Paste a URL, then click the link button"><input id="annotation-link-input" value="${escapeHtml(toolbarAnnotationDraft.mode === "link" ? toolbarAnnotationDraft.value : "https://")}" aria-label="Link annotation URL" placeholder="PASTE URL, THEN CLICK LINK BUTTON"></label>
            <input class="numbered-toolbar-title-input" id="toolbarTutorialTitle" value="${escapeHtml(state.tutorial.title)}" aria-label="Tutorial title" placeholder="TUTORIAL TITLE">
          </div>
          <datalist id="magic-hashtags-color-palette">
            ${SITE_COLOR_PRESETS.map(([value, label]) => `<option value="${value}" label="${escapeHtml(label)}"></option>`).join("")}
          </datalist>
        </section>
      `;
    }

    function renderSidebar(slide) {
      const descriptionUsesPipes = bodyHasPipeLines(slide.description);
      const descriptionUsesNumbers = bodyHasNumberedLines(slide.description);
      const sidebarClasses = isDemoCenteredSlide(slide)
        ? `slide-sidebar ${demoPopupClasses(slide)}`
        : "slide-sidebar";
      const activeHotspot = slide.hotspots.find((item) => item.id === state.ui.activeHotspotId);
      return `
        <aside class="${sidebarClasses}" data-hotspot-align="${escapeHtml(activeHotspot?.textAlign || "left")}"${isDemoCenteredSlide(slide) ? demoPopupStyle(slide) : ""}>
          ${MODE === "builder" && isDemoCenteredSlide(slide) && activeHotspot ? `<div class="demo-popup-drag-handle" data-popup-drag-handle data-id="${activeHotspot.id}" title="Drag to position this hotspot text box">↕ Drag text box</div>` : ""}
          ${MODE === "builder" && isDemoCenteredSlide(slide) && activeHotspot ? renderPopupResizeHandles(activeHotspot) : ""}
          <div class="editable-box slide-sidebar__title" ${MODE === "builder" ? `contenteditable="true" role="textbox" aria-label="Slide title" data-bind="slide.title:${slide.id}"` : ""} data-placeholder="SLIDE TITLE">${escapeHtml(slide.title)}</div>
          <div class="body-field">
            ${renderBodyFormatBar("toggle-slide-pipe-list", "toggle-slide-numbered-list", slide.id, descriptionUsesPipes, descriptionUsesNumbers)}
            ${renderBody(slide.description, {
              className: "editable-box slide-sidebar__description",
              binding: `slide.description:${slide.id}`,
              label: "Slide body",
              placeholder: "Slide description.",
              listStyle: slide.descriptionListStyle
            })}
          </div>
          ${slide.hotspots.length || MODE === "builder" ? `
            <div class="sidebar-divider"></div>
            <div class="hotspot-list">
              ${slide.hotspots.map((hotspot, index) => renderHotspotRow(hotspot, index)).join("")}
              ${slide.hotspots.length || MODE !== "builder" ? "" : `<div class="sidebar-empty">${slide.kind === "cover" ? "Cover hotspots are optional. Add one from the toolbar when needed." : "Add a hotspot from the toolbar when this slide needs ordered details."}</div>`}
            </div>
          ` : ""}
        </aside>
      `;
    }

    function renderPopupResizeHandles(hotspot) {
      return ["nw", "n", "ne", "e", "se", "s", "sw", "w"]
        .map((handle) => `<span class="popup-resize-handle" data-popup-resize-handle data-handle="${handle}" data-id="${escapeHtml(hotspot.id)}" title="Resize hotspot text box" aria-hidden="true"></span>`)
        .join("");
    }

    function renderHotspotRow(hotspot, index) {
      const active = state.ui.activeHotspotId === hotspot.id;
      const titleId = `hotspotTitle-${hotspot.id}`;
      const detailId = `hotspotDetail-${hotspot.id}`;
      const style = hotspotStyle(index);
      return `
        <div class="hotspot-entry ${active ? "is-active" : ""}" data-id="${hotspot.id}">
          <div class="hotspot-row ${active ? "is-active" : ""}" style="--hotspot-color:${style.color}" data-action="activate-hotspot" data-id="${hotspot.id}" aria-expanded="${active}" aria-controls="${detailId}" ${MODE === "player" ? `role="button" tabindex="0" aria-label="Open ${escapeHtml(hotspot.title || `Hotspot ${index + 1}`)} details"` : ""}>
            <div class="hotspot-row__title" id="${titleId}" ${MODE === "builder" ? `contenteditable="true" role="textbox" aria-label="Hotspot ${index + 1} title" data-bind="hotspot.title:${hotspot.id}"` : ""}>${escapeHtml(hotspot.title || `HOTSPOT ${index + 1}`)}</div>
            ${MODE === "builder" ? `<button type="button" data-action="hotspot-row-up" data-id="${hotspot.id}" aria-label="Move ${escapeHtml(hotspot.title)} title and body up; keep hotspot ${index + 1} marker fixed" ${index > 0 ? "" : "disabled"}>${icon("up")}</button><button type="button" data-action="hotspot-row-down" data-id="${hotspot.id}" aria-label="Move ${escapeHtml(hotspot.title)} title and body down; keep hotspot ${index + 1} marker fixed" ${index < currentSlide().hotspots.length - 1 ? "" : "disabled"}>${icon("down")}</button>` : ""}
          </div>
          ${active ? renderHotspotDetail(hotspot) : ""}
        </div>
      `;
    }

    function renderHotspotDetail(hotspot) {
      const titleId = `hotspotTitle-${hotspot.id}`;
      const detailId = `hotspotDetail-${hotspot.id}`;
      const label = `${hotspot.title || "Hotspot"} details`;
      const detail = renderBody(hotspot.body, {
        className: "hotspot-detail",
        binding: `hotspot.body:${hotspot.id}`,
        label,
        placeholder: "Type hotspot details here.",
        listStyle: hotspot.bodyListStyle
      });
      if (MODE !== "builder") {
        return `<div class="hotspot-detail-panel" id="${detailId}" role="region" aria-labelledby="${titleId}" aria-live="polite" data-action="activate-hotspot" data-id="${hotspot.id}" tabindex="0">${detail}</div>`;
      }
      return `
        <div class="hotspot-detail-panel" id="${detailId}" aria-live="polite">
          ${renderBodyFormatBar("toggle-hotspot-pipe-list", "toggle-hotspot-numbered-list", hotspot.id, bodyHasPipeLines(hotspot.body), bodyHasNumberedLines(hotspot.body))}
          ${detail}
        </div>
      `;
    }

    function renderStage(slide) {
      return `
        <div class="stage-wrap">
          <div class="stage" data-stage data-scene-coordinate-system="${SCENE_COORDINATE_SYSTEM}" data-media-fit="${escapeHtml(slide.media.fit)}" style="--stage-matte:${escapeHtml(slide.media.matte)};--media-aspect:${SCENE_WIDTH} / ${SCENE_HEIGHT}">
            ${renderMainMedia(slide)}
            ${topLevelAnnotations(slide).slice().sort((a,b) => a.z - b.z).filter(isVisibleForActiveHotspot).map(renderAnnotation).join("")}
            ${slide.hotspots.map((hotspot, index) => isHotspotVisibleForActiveState(hotspot, slide) ? renderHotspot(hotspot, index) : "").join("")}
            ${renderSlideNarrationControl(slide)}
          </div>
        </div>
      `;
    }

    function renderSlideNarrationControl(slide) {
      if (MODE !== "builder") return "";
      const audioUrl = String(slide.demo?.audioUrl || "").trim();
      const hasAudio = Boolean(audioUrl);
      const isOpen = slideNarrationPanelSlideId === slide.id;
      const isPlaying = slideNarrationPreviewPlaying && slideNarrationPreviewSlideId === slide.id;
      const filename = mediaDisplayFilename(audioUrl);
      return `
        <div class="slide-narration-control" data-builder-only>
          <button type="button" class="slide-narration-badge ${hasAudio ? "has-audio" : ""}" data-action="toggle-slide-audio-panel" aria-label="${hasAudio ? "Open slide narration controls" : "Add slide narration audio"}" aria-expanded="${isOpen}" title="${hasAudio ? `Narration attached: ${escapeHtml(filename)}` : "No slide narration attached"}">
            ${icon("audio")}
            ${hasAudio ? '<span class="slide-narration-badge-dot" aria-hidden="true"></span>' : ""}
          </button>
          ${isOpen ? `
            <div class="slide-narration-popover" role="dialog" aria-label="Slide narration controls">
              <strong>Slide narration</strong>
              ${hasAudio
                ? `<span class="slide-narration-filename" title="${escapeHtml(filename)}">${escapeHtml(filename)}</span>`
                : '<span class="slide-narration-filename">No narration attached</span>'}
              <div class="slide-narration-actions">
                ${hasAudio ? `<button type="button" data-action="toggle-slide-audio-preview">${isPlaying ? "Pause" : "Play / Replay"}</button>` : ""}
                <button type="button" data-action="select-slide-audio">${hasAudio ? "Replace" : "Add Audio"}</button>
                ${hasAudio ? '<button type="button" data-action="remove-slide-audio">Remove</button>' : ""}
              </div>
            </div>
          ` : ""}
        </div>
      `;
    }

    function renderMainMediaControls(slide, className = "") {
      return `
        <div class="stage-media-controls ${escapeHtml(className)}" data-builder-only aria-label="Main image controls">
          <button type="button" data-action="media-fit" data-value="match" class="${slide.media.fit === "match" ? "is-active" : ""}">Match</button>
          <button type="button" data-action="media-fit" data-value="contain" class="${slide.media.fit === "contain" ? "is-active" : ""}">Contain</button>
          <button type="button" data-action="media-fit" data-value="cover" class="${slide.media.fit === "cover" ? "is-active" : ""}">Cover</button>
          <button class="icon-button" type="button" data-action="media-up" title="Move media up" aria-label="Move media up">${icon("up")}</button>
          <button class="icon-button" type="button" data-action="media-down" title="Move media down" aria-label="Move media down">${icon("down")}</button>
          <button class="icon-button" type="button" data-action="media-left" title="Move media left" aria-label="Move media left">${icon("left")}</button>
          <button class="icon-button" type="button" data-action="media-right" title="Move media right" aria-label="Move media right">${icon("right")}</button>
          <button class="icon-button" type="button" data-action="media-zoom-in" title="Zoom media in" aria-label="Zoom media in">${icon("zoomIn")}</button>
          <button class="icon-button" type="button" data-action="media-zoom-out" title="Zoom media out" aria-label="Zoom media out">${icon("zoomOut")}</button>
          <button class="icon-button" type="button" data-action="media-reset" title="Reset media position and size" aria-label="Reset media position and size">${icon("reset")}</button>
        </div>`;
    }

    function isHotspotVisibleForActiveState(hotspot, slide = currentSlide()) {
      if (isSlideIntroState(slide)) return false;
      const activeId = slide.hotspots.some((item) => item.id === state.ui.activeHotspotId)
        ? state.ui.activeHotspotId
        : slide.hotspots[0]?.id || null;
      if (hotspot.id === activeId) return true;
      if (!hotspot.locked) return false;
      const hotspotIndex = slide.hotspots.findIndex((item) => item.id === hotspot.id);
      const activeIndex = slide.hotspots.findIndex((item) => item.id === activeId);
      return hotspotIndex >= 0 && activeIndex >= hotspotIndex;
    }

    function isVisibleForActiveHotspot(item) {
      if (item.type === "slide-intro") return isSlideIntroState();
      if (currentSlide()?.kind === "video") return true;
      if (!item.hotspotGroupId) return true;
      if (item.hotspotGroupId === state.ui.activeHotspotId) return true;
      if (!item.locked || isSlideIntroState()) return false;
      const slide = currentSlide();
      const placedIndex = slide.hotspots.findIndex((hotspot) => hotspot.id === item.hotspotGroupId);
      const activeIndex = slide.hotspots.findIndex((hotspot) => hotspot.id === state.ui.activeHotspotId);
      return placedIndex >= 0 && activeIndex >= placedIndex;
    }

    function renderMainMedia(slide) {
      const media = slide.media;
      const objectFit = media.fit === "match" ? "contain" : media.fit;
      const hasTransform = Math.abs(media.x) > .001 || Math.abs(media.y) > .001 || Math.abs(media.scale - 1) > .001;
      const naturalSizeStyle = media.naturalWidth > 0 && media.naturalHeight > 0
        ? `;--media-natural-width:${media.naturalWidth}px;--media-natural-height:${media.naturalHeight}px`
        : "";
      const style = `--media-fit:${objectFit};--media-x:${media.x}%;--media-y:${media.y}%;--media-scale:${media.scale}${naturalSizeStyle}`;
      const layerClass = slide.kind === "video" ? "media-layer main-video-frame" : "media-layer";
      const layerStart = `<div class="${layerClass}" data-fit="${media.fit}" data-has-transform="${hasTransform}" style="${style}">`;
      const mediaKind = slide.kind === "video" || media.type === "video"
        ? "Video"
        : media.type === "audio" ? "Audio" : "Image";
      const failure = `<div class="media-placeholder" data-main-media-error hidden>${mediaKind} link could not be loaded. Check that it opens the media file directly.</div>`;
      if (!media.url) return `${layerStart}<div class="media-placeholder">${slide.kind === "video" ? "Video media box" : "Image media box"}</div></div>`;
      if (slide.kind === "video" || media.type === "video") {
        const preload = MODE === "player" ? "auto" : "metadata";
        return `${layerStart}${failure}<video data-main-video src="${escapeHtml(media.url)}" playsinline preload="${preload}" aria-label="${escapeHtml(slide.title || "Tutorial video")}" onloadedmetadata="this.hidden=false;this.previousElementSibling.hidden=true;this.closest('.main-video-frame')?.classList.remove('has-media-error')" onerror="this.hidden=true;this.previousElementSibling.hidden=false;this.closest('.main-video-frame')?.classList.add('has-media-error')"></video><div class="main-video-controls" aria-label="Video controls"><button class="icon-button" type="button" data-action="toggle-main-video" aria-label="Play video">${icon("play")}</button><input type="range" min="0" max="0" step="0.05" value="0" data-main-video-timeline aria-label="Video timeline" aria-valuetext="0:00 of 0:00"></div></div>`;
      }
      if (media.type === "audio") {
        return `${layerStart}${failure}<audio src="${escapeHtml(media.url)}" controls preload="metadata" aria-label="${escapeHtml(slide.title || "Tutorial audio")}" onloadedmetadata="this.hidden=false;this.previousElementSibling.hidden=true" onerror="this.hidden=true;this.previousElementSibling.hidden=false"></audio></div>`;
      }
      const sizeAttributes = media.naturalWidth > 0 && media.naturalHeight > 0
        ? ` width="${media.naturalWidth}" height="${media.naturalHeight}"`
        : "";
      return `${layerStart}${failure}<img data-main-media-image data-slide-id="${escapeHtml(slide.id)}" src="${escapeHtml(media.url)}" alt="${escapeHtml(slide.title || "Tutorial image")}"${sizeAttributes} loading="eager" decoding="async" onload="this.hidden=false;this.previousElementSibling.hidden=true" onerror="this.hidden=true;this.previousElementSibling.hidden=false"></div>`;
    }

    function renderHotspot(hotspot, index) {
      const selected = isObjectSelected("hotspot", hotspot.id);
      const primary = state.ui.selectedKind === "hotspot" && state.ui.selectedId === hotspot.id;
      const active = state.ui.activeHotspotId === hotspot.id;
      const grouped = Boolean(hotspot.hotspotGroupId);
      const style = hotspotStyle(index);
      return `
        <div class="stage-object hotspot-object ${selected ? "is-selected" : ""} ${active ? "is-active" : ""} ${hotspot.locked ? "is-locked" : ""} ${grouped ? "is-grouped" : ""}"
          data-object data-kind="hotspot" data-id="${hotspot.id}" data-action="activate-hotspot"
          role="button" tabindex="0" aria-label="Open ${escapeHtml(hotspot.title || `Hotspot ${index + 1}`)} details"
          style="${objectStyle(hotspot)};--hotspot-color:${style.color}" data-hotspot-style="${escapeHtml(style.name)}">
          <div class="object-frame"><span class="hotspot-art-fallback" aria-hidden="true"></span><img src="${style.image}" alt="" loading="eager" onload="this.hidden=false;this.parentElement.classList.remove('has-missing-hotspot-art')" onerror="this.hidden=true;this.parentElement.classList.add('has-missing-hotspot-art')"><span class="hotspot-number">${index + 1}</span></div>
          ${primary && !hotspot.locked ? renderHandles() : ""}
        </div>
      `;
    }

    function renderAnnotation(annotation) {
      const selected = isObjectSelected("annotation", annotation.id);
      const primary = state.ui.selectedKind === "annotation" && state.ui.selectedId === annotation.id;
      const audioIsPlaying = annotation.type === "audio" && activeAudio === annotation.id && audioPlaying;
      const grouped = Boolean(annotation.hotspotGroupId);
      const cropEnabled = annotation.type === "image" && annotation.cropEnabled;
      const cropEditing = annotation.type === "image" && imageCropEditId === annotation.id;
      const clippedMember = Boolean(clipFrameForMember(annotation));
      const classes = `stage-object annotation-${annotation.type} ${["video","link"].includes(annotation.type) ? "annotation-trigger" : ""} ${audioIsPlaying ? "is-playing" : ""} ${selected ? "is-selected" : ""} ${annotation.locked ? "is-locked" : ""} ${grouped ? "is-grouped" : ""} ${cropEnabled ? "is-crop-enabled" : ""} ${cropEditing ? "is-crop-editing" : ""} ${clippedMember ? "is-clipped-member" : ""}`;
      let content = "";
      if (["shape","image","gif"].includes(annotation.type)) {
        content = `<div class="object-frame annotation-asset-frame">${renderAnnotationAssetImage(annotation.src, annotation.label || "Annotation", "eager")}</div>`;
      } else if (annotation.type === "slide-intro") {
        content = `<div class="object-frame slide-intro-card">
          ${MODE === "builder" ? '<span class="card-top-drag-handle" data-handle="move" title="Drag this intro card" aria-label="Drag this intro card"></span>' : ""}
          ${MODE === "builder" ? `<label class="slide-intro-card__title-only-toggle" data-builder-only><input type="checkbox" data-action="toggle-intro-title-only" data-id="${escapeHtml(annotation.id)}" aria-label="Show only the intro title" ${annotation.introTitleOnly ? "checked" : ""}>Title only</label>` : ""}
          <div class="slide-intro-card__title" ${MODE === "builder" ? `contenteditable="true" role="textbox" aria-label="Slide intro title" data-bind="annotation.introTitle:${annotation.id}"` : ""}>${escapeHtml(annotation.introTitle)}</div>
          ${annotation.introTitleOnly ? "" : `<div class="slide-intro-card__body-field">
            ${renderBodyFormatBar("toggle-intro-pipe-list", "toggle-intro-numbered-list", annotation.id, bodyHasPipeLines(annotation.introBody), bodyHasNumberedLines(annotation.introBody))}
            ${renderBody(annotation.introBody, {
              className: "slide-intro-card__body",
              binding: `annotation.introBody:${annotation.id}`,
              label: "Slide intro body",
              placeholder: "Add the introductory text for this slide."
            })}
          </div>`}
        </div>`;
      } else if (annotation.type === "callout") {
        content = `<div class="object-frame standalone-callout-card">
          ${MODE === "builder" ? '<span class="card-top-drag-handle" data-handle="move" title="Drag this callout" aria-label="Drag this callout"></span>' : ""}
          <div class="standalone-callout-card__title" ${MODE === "builder" ? `contenteditable="true" role="textbox" aria-label="Callout title" data-bind="annotation.calloutTitle:${annotation.id}"` : ""}>${escapeHtml(annotation.calloutTitle)}</div>
          <div class="standalone-callout-card__body-field">
            ${renderBodyFormatBar("toggle-callout-pipe-list", "toggle-callout-numbered-list", annotation.id, bodyHasPipeLines(annotation.calloutBody), bodyHasNumberedLines(annotation.calloutBody))}
            ${renderBody(annotation.calloutBody, {
              className: "standalone-callout-card__body",
              binding: `annotation.calloutBody:${annotation.id}`,
              label: "Callout body",
              placeholder: "Add callout text."
            })}
          </div>
        </div>`;
      } else if (annotation.type === "cover") {
        content = `<div class="object-frame" role="img" aria-label="${escapeHtml(annotation.label || "Cover area")}"></div>`;
      } else if (annotation.type === "blur") {
        content = `<div class="object-frame" role="img" aria-label="${escapeHtml(annotation.label || "Blurred area")}"></div>`;
      } else if (annotation.type === "text") {
        content = `<div class="object-frame" ${MODE === "builder" ? `contenteditable="true" role="textbox" aria-label="Annotation text" data-bind="annotation.text:${annotation.id}"` : ""} style="color:${escapeHtml(annotation.textColor)}">${escapeHtml(annotation.text)}</div>`;
      } else if (annotation.type === "markup") {
        content = `<div class="object-frame markup-frame">${markupSvg(annotation)}</div>`;
      } else if (annotation.type === "magnifier") {
        content = `<div class="object-frame magnifier-viewport" role="img" aria-label="Magnified area">
          <span class="magnifier-scene-host" data-magnifier-scene-host aria-hidden="true"></span>
        </div>
        ${primary && MODE === "builder" ? `<div class="magnifier-controls" data-builder-only aria-label="Magnifier controls">
          <button type="button" data-action="adjust-magnifier" data-delta="-0.25" title="Reduce magnification" aria-label="Reduce magnification">−</button>
          <output aria-label="Current magnification">${Number(annotation.magnification || 2).toFixed(2).replace(/0+$/, "").replace(/\.$/, "")}×</output>
          <button type="button" data-action="adjust-magnifier" data-delta="0.25" title="Increase magnification" aria-label="Increase magnification">+</button>
        </div>` : ""}`;
      } else if (annotation.type === "clip-frame") {
        const members = clipFrameMembers(annotation)
          .slice()
          .sort((a, b) => a.z - b.z)
          .filter(isVisibleForActiveHotspot)
          .map(renderAnnotation)
          .join("");
        content = `<div class="object-frame clip-frame-viewport" role="group" aria-label="Clipped frame contents">
          <div class="clip-frame-scene" style="${clipFrameSceneStyle(annotation)}">${members}</div>
        </div>
        ${primary && MODE === "builder" ? `<div class="clip-frame-controls" data-builder-only aria-label="Clip frame controls">
          <button type="button" data-action="set-clip-frame-shape" data-value="straight" aria-pressed="${annotation.clipFrameShape === "straight"}">Straight</button>
          <button type="button" data-action="set-clip-frame-shape" data-value="rounded" aria-pressed="${annotation.clipFrameShape === "rounded"}">Rounded</button>
          <button type="button" data-action="release-clip-frame" title="Remove the frame but keep its contents">Release</button>
        </div>` : ""}`;
      } else if (annotation.type === "video") {
        content = `<div class="object-frame annotation-asset-frame">${renderAnnotationAssetImage(VIDEO_ANNOTATION_IMAGE, annotation.label || "Play video")}</div>`;
      } else if (annotation.type === "link") {
        content = MODE === "player"
          ? `<div class="object-frame annotation-asset-frame"><a href="${escapeHtml(annotation.url)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(annotation.label || "Open external link")}">${renderAnnotationAssetImage(LINK_ANNOTATION_IMAGE, annotation.label || "Open link")}</a></div>`
          : `<div class="object-frame annotation-asset-frame">${renderAnnotationAssetImage(LINK_ANNOTATION_IMAGE, annotation.label || "Open link")}</div>`;
      } else {
        const liveAudio = audioIsPlaying ? window.__tutorialAudio : null;
        const duration = liveAudio && Number.isFinite(liveAudio.duration) ? liveAudio.duration : 0;
        const currentTime = liveAudio ? clamp(liveAudio.currentTime, 0, duration || 0) : 0;
        content = `<div class="object-frame annotation-asset-frame">
          ${renderAnnotationAssetImage(audioIsPlaying ? AUDIO_PAUSE_IMAGE : AUDIO_PLAY_IMAGE, audioIsPlaying ? "Pause audio" : "Play audio")}
          <button type="button" class="audio-image-control audio-image-control--toggle" data-action="toggle-audio" data-id="${annotation.id}" aria-label="${audioIsPlaying ? "Pause" : "Play"} audio" aria-pressed="${audioIsPlaying}"></button>
          ${audioIsPlaying ? `<div class="audio-timeline-wrap">
            <input type="range" min="0" max="${duration}" step="0.05" value="${currentTime}" data-audio-timeline data-id="${annotation.id}" aria-label="Audio timeline" aria-valuetext="${formatVideoTime(currentTime)} of ${formatVideoTime(duration)}">
          </div>` : ""}
        </div>`;
      }
      return `
        <div class="${classes}" data-object data-kind="annotation" data-id="${annotation.id}" data-text-style="${annotation.textStyle}" ${annotation.type === "magnifier" ? `data-magnifier-lens data-magnifier-z="${annotation.z}"` : ""} ${annotation.type === "clip-frame" ? "data-clip-frame" : ""} ${annotation.type === "slide-intro" ? `data-intro-align="${escapeHtml(annotation.introAlign)}" data-intro-title-only="${Boolean(annotation.introTitleOnly)}"` : ""} ${annotation.type === "callout" ? `data-callout-align="${escapeHtml(annotation.calloutAlign)}"` : ""} ${annotation.type === "markup" ? `data-markup-kind="${escapeHtml(annotation.markup)}"` : ""} ${annotation.type === "video" ? `role="button" tabindex="0" aria-label="Open ${escapeHtml(annotation.label || "video")}"` : ""} ${MODE === "builder" && annotation.type === "video" ? 'title="Click once to select; click the selected video again to preview"' : ""} style="${objectStyle(annotation)}">
          ${content}
          ${primary && !annotation.locked ? renderHandles(annotation) : ""}
        </div>
      `;
    }

    function markupSvg(annotation) {
      const kind = normalizeMarkupKind(annotation.markup);
      const dotted = kind.endsWith("-dotted");
      const filled = kind.endsWith("-fill");
      const dash = dotted ? ' stroke-dasharray="8 7"' : "";
      if (kind.startsWith("square-")) {
        return filled
          ? `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x="7" y="7" width="86" height="86" fill="var(--markup-color, #000000)" stroke="none"/></svg>`
          : `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x="7" y="7" width="86" height="86" fill="none" stroke="var(--markup-color, #000000)"${dash}/></svg>`;
      }
      if (kind.startsWith("circle-")) {
        return filled
          ? `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="50" rx="43" ry="43" fill="var(--markup-color, #000000)" stroke="none"/></svg>`
          : `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="50" rx="43" ry="43" fill="none" stroke="var(--markup-color, #000000)"${dash}/></svg>`;
      }
      const path = markupPath(annotation);
      if (kind.startsWith("arrow-")) {
        const markerId = `arrowhead-${String(annotation.id).replace(/[^a-zA-Z0-9_-]/g, "") || "annotation"}`;
        return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="${markerId}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4" markerHeight="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="var(--markup-color, #000000)"/></marker></defs><path data-markup-primary="true" d="${path}" fill="none" stroke="var(--markup-color, #000000)" stroke-linecap="round"${dash} marker-end="url(#${markerId})"/></svg>`;
      }
      return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path data-markup-primary="true" d="${path}" fill="none" stroke="var(--markup-color, #000000)" stroke-linecap="round"${dash}/></svg>`;
    }

    function markupPath(annotation) {
      const points = normalizeMarkupPoints(annotation.markupPoints, annotation.markup);
      return `M ${points.start.x} ${points.start.y} Q ${points.curve.x} ${points.curve.y} ${points.end.x} ${points.end.y}`;
    }

    function renderHandles(item = null) {
      const resizeHandles = item
        ? ["nw","n","ne","e","se","s","sw","w"]
        : ["nw","ne","sw","se"];
      const resize = resizeHandles.map((handle) => `<span class="resize-handle" data-handle="${handle}" aria-hidden="true"></span>`).join("");
      const markupPoints = item?.type === "markup" && isPathMarkup(item.markup)
        ? normalizeMarkupPoints(item.markupPoints, item.markup)
        : null;
      const bend = markupPoints ? `
        <span class="markup-point-handle" data-handle="markup-start" style="left:${markupPoints.start.x}%;top:${markupPoints.start.y}%" aria-hidden="true"></span>
        <span class="markup-point-handle markup-point-handle--bend" data-handle="markup-curve" style="left:${markupPoints.curve.x}%;top:${markupPoints.curve.y}%" aria-hidden="true"></span>
        <span class="markup-point-handle" data-handle="markup-end" style="left:${markupPoints.end.x}%;top:${markupPoints.end.y}%" aria-hidden="true"></span>
      ` : "";
      const rotate = ["shape", "text", "slide-intro", "callout"].includes(item?.type)
        || (item?.type === "markup" && isPathMarkup(item.markup))
        ? `<span class="rotate-handle" data-handle="rotate" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M20 7V3m0 0h-4m4 0-4 4a7 7 0 1 0 2 7"/></svg></span>`
        : "";
      const flip = item?.type === "shape"
        ? `<button type="button" class="flip-handle ${item.flipX ? "is-active" : ""}" data-action="flip-shape" data-id="${escapeHtml(item.id)}" title="Flip shape side to side" aria-label="Flip shape horizontally" aria-pressed="${Boolean(item.flipX)}">${icon("flipHorizontal")}</button>`
        : "";
      return `${resize}${bend}${rotate}${flip}<span class="move-handle" data-handle="move" aria-hidden="true">Move</span>`;
    }

    function atBeginning() {
      const slide = currentSlide();
      if (state.ui.slideIndex > 0) return false;
      return !slide.hotspots.length || !state.ui.activeHotspotId || slide.hotspots[0]?.id === state.ui.activeHotspotId;
    }

    function atEnd() {
      const slide = currentSlide();
      if (state.ui.slideIndex < state.tutorial.slides.length - 1) return false;
      const lastHotspot = slide.hotspots[slide.hotspots.length - 1];
      return !slide.hotspots.length || lastHotspot?.id === state.ui.activeHotspotId;

    function renderContentsPreviewMedia(slide) {
      const media = slide.media || {};
      const mediaUrl = String(media.url || "").trim();
      if (slide.kind === "video" || media.type === "video") {
        return `<span class="contents-preview-video-label">VIDEO PAGE</span>`;
      }
      if (!mediaUrl || media.type === "audio") return "";
      const fit = media.fit === "cover" ? "cover" : "contain";
      const style = `--media-fit:${fit};--media-x:${Number(media.x) || 0}%;--media-y:${Number(media.y) || 0}%;--media-scale:${Number(media.scale) || 1}`;
      return `<span class="contents-preview-media" style="${style}"><img src="${escapeHtml(mediaUrl)}" alt="" loading="eager" decoding="async"></span>`;
    }

    function renderContentsPreviewAnnotation(annotation, slide = currentSlide()) {
      const type = annotation.type;
      const baseStyle = objectStyle(annotation);
      const open = (extraClass = "") => `<span class="contents-preview-object ${extraClass}" style="${baseStyle}">`;
      if (["shape", "image", "gif"].includes(type)) {
        const src = resolveAnnotationAssetSrc(annotation.src);
        const cropClass = type === "image" && annotation.cropEnabled ? " is-crop-enabled" : "";
        return `${open(`contents-preview-${type}${cropClass}`)}<img src="${escapeHtml(src)}" alt="" loading="eager" decoding="async"></span>`;
      }
      if (type === "clip-frame") {
        const members = clipFrameMembers(annotation, slide)
          .slice()
          .sort((a, b) => a.z - b.z)
          .map((member) => renderContentsPreviewAnnotation(member, slide))
          .join("");
        return `<span class="contents-preview-object contents-preview-clip-frame" style="${baseStyle}"><span class="clip-frame-viewport"><span class="clip-frame-scene" style="${clipFrameSceneStyle(annotation)}">${members}</span></span></span>`;
      }
      if (type === "magnifier") {
        return `<span class="contents-preview-object contents-preview-magnifier" data-magnifier-lens data-magnifier-z="${annotation.z}" style="${baseStyle}"><span class="magnifier-viewport"><span class="magnifier-scene-host" data-magnifier-scene-host aria-hidden="true"></span></span></span>`;
      }
      if (type === "cover") return `${open("contents-preview-cover")}</span>`;
      if (type === "blur") return `${open("contents-preview-blur")}</span>`;
      if (type === "markup") return `${open("contents-preview-markup")}${markupSvg(annotation)}</span>`;
      if (type === "text") {
        const size = Math.max(4, (Number(annotation.textFontSize) || 16) * .32);
        const textStyle = annotation.textStyle === "italic" ? "italic" : "normal";
        const style = `${baseStyle};--preview-text-color:${annotation.textColor || "#000000"};--preview-text-size:${size}px;--preview-text-style:${textStyle}`;
        return `<span class="contents-preview-object contents-preview-text" data-text-style="${escapeHtml(annotation.textStyle)}" style="${escapeHtml(style)}">${escapeHtml(annotation.text)}</span>`;
      }
      if (type === "slide-intro" || type === "callout") {
        const title = type === "slide-intro" ? annotation.introTitle : annotation.calloutTitle;
        const body = type === "slide-intro" ? annotation.introBody : annotation.calloutBody;
        const titleOnly = type === "slide-intro" && annotation.introTitleOnly;
        return `${open(`contents-preview-card${titleOnly ? " contents-preview-card--title-only" : ""}`)}<span class="contents-preview-card-title">${escapeHtml(title || "")}</span>${titleOnly ? "" : `<span class="contents-preview-card-body">${escapeHtml(body || "")}</span>`}</span>`;
      }
      const iconSrc = type === "video"
        ? VIDEO_ANNOTATION_IMAGE
        : type === "link"
          ? LINK_ANNOTATION_IMAGE
          : type === "audio" ? AUDIO_PLAY_IMAGE : "";
      return iconSrc
        ? `${open(`contents-preview-${type}`)}<img src="${escapeHtml(resolveAnnotationAssetSrc(iconSrc))}" alt="" loading="eager" decoding="async"></span>`
        : "";
    }

    function renderContentsPreviewHotspot(hotspot, index) {
      const style = hotspotStyle(index);
      return `<span class="contents-preview-object contents-preview-hotspot" style="${objectStyle(hotspot)}"><img src="${escapeHtml(style.image)}" alt="" loading="eager" decoding="async"><span class="contents-preview-hotspot-number">${index + 1}</span></span>`;
    }

    function renderContentsSlidePreview(slide) {
      const previewColor = /^#[0-9a-f]{6}$/i.test(String(slide.media?.matte || "")) ? slide.media.matte : "#ffffff";
      const annotations = topLevelAnnotations(slide)
        .slice()
        .sort((a, b) => a.z - b.z)
        .map((annotation) => renderContentsPreviewAnnotation(annotation, slide))
        .join("");
      const hotspots = slide.hotspots.map(renderContentsPreviewHotspot).join("");
      return `<span class="contents-preview-stage" data-scene-coordinate-system="${SCENE_COORDINATE_SYSTEM}" style="--contents-preview-color:${escapeHtml(previewColor)}">${renderContentsPreviewMedia(slide)}${annotations}${hotspots}</span>`;

    function renderDemoPreviewModal() {
      if (MODE !== "builder" || !demoPreviewOpen || !demoPreviewHtml) return "";
      return `
        <div class="modal" id="demoPreviewModal">
          <section class="modal-panel demo-preview-modal-panel" role="dialog" aria-modal="true" aria-labelledby="demoPreviewTitle">

    function syncMainMediaImage(image) {
      const naturalWidth = Math.max(0, Math.round(image.naturalWidth || 0));
      const naturalHeight = Math.max(0, Math.round(image.naturalHeight || 0));
      if (!naturalWidth || !naturalHeight) return;
      image.setAttribute("width", String(naturalWidth));
      image.setAttribute("height", String(naturalHeight));
      const layer = image.closest(".media-layer");
      layer?.style.setProperty("--media-natural-width", `${naturalWidth}px`);
      layer?.style.setProperty("--media-natural-height", `${naturalHeight}px`);
      const stage = image.closest("[data-stage]");
      const slide = state.tutorial.slides.find((item) => item.id === image.dataset.slideId);
      if (!slide || slide.media.naturalWidth === naturalWidth && slide.media.naturalHeight === naturalHeight) return;
      slide.media.naturalWidth = naturalWidth;
      slide.media.naturalHeight = naturalHeight;
      scheduleSave();
    }

    function waitForPlayerMedia(media) {
      if (!media) return Promise.resolve();
      const isImage = media.matches("img");
      const isVideo = media.matches("video");
      if (isImage && media.complete) {
        return media.naturalWidth > 0 && typeof media.decode === "function"
          ? media.decode().catch(() => {})
          : Promise.resolve();
      }
      if (isVideo && media.readyState >= 2) return Promise.resolve();
      return new Promise((resolve) => {
        let settled = false;
        const loadEvent = isVideo ? "loadeddata" : "load";
        const finish = () => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timeout);
          media.removeEventListener(loadEvent, handleLoad);
          media.removeEventListener("error", finish);
          resolve();
        };
        const handleLoad = () => {
          if (isImage && typeof media.decode === "function") media.decode().catch(() => {}).finally(finish);
          else finish();
        };
        const timeout = window.setTimeout(finish, 3500);
        media.addEventListener(loadEvent, handleLoad, { once: true });
        media.addEventListener("error", finish, { once: true });
      });
    }

    function playerSlideVisualUrls(slide) {
      if (!slide) return [];
      const urls = [];
      const add = (value) => {
        const url = String(value || "").trim();
        if (url && !urls.includes(url)) urls.push(url);
      };
      if (slide.media?.type !== "audio" && slide.kind !== "video" && slide.media?.type !== "video") add(slide.media?.url);
      slide.annotations.forEach((annotation) => {
        if (["shape", "image", "gif"].includes(annotation.type)) add(resolveAnnotationAssetSrc(annotation.src));
        else if (annotation.type === "video") add(resolveAnnotationAssetSrc(VIDEO_ANNOTATION_IMAGE));
        else if (annotation.type === "link") add(resolveAnnotationAssetSrc(LINK_ANNOTATION_IMAGE));
        else if (annotation.type === "audio") {
          add(resolveAnnotationAssetSrc(AUDIO_PLAY_IMAGE));
          add(resolveAnnotationAssetSrc(AUDIO_PAUSE_IMAGE));
        }
      });
      slide.hotspots.forEach((_, index) => add(hotspotStyle(index).image));
      return urls;
    }

    function preloadNextPlayerMedia() {
      if (MODE !== "player") return;
      const nextSlide = state.tutorial.slides[state.ui.slideIndex + 1];
      if (!nextSlide) {
        playerPreloadedMedia = null;
        return;
      }
      const isVideo = nextSlide.kind === "video" || nextSlide.media.type === "video";
      const preloaders = [];
      if (isVideo) {
        const videoUrl = String(nextSlide.media?.url || "").trim();
        const video = document.createElement("video");
        video.preload = "auto";
        video.muted = true;
        if (videoUrl) {
          video.src = videoUrl;
          video.load();
          preloaders.push(video);
        }
      }
      playerSlideVisualUrls(nextSlide).forEach((url) => {
        const image = new Image();
        image.decoding = "async";
        image.loading = "eager";
        image.src = url;
        preloaders.push(image);
      });
      playerPreloadedMedia = preloaders;
    }

    function preparePlayerSlideVisuals(slide = currentSlide()) {
      if (MODE !== "player") return Promise.resolve();
      const body = root.querySelector(".tutorial-body");
      const slideId = slide?.id || "";
      if (!body || !slideId) return Promise.resolve();
      if (playerVisualReadySlideId === slideId) {
        body.classList.remove("is-slide-media-pending");
        body.classList.add("is-slide-media-ready");
        return Promise.resolve();
      }
      body.classList.add("is-slide-media-pending");
      body.classList.remove("is-slide-media-ready");
      const media = Array.from(body.querySelectorAll("[data-main-media-image], [data-main-video], .stage .annotation-asset-frame > img, .stage .hotspot-object .object-frame > img"));
      return Promise.all(media.map(waitForPlayerMedia)).then(() => {
        if (!body.isConnected || currentSlide()?.id !== slideId) return;
        body.classList.remove("is-slide-media-pending");
        body.classList.add("is-slide-media-ready");
        playerVisualReadySlideId = slideId;
        preloadNextPlayerMedia();
      });
    }

    function syncMagnifierScenes() {
      root.querySelectorAll("[data-magnifier-lens]").forEach((lens) => {
        const host = lens.querySelector("[data-magnifier-scene-host]");
        const source = lens.closest("[data-stage], .contents-preview-stage");
        if (!host || !source) return;
        const lensZ = Number(lens.dataset.magnifierZ) || Number(lens.style.getPropertyValue("--z")) || 0;
        const clone = source.cloneNode(true);
        clone.querySelectorAll("[data-magnifier-lens], [data-builder-only], .main-video-controls, .resize-handle, .markup-point-handle, .rotate-handle, .flip-handle, .move-handle, .magnifier-controls").forEach((node) => node.remove());
        clone.querySelectorAll(".stage-object, .contents-preview-object").forEach((node) => {
          const objectZ = Number(node.style.getPropertyValue("--z")) || 0;
          if (objectZ >= lensZ) node.remove();
        });
        clone.querySelectorAll(".is-selected, .is-locked, .is-grouped, .is-attention").forEach((node) => {
          node.classList.remove("is-selected", "is-locked", "is-grouped", "is-attention");
        });
        clone.querySelectorAll("[contenteditable], [tabindex], [data-action]").forEach((node) => {
          node.removeAttribute("contenteditable");
          node.removeAttribute("tabindex");
          node.removeAttribute("data-action");
        });
        clone.querySelectorAll("video, audio").forEach((media) => {
          media.muted = true;
          media.removeAttribute("controls");
        });
        clone.removeAttribute("data-stage");
        clone.removeAttribute("aria-label");
        clone.className = source.matches("[data-stage]") ? "stage magnifier-scene" : "contents-preview-stage magnifier-scene";
        host.replaceChildren(clone);
      });
    }

    function updateMainVideoControls(video = root.querySelector("[data-main-video]")) {
      if (!video) return;
      const frame = video.closest(".main-video-frame");
      const button = frame?.querySelector('[data-action="toggle-main-video"]');
      const timeline = frame?.querySelector("[data-main-video-timeline]");
      const duration = Number.isFinite(video.duration) ? video.duration : 0;
      const currentTime = clamp(video.currentTime || 0, 0, duration);
      if (button) {
        button.innerHTML = icon(video.paused ? "play" : "pause");

      }
      if (timeline) {
        timeline.max = String(duration);

        timeline.setAttribute("aria-valuetext", `${formatVideoTime(currentTime)} of ${formatVideoTime(duration)}`);
      }
    }

    function youtubeVideoInfo(value) {
      const original = String(value || "").trim();
      if (!original) return null;
      try {
        const url = new URL(original);
        const host = url.hostname.toLowerCase().replace(/^www\./, "");
        const isYoutube = host === "youtube.com"
          || host.endsWith(".youtube.com")
          || host === "youtube-nocookie.com"
          || host.endsWith(".youtube-nocookie.com");
        const isShareHost = host === "youtu.be" || host.endsWith(".youtu.be");
        if (!isYoutube && !isShareHost) return null;
        const parts = url.pathname.split("/").filter(Boolean);
        const isShort = isYoutube && parts[0] === "shorts";
        let id = "";
        if (isShareHost) id = parts[0] || "";
        else if (isShort) id = parts[1] || "";
        else if (["embed", "live", "v"].includes(parts[0])) id = parts[1] || "";
        else id = url.searchParams.get("v") || "";
        if (!/^[a-zA-Z0-9_-]{6,20}$/.test(id)) return null;
        return {
          id,
          isShort,
          embedUrl: `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0`
        };
      } catch (_) {
        return null;
      }
    }

    function setVideoModalAspect(width, height) {
      const media = document.querySelector(".video-modal-media");
      if (!media) return;
      const aspect = Number(width) > 0 && Number(height) > 0 ? Number(width) / Number(height) : 16 / 9;
      media.dataset.videoAspect = String(aspect);
      media.style.setProperty("--video-aspect", String(aspect));

    function sizeActiveVideoModal() {
      const media = document.querySelector(".video-modal-media");
      const panel = media?.closest(".video-modal-panel");
      if (!media || !panel) return;
      const aspect = clamp(Number(media.dataset.videoAspect) || 16 / 9, .25, 4);
      const reservedHeight = media.querySelector(".video-modal-controls") ? 235 : 190;
      const availableHeight = Math.max(200, window.innerHeight - reservedHeight);
      const maxWidth = Math.min(980, Math.max(200, availableHeight * aspect));
      panel.style.setProperty("--video-modal-max-width", `${maxWidth}px`);
    }

    function updateDirectVideoControls() {
      const video = document.getElementById("videoModalMedia");
      const button = document.querySelector('[data-action="toggle-video"].icon-button');
      const timeline = document.getElementById("videoTimeline");
      const time = document.getElementById("videoTime");
      if (!video) return;
      if (button) {

      }
      const duration = Number.isFinite(video.duration) ? video.duration : 0;
      if (timeline) {
        timeline.max = String(duration);
        timeline.value = String(Math.min(video.currentTime || 0, duration));
        timeline.setAttribute("aria-valuetext", `${formatVideoTime(video.currentTime)} of ${formatVideoTime(duration)}`);
      }
      if (time) time.textContent = `${formatVideoTime(video.currentTime)} / ${formatVideoTime(duration)}`;
    }

    function formatVideoTime(seconds) {
      const safe = Number.isFinite(seconds) ? Math.max(0, Math.floor(seconds)) : 0;
      return `${Math.floor(safe / 60)}:${String(safe % 60).padStart(2, "0")}`;
    }

    async function loadShapes() {
      try {
        const response = await fetch(SHAPES_CSV_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`Shape catalog returned ${response.status}.`);
        const rows = (await response.text()).split(/\r?\n/).map((line) => {
          const comma = line.indexOf(",");
          if (comma < 1) return null;
          const name = line.slice(0, comma).replace(/\u00a0/g, " ").trim();
          const rawUrl = line.slice(comma + 1).split(",")[0].trim();
          if (!name || !/^https?:\/\//i.test(rawUrl)) return null;
          let url = normalizeShapeAssetUrl(name, rawUrl);
          if (name.toLowerCase() === "bubble" && /\/bubble%20png$/i.test(url)) {
            url = "https://iridescent-wisp-57bcb1.netlify.app/images/tutorial-annotations/bubble%20%20.png";
          }
          return { name, url };
        }).filter(Boolean);
        if (rows.length) {
          const hostedNames = new Set(rows.map(({ name }) => name.toLowerCase()));
          const missingFallbackRows = FALLBACK_SHAPES
            .filter(([name]) => !hostedNames.has(name.toLowerCase()))
            .map(([name, url]) => ({ name, url: normalizeShapeAssetUrl(name, url) }));
          shapes = [...rows, ...missingFallbackRows];
          render();
        }
      } catch (_) {
        showToast("Hosted shape list could not be reached. Using the built-in backup list.");
      }
    }

    function mixedBodyCaret(editor) {
      if (!editor) return null;
      const selection = window.getSelection();
      if (!selection?.rangeCount || !selection.isCollapsed) return null;
      const anchorNode = selection.anchorNode;
      const anchorElement = anchorNode?.nodeType === 1 ? anchorNode : anchorNode?.parentElement;
      if (!anchorElement || !editor.contains(anchorElement)) return null;
      let line = anchorElement.closest?.(".mixed-body-line");
      if ((!line || line.parentElement !== editor) && anchorElement === editor) {
        const lineIndex = clamp(selection.anchorOffset, 0, Math.max(0, editor.children.length - 1));
        line = editor.children[lineIndex]?.closest?.(".mixed-body-line") || editor.querySelector(".mixed-body-line:first-child");
      }
      if (!line || line.parentElement !== editor) return null;
      let offset = 0;
      if (anchorNode && line.contains(anchorNode)) {
        try {
          const beforeCaret = document.createRange();
          beforeCaret.selectNodeContents(line);
          beforeCaret.setEnd(anchorNode, selection.anchorOffset);
          offset = beforeCaret.toString().length;
        } catch (_) {
          offset = 0;
        }
      }
      return { line, offset };
    }

    function selectedMixedBodyLines(editor, useRememberedSelection = true) {
      const lines = Array.from(editor?.querySelectorAll(":scope > .mixed-body-line") || []);
      if (!editor || !lines.length) return [];
      const selection = window.getSelection();
      const range = selection?.rangeCount ? selection.getRangeAt(0) : null;
      const anchorElement = selection?.anchorNode?.nodeType === 1
        ? selection.anchorNode
        : selection?.anchorNode?.parentElement;
      if (range && anchorElement && editor.contains(anchorElement)) {
        const caret = mixedBodyCaret(editor);
        if (caret) return [caret.line];
        const selected = lines.filter((line) => {
          try { return range.intersectsNode(line); }
          catch (_) { return false; }
        });
        if (selected.length) return selected;
      }
      if (useRememberedSelection
          && lastMixedBodySelection?.editor === editor
          && lastMixedBodySelection.lines.every((line) => line.isConnected)) {
        return lastMixedBodySelection.lines;
      }
      return [lines[0]];
    }

    function lineListKind(line) {
      if (line?.dataset.listKind) return line.dataset.listKind;
      return line?.dataset.pipe === "true" ? "pipe" : "plain";
    }

    function setLineListKind(line, kind) {
      if (!line) return;
      line.dataset.listKind = kind;
      line.dataset.pipe = String(kind === "pipe");
      line.classList.toggle("is-pipe", kind === "pipe");
      line.classList.toggle("is-numbered", kind === "numbered");
    }

    function updateBodyListToggleState(editor, lines = selectedMixedBodyLines(editor, false)) {
      if (!editor || !lines.length) return;
      const container = editor.closest(".body-field, .hotspot-detail-panel, .slide-intro-card__body-field, .standalone-callout-card__body-field");
      container?.querySelectorAll(".body-list-toggle").forEach((button) => {
        const active = lines.every((line) => lineListKind(line) === button.dataset.listKind);
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function rememberMixedBodySelection() {
      if (MODE !== "builder") return;
      const selection = window.getSelection();
      const anchorElement = selection?.anchorNode?.nodeType === 1
        ? selection.anchorNode
        : selection?.anchorNode?.parentElement;
      const editor = anchorElement?.closest?.(".mixed-body-editor");
      if (!editor) return;
      const lines = selectedMixedBodyLines(editor, false);
      if (!lines.length) return;
      const caret = mixedBodyCaret(editor);
      lastMixedBodySelection = {
        editor,
        lines,
        focusLine: caret?.line || lines[0],
        caretOffset: caret?.offset || 0
      };
      updateBodyListToggleState(editor, lines);
    }

    function toggleMixedBodyListLines(editor, button, kind) {
      if (!editor) return false;
      const lines = selectedMixedBodyLines(editor);
      if (!lines.length) return false;
      const remembered = lastMixedBodySelection?.editor === editor ? lastMixedBodySelection : null;
      const focusLine = remembered?.focusLine && lines.includes(remembered.focusLine)
        ? remembered.focusLine
        : lines[0];
      const caretOffset = focusLine === remembered?.focusLine ? remembered.caretOffset || 0 : 0;
      const makeList = !lines.every((line) => lineListKind(line) === kind);
      lines.forEach((line) => setLineListKind(line, makeList ? kind : "plain"));
      updateBodyListToggleState(editor, lines);
      editor.dispatchEvent(new Event("input", { bubbles: true }));
      editor.focus({ preventScroll: true });
      placeCaretInMixedBodyLine(focusLine, caretOffset);
      lastMixedBodySelection = { editor, lines, focusLine, caretOffset };
      if (button) {
        button.classList.toggle("is-active", makeList);
        button.setAttribute("aria-pressed", String(makeList));
      }
      const listLabel = kind === "numbered" ? "numbered list" : "pipe bullets";
      commit(makeList ? `Added ${listLabel} to the selected lines.` : "Changed the selected lines to paragraphs.", false);
      return true;
    }

    function addAnnotationFromUrl(type, value, videoLabel = "") {
      if (!["image", "video", "gif", "audio", "link"].includes(type)) return false;
      const cleanValue = String(value || "").trim();
      if (!cleanValue || cleanValue === mediaBase() || cleanValue === "https://") {
        showToast(`Add the ${type} URL first.`);
        return false;
      }
      const normalizedValue = normalizeHostedAnnotationUrl(type, cleanValue);
      if (type === "image" || type === "gif") {
        addImageAnnotation(type, normalizedValue, type === "gif" ? "GIF" : "Image");
        return true;
      }
      const slide = currentSlide();
      const annotation = normalizeAnnotation({
        id: uid(type),
        type,
        url: normalizedValue,
        label: type === "video" ? videoLabel || "Video" : type === "audio" ? "Audio" : "Link",
        x: 50,
        y: type === "audio" ? 76 : 48,
        w: type === "audio" ? 30 : type === "video" ? 24 : 12,
        h: type === "audio" ? 30 : type === "video" ? 22 : 12,
        z: topZ() + 1
      }, slide.annotations.length);
      slide.annotations.push(assignNewAnnotationToActiveHotspot(annotation));
      state.ui.selectedKind = "annotation";
      state.ui.selectedId = annotation.id;
      commit(`Added ${type} annotation.`);
      return true;
    }

    function toolbarAnnotationTypeLabel(type) {
      return ({ image: "image", video: "video", gif: "GIF", audio: "audio", link: "link" })[type] || "";
    }

    function toolbarAnnotationInputConfig() {
      const mode = toolbarAnnotationDraft.mode;
      if (mode === "video-title") {
        return {
          mode,
          value: toolbarAnnotationDraft.value,
          label: "Video popup title",
          placeholder: "VIDEO POPUP TITLE",
          title: "Optional title for the next video annotation"
        };
      }
      const label = toolbarAnnotationTypeLabel(mode);
      return {
        mode,
        value: toolbarAnnotationDraft.value,
        label: `${label} annotation URL`,
        placeholder: `PASTE ${label.toUpperCase()} URL + PRESS RETURN`,
        title: `Paste the full ${label} URL and press Return`
      };
    }

    function applyToolbarAnnotationInputDraft() {
      const input = document.getElementById("annotation-link-input");
      if (!input) return;
      input.value = toolbarAnnotationDraft.mode === "link" ? toolbarAnnotationDraft.value : "https://";
    }

    function toolbarVideoLabel() {
      const input = document.getElementById("annotation-video-label");
      return String(input?.value ?? toolbarAnnotationDraft.videoTitle ?? "").trim();
    }

    function activateToolbarAnnotationUrl(type) {
      if (type !== "link") return;
      const input = document.getElementById("annotation-link-input");
      const value = String(input?.value || "").trim();
      toolbarAnnotationDraft = {
        ...toolbarAnnotationDraft,
        mode: "link",
        value: value || "https://"
      };
      if (addAnnotationFromUrl("link", value, "")) {
        resetToolbarAnnotationInput();
        return;
      }
      applyToolbarAnnotationInputDraft();
      const activeInput = document.getElementById("annotation-link-input");
      if (!activeInput) return;
      activeInput.focus();
      activeInput.setSelectionRange(activeInput.value.length, activeInput.value.length);
    }

    function resetToolbarAnnotationInput(clearVideoTitle = false) {
      const videoTitle = clearVideoTitle ? "" : String(toolbarAnnotationDraft.videoTitle || "");
      toolbarAnnotationDraft = { mode: "link", value: "https://", videoTitle };
      const videoInput = document.getElementById("annotation-video-label");
      if (videoInput && clearVideoTitle) videoInput.value = "";
      applyToolbarAnnotationInputDraft();
    }

    function addUrlAnnotation(type) {
      const input = document.getElementById(`annotation-${type}-url`);
      const value = input?.value.trim() || "";
      const videoLabel = toolbarVideoLabel();
      if (!addAnnotationFromUrl(type, value, videoLabel)) input?.focus();
    }

    function topZ() {
      const slide = currentSlide();
      return Math.max(1, ...slide.hotspots.map((item) => item.z), ...slide.annotations.map((item) => item.z));
    }

    function moveSelectedZ(direction) {
      const item = selectedObject();
      if (!item) return;
      const slide = currentSlide();
      const layers = [
        ...slide.annotations.map((entry, index) => ({ item: entry, domOrder: index })),
        ...slide.hotspots.map((entry, index) => ({ item: entry, domOrder: slide.annotations.length + index }))
      ].sort((a, b) => a.item.z - b.item.z || a.domOrder - b.domOrder);
      const currentIndex = layers.findIndex((entry) => entry.item === item);
      if (currentIndex < 0) return;
      if (direction === "front") {
        if (currentIndex === layers.length - 1) {
          showToast("Object is already at the front.");
          return;
        }
        const [selectedLayer] = layers.splice(currentIndex, 1);
        layers.push(selectedLayer);
      } else {
        if (currentIndex === 0) {
          showToast("Object is already at the back.");
          return;
        }
        [layers[currentIndex - 1], layers[currentIndex]] = [layers[currentIndex], layers[currentIndex - 1]];
      }
      layers.forEach((entry, index) => {
        entry.item.z = index + 1;
      });
      commit(direction === "front" ? "Brought object to front." : "Sent object backward.");
    }

    function toggleSelectedLock() {
      const entries = selectedObjects();
      if (!entries.length) return;
      const lockItems = !entries.every(({ item }) => item.locked);
      entries.forEach(({ item }) => {
        item.locked = lockItems;
      });
      commit(lockItems
        ? `Locked ${entries.length === 1 ? "item" : `${entries.length} items`} and kept ${entries.length === 1 ? "it" : "them"} visible.`
        : `Unlocked ${entries.length === 1 ? "item" : `${entries.length} items`}.`);
    }

    function toggleSelectedHotspotGroup() {
      const grouping = hotspotGroupingSelection();
      if (!grouping.valid) {
        showToast("Select exactly one hotspot plus one or more annotations, then click Group with hotspot.");
        return;
      }
      const { hotspot, annotations } = grouping;
      const removeGroup = annotations.every(({ item }) => item.hotspotGroupId === hotspot.id);
      annotations.forEach(({ item }) => {
        item.hotspotGroupId = removeGroup ? "" : hotspot.id;
      });
      state.ui.activeHotspotId = hotspot.id;
      commit(removeGroup
        ? `Ungrouped ${annotations.length === 1 ? "annotation" : `${annotations.length} annotations`} from ${hotspot.title || "this hotspot"}.`
        : `Grouped ${annotations.length === 1 ? "annotation" : `${annotations.length} annotations`} with ${hotspot.title || "this hotspot"}.`);
    }

    function toggleSelectedObjectGroup() {
      const grouping = objectGroupingSelection();
      if (!grouping.valid) {
        showToast("Shift-select at least two annotations, such as text and a shape, then click Group.");
        return;
      }
      if (grouping.grouped) {
        grouping.annotations.forEach(({ item }) => {
          item.objectGroupId = "";
        });
        commit(`Ungrouped ${grouping.annotations.length} items.`);
        return;
      }
      const groupId = uid("object-group");
      grouping.annotations.forEach(({ item }) => {
        item.objectGroupId = groupId;
      });
      multiSelection = grouping.annotations.map(({ key }) => key);
      commit(`Grouped ${grouping.annotations.length} items so they move together.`);
    }

    function toggleShapeFlip(id) {
      const shape = currentSlide().annotations.find((item) => item.id === id && item.type === "shape");
      if (!shape) return;
      shape.flipX = !shape.flipX;
      commit(shape.flipX ? "Flipped shape side to side." : "Restored shape direction.");
    }

    function arrangeSelected(mode) {
      const arrangement = arrangementEntries();
      const entries = arrangement.entries;
      const distribution = mode === "horizontal" || mode === "vertical";
      const minimum = distribution ? 3 : 2;
      if (entries.length < minimum) {
        showToast(distribution ? "Select at least three unlocked items." : "Select at least two unlocked items.");
        return;
      }
      if (mode === "left") {
        const left = Math.min(...entries.map(({ item }) => item.x - item.w / 2));
        entries.forEach(({ item }) => {
          item.x = clamp(left + item.w / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "center") {
        const left = Math.min(...entries.map(({ item }) => item.x - item.w / 2));
        const right = Math.max(...entries.map(({ item }) => item.x + item.w / 2));
        const center = (left + right) / 2;
        entries.forEach(({ item }) => {
          item.x = clamp(center, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "right") {
        const right = Math.max(...entries.map(({ item }) => item.x + item.w / 2));
        entries.forEach(({ item }) => {
          item.x = clamp(right - item.w / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "top") {
        const top = Math.min(...entries.map(({ item }) => item.y - item.h / 2));
        entries.forEach(({ item }) => {
          item.y = clamp(top + item.h / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "middle") {
        const top = Math.min(...entries.map(({ item }) => item.y - item.h / 2));
        const bottom = Math.max(...entries.map(({ item }) => item.y + item.h / 2));
        const middle = (top + bottom) / 2;
        entries.forEach(({ item }) => {
          item.y = clamp(middle, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "bottom") {
        const bottom = Math.max(...entries.map(({ item }) => item.y + item.h / 2));
        entries.forEach(({ item }) => {
          item.y = clamp(bottom - item.h / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        });
      } else if (mode === "horizontal") {
        const ordered = entries.slice().sort((a, b) => a.item.x - b.item.x);
        const start = ordered[0].item.x - ordered[0].item.w / 2;
        const last = ordered[ordered.length - 1].item;
        const end = last.x + last.w / 2;
        const totalWidth = ordered.reduce((sum, { item }) => sum + item.w, 0);
        const gap = (end - start - totalWidth) / (ordered.length - 1);
        let cursor = start;
        ordered.forEach(({ item }) => {
          item.x = clamp(cursor + item.w / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
          cursor += item.w + gap;
        });
      } else if (mode === "vertical") {
        const ordered = entries.slice().sort((a, b) => a.item.y - b.item.y);
        const start = ordered[0].item.y - ordered[0].item.h / 2;
        const last = ordered[ordered.length - 1].item;
        const end = last.y + last.h / 2;
        const totalHeight = ordered.reduce((sum, { item }) => sum + item.h, 0);
        const gap = (end - start - totalHeight) / (ordered.length - 1);
        let cursor = start;
        ordered.forEach(({ item }) => {
          item.y = clamp(cursor + item.h / 2, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
          cursor += item.h + gap;
        });
      }
      entries.forEach(({ item }) => fitStageObjectBounds(item));
      const target = arrangement.usesAllHotspots ? "all hotspots" : "selected items";
      const messages = {
        left: `Aligned ${target} left.`,
        center: `Aligned ${target} to center.`,
        top: `Aligned ${target} to top.`,
        middle: `Aligned ${target} to middle.`,
        bottom: `Aligned ${target} to bottom.`,
        horizontal: `Distributed ${target} horizontally.`,
        vertical: `Distributed ${target} vertically.`
      };
      commit(messages[mode]);
    }

    function duplicateSelectedItems() {
      const slide = currentSlide();
      const selection = selectedObjects();
      if (!selection.length) {
        showToast("Select an item to duplicate.");
        return;
      }
      if (selection.some(({ kind, item }) => kind === "annotation" && item.type === "slide-intro")) {
        showToast("A slide can have only one intro card.");
        return;
      }

      const selectedHotspots = selection.filter(({ kind }) => kind === "hotspot");
      const selectedAnnotations = selection.filter(({ kind }) => kind === "annotation");
      const hotspotIdMap = new Map(selectedHotspots.map(({ item }) => [item.id, uid("hotspot")]));
      const annotationIdMap = new Map(selectedAnnotations.map(({ item }) => [item.id, uid(item.type)]));
      const groupCounts = selectedAnnotations.reduce((counts, { item }) => {
        if (item.objectGroupId) counts.set(item.objectGroupId, (counts.get(item.objectGroupId) || 0) + 1);
        return counts;
      }, new Map());
      const objectGroupIdMap = new Map(
        [...groupCounts].filter(([, count]) => count > 1).map(([groupId]) => [groupId, uid("object-group")])
      );
      let nextZ = topZ();
      const offset = 2.5;

      const duplicateHotspots = selectedHotspots.map(({ item }, index) => {
        const copy = clone(item);
        copy.id = hotspotIdMap.get(item.id);
        copy.x = Number(copy.x || 0) + offset;
        copy.y = Number(copy.y || 0) + offset;
        copy.z = ++nextZ;
        copy.locked = false;
        copy.hotspotGroupId = hotspotIdMap.get(item.hotspotGroupId) || item.hotspotGroupId || "";
        return fitStageObjectBounds(normalizeHotspot(copy, slide.hotspots.length + index));
      });

      const duplicateAnnotations = selectedAnnotations.map(({ item }, index) => {
        const copy = clone(item);
        copy.id = annotationIdMap.get(item.id);
        copy.x = Number(copy.x || 0) + offset;
        copy.y = Number(copy.y || 0) + offset;
        copy.z = ++nextZ;
        copy.locked = false;
        copy.hotspotGroupId = hotspotIdMap.get(item.hotspotGroupId) || item.hotspotGroupId || "";
        copy.objectGroupId = objectGroupIdMap.get(item.objectGroupId) || "";
        copy.clipFrameId = annotationIdMap.get(item.clipFrameId) || item.clipFrameId || "";
        return fitStageObjectBounds(normalizeAnnotation(copy, slide.annotations.length + index));
      });

      slide.hotspots.push(...duplicateHotspots);
      slide.annotations.push(...duplicateAnnotations);
      if (duplicateHotspots.length) renumberHotspots(slide);

      const duplicateKeys = [
        ...duplicateHotspots.map((item) => selectionKey("hotspot", item.id)),
        ...duplicateAnnotations.map((item) => selectionKey("annotation", item.id))
      ];
      multiSelection = duplicateKeys;
      const primaryKind = state.ui.selectedKind;
      const primaryDuplicateId = primaryKind === "hotspot"
        ? hotspotIdMap.get(state.ui.selectedId)
        : annotationIdMap.get(state.ui.selectedId);
      const fallback = duplicateKeys.length ? selectionEntry(duplicateKeys[duplicateKeys.length - 1]) : null;
      state.ui.selectedKind = primaryDuplicateId ? primaryKind : fallback?.kind || null;
      state.ui.selectedId = primaryDuplicateId || fallback?.id || null;
      if (hotspotIdMap.has(state.ui.activeHotspotId)) {
        state.ui.activeHotspotId = hotspotIdMap.get(state.ui.activeHotspotId);
      }
      commit(`Duplicated ${selection.length} selected ${selection.length === 1 ? "item" : "items"}.`);
    }

    function deleteSelected() {
      const slide = currentSlide();
      if (!state.ui.selectedId) return;
      let message = "Deleted selected object.";
      stopAudio();
      if (state.ui.selectedKind === "hotspot") {
        const deletedHotspotId = state.ui.selectedId;
        slide.hotspots = slide.hotspots.filter((item) => item.id !== deletedHotspotId);
        renumberHotspots(slide);
        [...slide.hotspots, ...slide.annotations].forEach((item) => {
          if (item.hotspotGroupId === deletedHotspotId) item.hotspotGroupId = "";
        });
        state.ui.activeHotspotId = slideIntroCard(slide) ? null : slide.hotspots[0]?.id || null;
      } else {
        const deletedAnnotation = slide.annotations.find((item) => item.id === state.ui.selectedId);
        if (deletedAnnotation?.type === "clip-frame") {
          const released = clipFrameMembers(deletedAnnotation, slide);
          released.forEach((item) => { item.clipFrameId = ""; });
          message = `Deleted the clip frame and kept ${released.length} ${released.length === 1 ? "item" : "items"}.`;
        }
        slide.annotations = slide.annotations.filter((item) => item.id !== state.ui.selectedId);
        if (deletedAnnotation?.objectGroupId) {
          const remainingGroup = slide.annotations.filter((item) => item.objectGroupId === deletedAnnotation.objectGroupId);
          if (remainingGroup.length < 2) remainingGroup.forEach((item) => { item.objectGroupId = ""; });
        }
        if (deletedAnnotation?.type === "slide-intro") {
          state.ui.activeHotspotId = slide.hotspots[0]?.id || null;
        }
      }
      state.ui.selectedId = null;
      state.ui.selectedKind = null;
      commit(message);
    }

    async function addSlide(kind) {
      stopAudio();
      const slide = createSlide(kind);
      state.tutorial.slides.splice(state.ui.slideIndex + 1, 0, slide);
      state.ui.slideIndex += 1;
      state.ui.activeHotspotId = null;
      state.ui.selectedKind = null;
      state.ui.selectedId = null;
      commit(kind === "video" ? "Added video slide." : "Added image slide.");
      await selectExistingMediaFile(kind);
    }

    async function replaceSlideMedia(kind) {
      stopAudio();
      await selectExistingMediaFile(kind);
    }

    function duplicateSlide() {
      if (state.ui.slideIndex === 0) return;
      stopAudio();
      const duplicate = clone(currentSlide());
      duplicate.id = uid(duplicate.kind);
      const hotspotIdMap = new Map(duplicate.hotspots.map((item) => [item.id, uid("hotspot")]));
      const objectGroupIdMap = new Map(
        duplicate.annotations
          .map((item) => item.objectGroupId)
          .filter(Boolean)
          .map((groupId) => [groupId, uid("object-group")])
      );
      const annotationIdMap = new Map(duplicate.annotations.map((item) => [item.id, uid(item.type)]));
      duplicate.hotspots = duplicate.hotspots.map((item) => ({
        ...item,
        id: hotspotIdMap.get(item.id),
        hotspotGroupId: hotspotIdMap.get(item.hotspotGroupId) || ""
      }));
      duplicate.annotations = duplicate.annotations.map((item) => ({
        ...item,
        id: annotationIdMap.get(item.id),
        hotspotGroupId: hotspotIdMap.get(item.hotspotGroupId) || "",
        objectGroupId: objectGroupIdMap.get(item.objectGroupId) || "",
        clipFrameId: annotationIdMap.get(item.clipFrameId) || ""
      }));
      state.tutorial.slides.splice(state.ui.slideIndex + 1, 0, duplicate);
      state.ui.slideIndex += 1;
      state.ui.activeHotspotId = duplicate.hotspots[0]?.id || null;
      state.ui.selectedKind = null;
      state.ui.selectedId = null;
      commit("Duplicated slide.");
    }

    function deleteSlide() {
      if (state.ui.slideIndex === 0) return;
      const slideNumber = state.ui.slideIndex;
      const slideTitle = currentSlide().title || `Slide ${slideNumber}`;
      if (!window.confirm(`Delete slide ${slideNumber}: ${slideTitle}?\n\nLater slide numbers will move up.`)) return;
      stopAudio();
      state.tutorial.slides.splice(state.ui.slideIndex, 1);
      // Keep the user among the editable slides whenever a later slide moves into
      // the deleted slide's position. Only move backward when the last slide was
      // deleted. This avoids unexpectedly landing on the locked cover slide.
      state.ui.slideIndex = clamp(state.ui.slideIndex, 0, state.tutorial.slides.length - 1);
      state.ui.activeHotspotId = slideIntroCard(currentSlide()) ? null : currentSlide().hotspots[0]?.id || null;
      state.ui.selectedKind = null;
      state.ui.selectedId = null;
      multiSelection = [];
      commit(state.ui.slideIndex === 0 ? "Deleted the only editable slide." : "Deleted slide. The next slide moved into its place.");
    }

    function moveSlide(direction) {
      const index = state.ui.slideIndex;
      const target = index + direction;
      if (index <= 0 || target <= 0 || target >= state.tutorial.slides.length) return;
      const [slide] = state.tutorial.slides.splice(index, 1);
      state.tutorial.slides.splice(target, 0, slide);
      state.ui.slideIndex = target;
      commit(direction < 0
        ? "Moved this slide earlier. The neighboring slide moved later."
        : "Moved this slide later. The neighboring slide moved earlier.");
    }

    function selectedInsertedImage() {
      if (state.ui.selectedKind !== "annotation") return null;
      const annotation = currentSlide().annotations.find((item) => item.id === state.ui.selectedId);
      return annotation?.type === "image" ? annotation : null;
    }

    function toggleInsertedImageCrop() {
      const image = selectedInsertedImage();
      if (!image) {
        showToast("Select an inserted image first.");
        return;
      }
      if (imageCropEditId === image.id) {
        imageCropEditId = "";
        commit("Finished cropping the inserted image.");
        return;
      }
      image.cropEnabled = true;
      image.cropScale = clamp(image.cropScale || 1, OVERLAY_CROP_MIN_SCALE, OVERLAY_CROP_MAX_SCALE);
      imageCropEditId = image.id;
      commit("Crop mode: drag the side or corner handles inward. Drag the image itself to reposition it, then click Done Crop.");
    }

    function zoomInsertedImageCrop(amount) {
      const image = selectedInsertedImage();
      if (!image?.cropEnabled) return;
      image.cropScale = clamp((image.cropScale || 1) + amount, OVERLAY_CROP_MIN_SCALE, OVERLAY_CROP_MAX_SCALE);
      imageCropEditId = image.id;
      commit(amount > 0 ? "Cropped closer into the inserted image." : "Showed more of the inserted image.");
    }

    function setInsertedImageCornerRadius(value) {
      const image = selectedInsertedImage();
      if (!image) return;
      image.cornerRadius = clamp(Number(value) || 0, 0, 50);
      const label = image.cornerRadius === 0
        ? "square"
        : image.cornerRadius === 3 ? "soft" : image.cornerRadius === 10 ? "rounded" : "circular";
      commit(`Set inserted image corners to ${label}.`);
    }

    function resetInsertedImageEdit() {
      const image = selectedInsertedImage();
      if (!image) return;
      Object.assign(image, { cropEnabled: false, cropX: 50, cropY: 50, cropScale: 1, cornerRadius: 0 });
      if (imageCropEditId === image.id) imageCropEditId = "";
      commit("Reset the inserted image crop and corners.");
    }

    function setMediaFit(value) {
      currentSlide().media.fit = ["match", "contain", "cover"].includes(value) ? value : "contain";
      commit(`Set media to ${value}.`);
    }

    function nudgeMedia(dx, dy) {
      const media = currentSlide().media;
      media.x = clamp(media.x + dx, -40, 40);
      media.y = clamp(media.y + dy, -40, 40);
      commit("Moved main media.");
    }

    function nudgeSelectedObjects(dx, dy) {
      const entries = selectedObjects().filter(({ item }) => !item.locked);
      if (!entries.length) return;
      entries.forEach(({ item }) => {
        const minX = item.type ? STAGE_ANNOTATION_MIN_X : STAGE_OBJECT_MIN_POSITION;
        const maxX = item.type ? STAGE_ANNOTATION_MAX_X : STAGE_OBJECT_MAX_POSITION;
        item.x = clamp((Number(item.x) || 0) + dx, minX, maxX);
        item.y = clamp((Number(item.y) || 0) + dy, STAGE_OBJECT_MIN_POSITION, STAGE_OBJECT_MAX_POSITION);
        fitStageObjectBounds(item);
        const element = root.querySelector(`[data-object][data-id="${CSS.escape(item.id)}"]`);
        if (element) element.style.cssText = objectStyle(item);
        if (item.type === "clip-frame") applyLiveClipFrameScene(item);
      });
      recordUndoStep();
      scheduleSave();
    }

    function zoomMedia(amount) {
      currentSlide().media.scale = clamp(currentSlide().media.scale + amount, MEDIA_MIN_SCALE, MEDIA_MAX_SCALE);
      commit("Resized main media.");
    }

    function resetMedia() {
      Object.assign(currentSlide().media, { x: 0, y: 0, scale: 1 });
      commit("Reset main media.");
    }

    function demoSlideDurationMs(slide = currentSlide()) {
      const seconds = slide?.demo?.manualDuration !== null && slide?.demo?.manualDuration !== undefined
        ? slide.demo.manualDuration
        : state.meta.demoDefaultDuration;
      return clamp(Number(seconds) || DEMO_DEFAULT_DURATION, DEMO_MIN_DURATION, DEMO_MAX_DURATION) * 1000;
    }

    function syncDemoAudioTiming(slide = currentSlide()) {
      const hasAudio = Boolean(String(slide?.demo?.audioUrl || "").trim());
      const hasManualOverride = slide?.demo?.manualDuration !== null
        && slide?.demo?.manualDuration !== undefined
        && slide?.demo?.manualDuration !== "";
      slide.demo.timing = hasManualOverride ? "manual" : hasAudio ? "audio" : "default";
      const timingSelect = root.querySelector("#demoTimingMode");
      if (timingSelect) timingSelect.value = slide.demo.timing;
      const durationInput = root.querySelector("#demoSlideDuration");
      if (durationInput) durationInput.disabled = slide.demo.timing !== "manual";
    }

    function demoSlideProgress() {
      if (!demoStarted) return 0;
      const slide = currentSlide();
      if (slide?.demo?.timing === "audio" && demoAudio && Number.isFinite(demoAudio.duration) && demoAudio.duration > 0) {
        return clamp(demoAudio.currentTime / demoAudio.duration, 0, 1);
      }
      if (demoTotalMs <= 0) return 0;
      const remaining = demoPlaying && demoDeadline
        ? Math.max(0, demoDeadline - performance.now())
        : demoRemainingMs;
      return clamp(1 - (remaining / demoTotalMs), 0, 1);
    }

    function demoOverallProgress() {
      if (demoFinished) return 100;
      const count = Math.max(1, state.tutorial.slides.length);
      return clamp(((state.ui.slideIndex + demoSlideProgress()) / count) * 100, 0, 100).toFixed(1);
    }

    function formatDemoTime(seconds) {
      const value = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(value / 60);
      const remainder = Math.floor(value % 60);
      return `${minutes}:${String(remainder).padStart(2, "0")}`;
    }

    function demoProgressText() {
      return `${Math.round(Number(demoOverallProgress()))}% complete`;
    }

    function updateDemoPlaybackUi() {
      if (!IS_DEMO_PLAYER || demoSeekPreview !== null) return;
      const seek = root.querySelector("[data-demo-seek]");
      const toggle = root.querySelector('[data-action="demo-toggle"]');
      const value = String(demoOverallProgress());
      const text = demoProgressText();
      if (seek) {
        seek.value = value;
        seek.setAttribute("aria-valuetext", text);
      }
      if (toggle) {
        const playLabel = demoStarted && demoPlaying ? "Pause" : demoFinished ? "Replay" : "Play";
        toggle.innerHTML = icon(demoStarted && demoPlaying ? "pause" : "play");
        toggle.setAttribute("title", playLabel);
        toggle.setAttribute("aria-label", `${playLabel} demo`);
        toggle.setAttribute("aria-pressed", String(demoStarted && demoPlaying));
      }
    }

    function clearDemoTimers() {
      window.clearTimeout(demoTimer);
      window.clearInterval(demoProgressTimer);
      demoTimer = 0;
      demoProgressTimer = 0;
      demoDeadline = 0;
    }

    function ensureDemoAudio() {
      if (!demoAudio) {
        demoAudio = new Audio();
        demoAudio.preload = "metadata";
      }
      return demoAudio;
    }

    function primeDemoAudio() {
      if (demoAudioPrimed) return;
      const audioSlide = state.tutorial.slides.find((slide) => String(slide?.demo?.audioUrl || "").trim());
      const url = String(audioSlide?.demo?.audioUrl || "").trim();
      if (!url) return;
      const audio = ensureDemoAudio();
      let absoluteUrl = url;
      try { absoluteUrl = new URL(url, location.href).href; } catch (_) {}
      audio.pause();
      audio.src = absoluteUrl;
      audio.muted = true;
      audio.load();
      let settled = false;
      demoAudioPrimePromise = new Promise((resolve) => {
        const finish = (primed) => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timeout);
          audio.pause();
          try { audio.currentTime = 0; } catch (_) {}
          audio.muted = false;
          demoAudioPrimed = primed;
          resolve();
        };
        const timeout = window.setTimeout(() => finish(false), 1500);
        try {
          const playRequest = audio.play();
          if (playRequest && typeof playRequest.then === "function") playRequest.then(() => finish(true)).catch(() => finish(false));
          else finish(true);
        } catch (_) {
          finish(false);
        }
      });
    }

    function prepareDemoAudio(slide, fraction = 0, resume = false) {
      const url = String(slide?.demo?.audioUrl || "").trim();
      if (!url) return null;
      const audio = ensureDemoAudio();
      let absoluteUrl = url;
      try { absoluteUrl = new URL(url, location.href).href; } catch (_) {}
      if (!resume || audio.src !== absoluteUrl) {
        audio.pause();
        audio.src = absoluteUrl;
        audio.load();
      }
      const applyFraction = () => {
        if (fraction > 0 && Number.isFinite(audio.duration) && audio.duration > 0) {
          audio.currentTime = clamp(fraction, 0, .999) * audio.duration;
        } else if (!resume && fraction <= 0) {
          audio.currentTime = 0;
        }
        if (slide.demo.timing === "audio" && Number.isFinite(audio.duration) && audio.duration > 0) {
          demoTotalMs = audio.duration * 1000;
          demoRemainingMs = Math.max(0, (audio.duration - audio.currentTime) * 1000);
        }
        updateDemoPlaybackUi();
      };
      if (audio.readyState >= 1) applyFraction();
      else audio.addEventListener("loadedmetadata", applyFraction, { once: true });
      return audio;
    }

    function scheduleDemoTimer(milliseconds) {
      const delay = Math.max(0, Number(milliseconds) || 0);
      window.clearTimeout(demoTimer);
      demoRemainingMs = delay;
      demoDeadline = performance.now() + delay;
      demoTimer = window.setTimeout(advanceDemoPlayback, delay);
    }

    function startDemoProgressTicker() {
      window.clearInterval(demoProgressTimer);
      demoProgressTimer = window.setInterval(updateDemoPlaybackUi, 120);
      updateDemoPlaybackUi();
    }

    async function startDemoSlidePlayback({ fraction = 0, resume = false } = {}) {
      if (!IS_DEMO_PLAYER || !demoPlaying) return;
      const playbackRequest = ++demoPlaybackRequest;
      clearDemoTimers();
      const slide = currentSlide();
      const slideId = slide.id;
      await playerVisualReadyPromise;
      if (!IS_DEMO_PLAYER || !demoPlaying || playbackRequest !== demoPlaybackRequest || currentSlide()?.id !== slideId) return;
      await demoAudioPrimePromise;
      if (!IS_DEMO_PLAYER || !demoPlaying || playbackRequest !== demoPlaybackRequest || currentSlide()?.id !== slideId) return;
      const timing = slide.demo.timing;
      if (resume && demoAudioEndDelayActive) {
        scheduleDemoTimer(demoRemainingMs || DEMO_AUDIO_END_DELAY_MS);
        startDemoProgressTicker();
        return;
      }
      if (!resume) demoAudioEndDelayActive = false;
      if (!resume) {
        demoTotalMs = demoSlideDurationMs(slide);
        demoRemainingMs = demoTotalMs * (1 - clamp(fraction, 0, .999));
      }
      const audio = prepareDemoAudio(slide, fraction, resume);
      if (audio) {
        const slideId = slide.id;
        audio.onended = () => {
          if (demoPlaying && currentSlide()?.id === slideId && timing === "audio") {
            demoAudioEndDelayActive = true;
            scheduleDemoTimer(DEMO_AUDIO_END_DELAY_MS);
          }
        };
        audio.onerror = () => {
          if (!demoPlaying || currentSlide()?.id !== slideId) return;
          demoAudioEndDelayActive = false;
          if (timing === "audio") {
            demoTotalMs = demoSlideDurationMs(slide);
            scheduleDemoTimer(demoTotalMs * (1 - clamp(fraction, 0, .999)));
          }
          updateDemoPlaybackUi();
        };
        audio.play().catch(() => {
          demoAudioEndDelayActive = false;
          if (timing === "audio" && demoPlaying) {
            demoTotalMs = demoSlideDurationMs(slide);
            scheduleDemoTimer(demoRemainingMs || demoTotalMs);
          }
          updateDemoPlaybackUi();
        });
      }
      if (timing !== "audio" || !audio) scheduleDemoTimer(demoRemainingMs || demoTotalMs);
      startDemoProgressTicker();
    }

    function stopDemoSlidePlayback({ captureRemaining = true } = {}) {
      demoPlaybackRequest += 1;
      if (captureRemaining && demoDeadline) demoRemainingMs = Math.max(0, demoDeadline - performance.now());
      clearDemoTimers();
      if (demoAudio) {
        demoAudio.pause();
        demoAudio.onended = null;
        demoAudio.onerror = null;
      }
      root.querySelectorAll("[data-main-video]").forEach((video) => video.pause());
    }

    function pauseDemoPlayback() {
      if (!demoStarted || !demoPlaying) return;
      demoPlaying = false;
      stopDemoSlidePlayback({ captureRemaining: true });
      updateDemoPlaybackUi();
    }

    function resumeDemoPlayback() {
      if (!demoStarted || demoPlaying) return;
      if (demoFinished) {
        restartDemoPlayback();
        return;
      }
      primeDemoAudio();
      demoPlaying = true;
      startDemoSlidePlayback({ resume: true });
      updateDemoPlaybackUi();
    }

    function setDemoSlide(index, { fraction = 0, play = demoPlaying } = {}) {
      stopDemoSlidePlayback();
      demoAudioEndDelayActive = false;
      state.ui.slideIndex = clamp(index, 0, state.tutorial.slides.length - 1);
      const slide = currentSlide();
      state.ui.activeHotspotId = slideIntroCard(slide) ? null : slide.hotspots[0]?.id || null;
      state.ui.selectedKind = null;
      state.ui.selectedId = null;
      state.ui.contentsOpen = false;
      state.ui.videoModalId = null;
      demoFinished = false;
      demoPlaying = Boolean(play);
      demoTotalMs = demoSlideDurationMs(slide);
      demoRemainingMs = demoTotalMs * (1 - clamp(fraction, 0, .999));
      render();
      if (demoPlaying) startDemoSlidePlayback({ fraction });
      else prepareDemoAudio(slide, fraction, false);
      updateDemoPlaybackUi();
    }

    function advanceDemoPlayback() {
      stopDemoSlidePlayback();
      demoAudioEndDelayActive = false;
      if (state.ui.slideIndex >= state.tutorial.slides.length - 1) {
        demoFinished = true;
        demoPlaying = false;
        demoRemainingMs = 0;
        updateDemoPlaybackUi();
        return;
      }
      setDemoSlide(state.ui.slideIndex + 1, { fraction: 0, play: true });
    }

    function restartDemoPlayback() {
      demoStarted = true;
      demoFinished = false;
      demoPlaying = true;
      primeDemoAudio();
      setDemoSlide(0, { fraction: 0, play: true });
    }

    function toggleDemoPlayback() {
      if (!demoStarted || demoFinished) restartDemoPlayback();
      else if (demoPlaying) pauseDemoPlayback();
      else resumeDemoPlayback();
    }

    function previewDemoSeek(value) {
      const preview = clamp(Number(value), 0, 100);
      if (demoSeekPreview === null) {
        demoSeekResumeAfter = demoPlaying;
        demoSeekPreview = preview;
        pauseDemoPlayback();
      } else {
        demoSeekPreview = preview;
      }
    }

    function commitDemoSeek(value) {
      const percent = clamp(Number(value), 0, 100);
      const count = Math.max(1, state.tutorial.slides.length);
      const position = percent >= 100 ? count - Number.EPSILON : (percent / 100) * count;
      const index = Math.min(count - 1, Math.floor(position));
      const fraction = clamp(position - index, 0, .999);
      const shouldResume = demoSeekResumeAfter;
      demoSeekPreview = null;
      demoSeekResumeAfter = false;
      demoStarted = true;
      setDemoSlide(index, { fraction, play: shouldResume });
    }

    function readerNext() {
      if (MODE === "builder") stopSlideNarrationPreview();
      if (IS_DEMO_PLAYER) {
        const slide = currentSlide();
        const index = slide.hotspots.findIndex((item) => item.id === state.ui.activeHotspotId);
        if (slide.hotspots.length && index < slide.hotspots.length - 1) {
          state.ui.activeHotspotId = slide.hotspots[Math.max(0, index + 1)].id;
          render();
          drawAttentionToHotspot(state.ui.activeHotspotId);
          updateDemoPlaybackUi();
        } else if (state.ui.slideIndex < state.tutorial.slides.length - 1) {
          setDemoSlide(state.ui.slideIndex + 1, { play: demoPlaying });
        }
        return;
      }
      const slide = currentSlide();
      if (slide.hotspots.length) {
        const index = slide.hotspots.findIndex((item) => item.id === state.ui.activeHotspotId);
        if (index < slide.hotspots.length - 1) {
          stopAudio();
          const nextHotspotId = slide.hotspots[index + 1].id;
          state.ui.activeHotspotId = nextHotspotId;
          state.ui.selectedKind = null;
          state.ui.selectedId = null;
          multiSelection = [];
          render();
          drawAttentionToHotspot(nextHotspotId);
          return;
        }
      }
      if (state.ui.slideIndex < state.tutorial.slides.length - 1) jumpSlide(state.ui.slideIndex + 1);
    }

    function readerBack() {
      if (MODE === "builder") stopSlideNarrationPreview();
      if (IS_DEMO_PLAYER) {
        const slide = currentSlide();
        const index = slide.hotspots.findIndex((item) => item.id === state.ui.activeHotspotId);
        if (index === 0 && slideIntroCard(slide)) {
          state.ui.activeHotspotId = null;
          render();
          updateDemoPlaybackUi();
        } else if (index > 0) {
          state.ui.activeHotspotId = slide.hotspots[index - 1].id;
          render();
          drawAttentionToHotspot(state.ui.activeHotspotId);
          updateDemoPlaybackUi();
        } else if (state.ui.slideIndex > 0) {
          setDemoSlide(state.ui.slideIndex - 1, { play: demoPlaying });
          const previous = currentSlide();
          if (previous.hotspots.length) {
            state.ui.activeHotspotId = previous.hotspots[previous.hotspots.length - 1].id;
            render();
            updateDemoPlaybackUi();
          }
        }
        return;
      }
      const slide = currentSlide();
      if (slide.hotspots.length) {
        const index = slide.hotspots.findIndex((item) => item.id === state.ui.activeHotspotId);
        if (index === 0 && slideIntroCard(slide)) {
          stopAudio();
          state.ui.activeHotspotId = null;
          state.ui.selectedKind = null;
          state.ui.selectedId = null;
          multiSelection = [];
          render();
          return;
        }
        if (index > 0) {
          stopAudio();
          const previousHotspotId = slide.hotspots[index - 1].id;
          state.ui.activeHotspotId = previousHotspotId;
          state.ui.selectedKind = null;
          state.ui.selectedId = null;
          multiSelection = [];
          render();
          drawAttentionToHotspot(previousHotspotId);
          return;
        }
      }
      if (state.ui.slideIndex > 0) {
        jumpSlide(state.ui.slideIndex - 1, true);
      }
    }

    function jumpSlide(index, useLastHotspot = false) {
      if (MODE === "builder") stopSlideNarrationPreview();
      if (IS_DEMO_PLAYER) {
        const shouldResume = demoPlaying || demoMenuResumeAfter;
        demoMenuResumeAfter = false;
        demoStarted = true;
        setDemoSlide(index, { play: shouldResume });
        return;
      }
      stopAudio();
      state.ui.slideIndex = clamp(index, 0, state.tutorial.slides.length - 1);
      const slide = currentSlide();
      const lastHotspot = slide.hotspots[slide.hotspots.length - 1];
      state.ui.activeHotspotId = useLastHotspot
        ? lastHotspot?.id || null
        : slideIntroCard(slide)
          ? null
          : slide.hotspots[0]?.id || null;
      state.ui.selectedKind = null;
      state.ui.selectedId = null;
      multiSelection = [];
      state.ui.contentsOpen = false;
      state.ui.videoModalId = null;
      render();
      drawAttentionToHotspot(state.ui.activeHotspotId);
    }

    function saveContentsSlideName(index) {
      if (MODE !== "builder" || index <= 0 || index >= state.tutorial.slides.length) return;
      const slide = state.tutorial.slides[index];
      const nextTitle = String(root.querySelector(`[data-contents-slide-name][data-index="${index}"]`)?.value || "");
      slide.title = nextTitle.trim() || defaultSlideTitle(slide);
      state.ui.contentsOpen = true;
      commit(nextTitle.trim() ? `Renamed page ${index + 1}.` : `Reset page ${index + 1} name.`);
    }

    function manageContentsSlide(index, operation, direction = 0) {
      if (MODE !== "builder" || index <= 0 || index >= state.tutorial.slides.length) return;
      stopAudio();
      stopSlideNarrationPreview();
      slideNarrationPanelSlideId = "";
      state.ui.slideIndex = index;
      const slide = currentSlide();
      state.ui.activeHotspotId = slideIntroCard(slide) ? null : slide.hotspots[0]?.id || null;
      state.ui.selectedKind = null;
      state.ui.selectedId = null;
      multiSelection = [];
      state.ui.contentsOpen = true;
      if (operation === "duplicate") duplicateSlide();
      else if (operation === "move") moveSlide(direction < 0 ? -1 : 1);
      else if (operation === "delete") deleteSlide();
    }

    function openContents(trigger) {
      if (IS_DEMO_PLAYER) {
        demoMenuResumeAfter = demoPlaying;
        pauseDemoPlayback();
      }
      state.ui.contentsOpen = true;
      render();
      setTimeout(() => document.querySelector(".contents-card.is-active")?.focus(), 0);
    }

    function closeContents() {
      const shouldResume = IS_DEMO_PLAYER && demoMenuResumeAfter;
      demoMenuResumeAfter = false;
      state.ui.contentsOpen = false;
      render();
      if (shouldResume) resumeDemoPlayback();
      setTimeout(() => root.querySelector('[data-action="open-contents"]')?.focus(), 0);
    }

    function openVideo(id) {
      const annotation = currentSlide().annotations.find((item) => item.id === id && item.type === "video");
      if (!annotation?.url) {
        showToast("Add the video URL first.");
        return;
      }
      if (IS_DEMO_PLAYER) pauseDemoPlayback();
      lastVideoTriggerId = id;
      state.ui.videoModalId = id;
      render();
      setTimeout(() => document.querySelector('[data-action="close-video"]')?.focus(), 0);
    }

    function closeVideo() {
      const triggerId = lastVideoTriggerId;
      const video = document.getElementById("videoModalMedia");
      if (video) {
        video.pause();
        video.currentTime = 0;
      }
      state.ui.videoModalId = null;
      render();
      setTimeout(() => {
        if (triggerId) root.querySelector(`[data-object][data-id="${CSS.escape(triggerId)}"]`)?.focus();
      }, 0);
    }

    async function toggleVideo() {
      const video = document.getElementById("videoModalMedia");
      if (!video) return;
      if (video.paused) {
        try {
          await video.play();
        } catch (_) {
          showToast("The browser could not start this video.");
        }
      } else {
        video.pause();
      }
      updateDirectVideoControls();
    }

    async function toggleMainVideo() {
      const video = root.querySelector("[data-main-video]");
      if (!video) return;
      if (video.paused) {
        if (Number.isFinite(video.duration) && video.currentTime >= video.duration) video.currentTime = 0;
        try {
          await video.play();
        } catch (_) {
          showToast("The browser could not start this video.");
        }
      } else {
        video.pause();
      }
      updateMainVideoControls(video);
    }

    function openLink(url) {
      if (!url) return;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function stopSlideNarrationPreview() {
      if (slideNarrationPreviewAudio) {
        slideNarrationPreviewAudio.pause();
        try { slideNarrationPreviewAudio.currentTime = 0; } catch (_) {}
      }
      slideNarrationPreviewAudio = null;
      slideNarrationPreviewSlideId = "";
      slideNarrationPreviewPlaying = false;
    }

    function toggleSlideNarrationPanel() {
      const slide = currentSlide();
      slideNarrationPanelSlideId = slideNarrationPanelSlideId === slide.id ? "" : slide.id;
      render();
      if (slideNarrationPanelSlideId) {
        setTimeout(() => root.querySelector(".slide-narration-popover button")?.focus(), 0);
      }
    }

    function removeSlideNarrationAudio() {
      const slide = currentSlide();
      if (!String(slide.demo?.audioUrl || "").trim()) return;
      if (!window.confirm("Remove the narration audio from this slide?\n\nThe audio file itself will not be deleted.")) return;
      stopSlideNarrationPreview();
      slide.demo.audioUrl = "";
      syncDemoAudioTiming(slide);
      slideNarrationPanelSlideId = "";
      commit("Removed narration audio from this slide.");
    }

    async function toggleSlideNarrationPreview() {
      const slide = currentSlide();
      const url = String(slide?.demo?.audioUrl || "").trim();
      if (!url) {
        showToast("Choose slide narration audio first.");
        return;
      }
      if (slideNarrationPreviewAudio
          && slideNarrationPreviewSlideId === slide.id
          && slideNarrationPreviewPlaying) {
        slideNarrationPreviewAudio.pause();
        slideNarrationPreviewPlaying = false;
        render();
        return;
      }
      if (!slideNarrationPreviewAudio || slideNarrationPreviewSlideId !== slide.id) {
        stopSlideNarrationPreview();
        const audio = new Audio();
        audio.preload = "auto";
        audio.src = url;
        slideNarrationPreviewAudio = audio;
        slideNarrationPreviewSlideId = slide.id;
        audio.addEventListener("ended", () => {
          if (slideNarrationPreviewAudio !== audio) return;
          slideNarrationPreviewPlaying = false;
          try { audio.currentTime = 0; } catch (_) {}
          render();
        });
        audio.addEventListener("error", () => {
          if (slideNarrationPreviewAudio !== audio) return;
          stopSlideNarrationPreview();
          render();
          showToast("The slide narration audio could not be played. Check the uploaded audio file.");
        });
      }
      const audio = slideNarrationPreviewAudio;
      try {
        audio.currentTime = 0;
        await audio.play();
        if (slideNarrationPreviewAudio !== audio || currentSlide()?.id !== slide.id) {
          audio.pause();
          return;
        }
        slideNarrationPreviewPlaying = true;
        render();
      } catch (_) {
        slideNarrationPreviewPlaying = false;
        render();
        showToast("The browser could not start this slide narration audio.");
      }
    }

    function stopAudio() {
      if (window.__tutorialAudio) {
        window.__tutorialAudio.pause();
        window.__tutorialAudio.currentTime = 0;
      }
      activeAudio = null;
      audioPlaying = false;
    }

    function rewindAudio(id) {
      if (window.__tutorialAudio && activeAudio === id) window.__tutorialAudio.currentTime = 0;
      else {
        const annotation = currentSlide().annotations.find((item) => item.id === id);
        if (!annotation?.url) return;
        stopAudio();
        window.__tutorialAudio = createTutorialAudio(annotation.url, id);
        activeAudio = id;
        audioPlaying = false;
        window.__tutorialAudio.currentTime = 0;
      }
      render();
    }

    function createTutorialAudio(url, id) {
      const audio = new Audio();
      audio.preload = "metadata";
      audio.crossOrigin = "anonymous";
      audio.src = normalizeHostedAnnotationUrl("audio", url);
      const updateTimeline = () => {
        if (window.__tutorialAudio === audio && activeAudio === id) updateAudioTimeline(id);
      };
      audio.addEventListener("loadedmetadata", updateTimeline);
      audio.addEventListener("durationchange", updateTimeline);
      audio.addEventListener("timeupdate", updateTimeline);
      audio.addEventListener("ended", () => {
        if (window.__tutorialAudio !== audio || activeAudio !== id) return;
        activeAudio = null;
        audioPlaying = false;
        render();
      });
      return audio;
    }

    function updateAudioTimeline(id) {
      const audio = window.__tutorialAudio;
      const timeline = root.querySelector(`[data-audio-timeline][data-id="${CSS.escape(id)}"]`);
      if (!audio || activeAudio !== id || !timeline) return;
      const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
      const currentTime = clamp(audio.currentTime, 0, duration);
      timeline.max = String(duration);
      timeline.value = String(currentTime);
      timeline.setAttribute("aria-valuetext", `${formatVideoTime(currentTime)} of ${formatVideoTime(duration)}`);
    }

    function audioFailureMessage(audio) {
      const code = audio?.error?.code || 0;
      if (code === 2) return "Audio could not load because of a network error. Check the direct file URL.";
      if (code === 3) return "The browser could not decode this audio file.";
      if (code === 4) return "Audio URL did not return a supported audio file. Check the hosted path.";
      return "The browser could not start this audio. Check that the URL opens the audio file directly.";
    }

    async function toggleAudio(id) {
      const annotation = currentSlide().annotations.find((item) => item.id === id);
      if (!annotation?.url) return;
      if (!window.__tutorialAudio || activeAudio !== id) {
        stopAudio();
        window.__tutorialAudio = createTutorialAudio(annotation.url, id);
        activeAudio = id;
        audioPlaying = false;
      }
      if (window.__tutorialAudio.paused) {
        try {
          await window.__tutorialAudio.play();
          audioPlaying = true;
        } catch (_) {
          audioPlaying = false;
          showToast(audioFailureMessage(window.__tutorialAudio));
        }
      } else {
        window.__tutorialAudio.pause();
        audioPlaying = false;
      }
      render();
      if (audioPlaying) updateAudioTimeline(id);
    }

    async function resetBuilder() {
      const resetLabel = currentProject?.name ? `Reset ${currentProject.name}?` : "Reset this V2 builder?";
      const resetDetail = IS_PROJECT_APP
        ? " This clears only this named draft; your other drafts are not changed."
        : " This clears only this builder's saved browser draft.";
      if (!confirm(`${resetLabel}${resetDetail}`)) return;
      if (IS_PROJECT_APP && currentProject) {
        state = clone(embeddedProjectState());
        prepareLoadedState();
        render();
        const saved = await saveProjectToDiskNow();
        showToast(saved ? `Reset ${currentProject.name}.` : draftStorageError);
        return;
      }
      try {
        localStorage.removeItem(STORAGE_KEY);
        OBSOLETE_STORAGE_KEYS.forEach((key) => localStorage.removeItem(key));
      } catch (error) {
        draftStorageError = `Could not reset this browser draft: ${error?.message || "storage access failed"}`;
        draftSavePhase = "error";
        updateDraftSaveStatus();
        showToast(draftStorageError);
        return;
      }
      location.reload();
    }

    async function saveEditableCopy() {
      const saved = IS_PROJECT_APP ? await saveProjectToDiskNow() : saveStateNow();
      const builderState = clone(state);
      const documentElement = document.documentElement.cloneNode(true);
      const builderBody = documentElement.querySelector("body");
      builderBody.dataset.mode = "builder";
      builderBody.removeAttribute("data-demo-player");
      builderBody.removeAttribute("data-demo-embed");
      documentElement.querySelector("#app").innerHTML = "";
      documentElement.querySelector("#project-state").textContent = JSON.stringify(builderState, null, 2).replace(/<\/script/gi, "<\\/script");
      documentElement.querySelectorAll(".toast").forEach((node) => node.remove());
      const html = `<!DOCTYPE html>\n${documentElement.outerHTML}`;
      download(editableCopyFilename(), html, "text/html");
      showToast(saved
        ? "Saved an editable demo-builder copy with the latest draft embedded."
        : "Saved an editable demo-builder copy because browser autosave is unavailable.");
    }

    function metadataForExport(exportState) {
      const cover = exportState.tutorial.slides[0];
      const title = exportState.meta.socialTitle || exportState.tutorial.title || "Magic Hashtags Tutorial";
      const description = exportState.meta.socialDescription || exportState.meta.summary || cover?.description || "An interactive tutorial from Magic Hashtags.";
      const image = exportState.meta.socialImage || cover?.media?.url || SITE_HEADER_LOGO_URL;
      return { title, description, image, alt: exportState.meta.socialImageAlt || `${title} tutorial preview`, url: publicUrl(exportState.meta) };
    }

    function applyHeadMetadata(documentElement, exportState) {
      const head = documentElement.querySelector("head");
      const metadata = metadataForExport(exportState);
      head.querySelector("title").textContent = `${metadata.title} | Magic Hashtags`;
      setMeta(head, "name", "description", metadata.description);
      setMeta(head, "property", "og:type", "website");
      setMeta(head, "property", "og:site_name", "Magic Hashtags");
      setMeta(head, "property", "og:title", metadata.title);
      setMeta(head, "property", "og:description", metadata.description);
      setMeta(head, "property", "og:url", metadata.url);
      setMeta(head, "property", "og:image", metadata.image);
      setMeta(head, "property", "og:image:alt", metadata.alt);
      setMeta(head, "name", "twitter:card", "summary_large_image");
      setMeta(head, "name", "twitter:title", metadata.title);
      setMeta(head, "name", "twitter:description", metadata.description);
      setMeta(head, "name", "twitter:image", metadata.image);
      setMeta(head, "name", "twitter:image:alt", metadata.alt);
      let canonical = head.querySelector('link[rel="canonical"]');
      if (!canonical) {
        canonical = documentElement.ownerDocument.createElement("link");
        canonical.rel = "canonical";
        head.append(canonical);
      }
      canonical.href = metadata.url;
    }

    function setMeta(head, attribute, key, content) {
      let node = head.querySelector(`meta[${attribute}="${key}"]`);
      if (!node) {
        node = head.ownerDocument.createElement("meta");
        node.setAttribute(attribute, key);
        head.append(node);
      }
      node.content = content;
    }

    function applyExportFont(documentElement) {
      const fontUrl = "/fonts/hanken-grotesk-latin.woff2";
      const absoluteFontUrl = "https://magichashtags.com/fonts/hanken-grotesk-latin.woff2";
      const italicFontUrl = "/fonts/hanken-grotesk-latin-italic.woff2";
      const absoluteItalicFontUrl = "https://magichashtags.com/fonts/hanken-grotesk-latin-italic.woff2";
      const impactLabelUrl = "/fonts/Impact_Label_Reversed.ttf";
      const absoluteImpactLabelUrl = "https://magichashtags.com/fonts/Impact_Label_Reversed.ttf";
      const preload = documentElement.querySelector("#hanken-grotesk-preload");
      const impactLabelPreload = documentElement.querySelector("#impact-label-reversed-preload");
      const fontFace = documentElement.querySelector("#hanken-grotesk-font-face");
      const impactLabelFontFace = documentElement.querySelector("#impact-label-reversed-font-face");
      if (preload) preload.setAttribute("href", fontUrl);
      if (impactLabelPreload) impactLabelPreload.setAttribute("href", impactLabelUrl);
      if (fontFace) {
        fontFace.textContent = `
    @font-face {
      font-family: "Hanken Grotesk";
      src:
        url("${fontUrl}") format("woff2"),
        url("${absoluteFontUrl}") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: "Hanken Grotesk";
      src:
        url("${italicFontUrl}") format("woff2"),
        url("${absoluteItalicFontUrl}") format("woff2");
      font-style: italic;
      font-weight: 100 900;
      font-display: swap;
    }
  `;
      }
      if (impactLabelFontFace) {
        impactLabelFontFace.textContent = `
    @font-face {
      font-family: "Impact Label Reversed";
      src:
        url("${impactLabelUrl}") format("truetype"),
        url("${absoluteImpactLabelUrl}") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: block;
    }
  `;
      }
    }

    async function waitForExportFonts() {
      await Promise.race([
        Promise.all([
          document.fonts?.load('16px "Hanken Grotesk"') || Promise.resolve(),
          document.fonts?.load('16px "Impact Label Reversed"') || Promise.resolve(),
          document.fonts?.ready || Promise.resolve()
        ]),
        new Promise((resolve) => setTimeout(resolve, 2000))
      ]);
    }

    async function buildExportHtml(mode = "demo") {
      const exportMode = mode === "tutorial" ? "tutorial" : "demo";
      const isDemoExport = exportMode === "demo";
      await waitForExportFonts();
      if (MODE === "builder") {
        syncLiveEditableBeforeRender();
        render();
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }
      fitRenderedTextCardsToContent();
      await new Promise((resolve) => requestAnimationFrame(resolve));
      fitRenderedTextCardsToContent();
      if (IS_PROJECT_APP) await saveProjectToDiskNow();
      const exportState = clone(state);
      exportState.meta.pageType = exportMode;
      exportState.ui = {
        slideIndex: 0,
        activeHotspotId: exportState.tutorial.slides[0]?.annotations?.some((item) => item.type === "slide-intro")
          ? null
          : exportState.tutorial.slides[0]?.hotspots[0]?.id || null,
        selectedKind: null,
        selectedId: null,
        contentsOpen: false,
        videoModalId: null
      };
      const documentElement = document.documentElement.cloneNode(true);
      const exportBody = documentElement.querySelector("body");
      exportBody.dataset.mode = "player";
      if (isDemoExport) exportBody.dataset.demoPlayer = "true";
      else exportBody.removeAttribute("data-demo-player");
      exportBody.removeAttribute("data-demo-embed");
      documentElement.querySelector("#png-export-runtime")?.remove();
      documentElement.querySelector("#app").innerHTML = "";
      documentElement.querySelector("#project-state").textContent = JSON.stringify(exportState, null, 2).replace(/<\/script/gi, "<\\/script");
      documentElement.querySelectorAll(".toast").forEach((node) => node.remove());
      applyExportFont(documentElement);
      applyHeadMetadata(documentElement, exportState);
      setMeta(documentElement.querySelector("head"), "name", "robots", isDemoExport ? "noindex, nofollow" : "index, follow");
      const html = `<!DOCTYPE html>\n${documentElement.outerHTML}`;
      const stem = slugify(state.meta.tutorialSlug || state.tutorial.title) || "tutorial";
      return { html, stem, isDemoExport };
    }

    async function previewDemo() {
      showToast("Preparing the current demo preview…");
      try {
        const { html } = await buildExportHtml("demo");
        demoPreviewHtml = html;
        demoPreviewOpen = true;
        render();
        setTimeout(() => root.querySelector('[data-action="close-demo-preview"]')?.focus(), 0);
        showToast("Previewing the current demo. No file was exported.");
      } catch (error) {
        showToast("The demo preview could not be prepared.");
      }
    }

    function closeDemoPreview() {
      demoPreviewOpen = false;
      demoPreviewHtml = "";
      render();
      setTimeout(() => root.querySelector('[data-action="preview-demo"]')?.focus(), 0);
    }

    async function exportHtml(mode = "demo") {
      const { html, stem, isDemoExport } = await buildExportHtml(mode);
      download(`${stem}${isDemoExport ? "-demo" : ""}.html`, html, "text/html");
	    showToast(isDemoExport
        ? "Exported the compact autoplay demo HTML for the Reporter Tools modal."
        : "Exported the full-page standalone tutorial HTML with website navigation.");
    }

    function blobAsDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(reader.error || new Error("Could not read media for PNG export."));
        reader.readAsDataURL(blob);
      });
    }

    async function inlinePngExportImages(source, cloneRoot) {
      const sourceImages = [...source.querySelectorAll("img")];
      const cloneImages = [...cloneRoot.querySelectorAll("img")];
      await Promise.all(cloneImages.map(async (image, index) => {
        const sourceImage = sourceImages[index];
        const src = sourceImage?.currentSrc || sourceImage?.src || image.src;
        if (!src || src.startsWith("data:")) return;
        try {
          const response = await fetch(src, { mode: "cors", credentials: "omit", signal: AbortSignal.timeout(5000) });
          if (!response.ok) throw new Error(`image request returned ${response.status}`);
          image.src = await blobAsDataUrl(await response.blob());
        } catch (_) {
          image.removeAttribute("src");
          image.alt = image.alt || "Image unavailable in PNG export";
        }
      }));

      const sourceVideos = [...source.querySelectorAll("video")];
      const cloneVideos = [...cloneRoot.querySelectorAll("video")];
      cloneVideos.forEach((video, index) => {
        const sourceVideo = sourceVideos[index];
        const replacement = document.createElement("div");
        replacement.className = video.className;
        replacement.setAttribute("aria-label", video.getAttribute("aria-label") || "Video slide");
        replacement.style.cssText = "width:100%;height:100%;background:#d7d7d7;";
        if (sourceVideo?.videoWidth && sourceVideo?.videoHeight) {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = sourceVideo.videoWidth;
            canvas.height = sourceVideo.videoHeight;
            canvas.getContext("2d").drawImage(sourceVideo, 0, 0);
            const image = document.createElement("img");
            image.src = canvas.toDataURL("image/png");
            image.alt = video.getAttribute("aria-label") || "Video frame";
            image.style.cssText = "width:100%;height:100%;object-fit:contain;";
            video.replaceWith(image);
            return;
          } catch (_) {}
        }
        video.replaceWith(replacement);
      });
    }

    async function elementAsPngBlob(element, outputWidth = 1500) {
      if (typeof window.html2canvas !== "function") {
        throw new Error("The local PNG renderer did not load.");
      }
      const rect = element.getBoundingClientRect();
      const scale = outputWidth / Math.max(1, rect.width);
      const canvas = await window.html2canvas(element, {
        backgroundColor: "#ffffff",
        scale,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 8000,
        onclone: (clonedDocument) => {
          const cloneRoot = clonedDocument.querySelector(".tutorial-shell");
          cloneRoot?.querySelector(".reader-nav")?.remove();
          cloneRoot?.querySelectorAll("[contenteditable]").forEach((node) => node.removeAttribute("contenteditable"));
          cloneRoot?.querySelectorAll(".resize-handle,.markup-point-handle,.rotate-handle,.flip-handle,.move-handle,.demo-popup-drag-handle,.demo-popup-resize-handle").forEach((node) => node.remove());
        }
      });
      return await new Promise((resolve, reject) => {
        canvas.toBlob(
          (blob) => blob ? resolve(blob) : reject(new Error("The browser could not create the PNG file.")),
          "image/png"
        );
      });
    }

    function downloadBlob(filename, blob) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function zipCrc32(bytes) {
      if (!zipCrc32.table) {
        zipCrc32.table = Array.from({ length: 256 }, (_, value) => {
          let crc = value;
          for (let bit = 0; bit < 8; bit += 1) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
          return crc >>> 0;
        });
      }
      let crc = 0xffffffff;
      for (const byte of bytes) crc = (crc >>> 8) ^ zipCrc32.table[(crc ^ byte) & 0xff];
      return (crc ^ 0xffffffff) >>> 0;
    }

    function zipHeader(length) {
      const bytes = new Uint8Array(length);
      return { bytes, view: new DataView(bytes.buffer) };
    }

    async function makeSlidePngZip(entries) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      const now = new Date();
      const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((Math.floor(now.getSeconds() / 2)) & 31);
      const dosDate = (((Math.max(1980, now.getFullYear()) - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);
      for (const entry of entries) {
        const name = encoder.encode(entry.name);
        const data = new Uint8Array(await entry.blob.arrayBuffer());
        const crc = zipCrc32(data);
        const local = zipHeader(30);
        local.view.setUint32(0, 0x04034b50, true);
        local.view.setUint16(4, 20, true);
        local.view.setUint16(6, 0x0800, true);
        local.view.setUint16(8, 0, true);
        local.view.setUint16(10, dosTime, true);
        local.view.setUint16(12, dosDate, true);
        local.view.setUint32(14, crc, true);
        local.view.setUint32(18, data.length, true);
        local.view.setUint32(22, data.length, true);
        local.view.setUint16(26, name.length, true);
        local.view.setUint16(28, 0, true);
        localParts.push(local.bytes, name, data);

        const central = zipHeader(46);
        central.view.setUint32(0, 0x02014b50, true);
        central.view.setUint16(4, 20, true);
        central.view.setUint16(6, 20, true);
        central.view.setUint16(8, 0x0800, true);
        central.view.setUint16(10, 0, true);
        central.view.setUint16(12, dosTime, true);
        central.view.setUint16(14, dosDate, true);
        central.view.setUint32(16, crc, true);
        central.view.setUint32(20, data.length, true);
        central.view.setUint32(24, data.length, true);
        central.view.setUint16(28, name.length, true);
        central.view.setUint16(30, 0, true);
        central.view.setUint16(32, 0, true);
        central.view.setUint16(34, 0, true);
        central.view.setUint16(36, 0, true);
        central.view.setUint32(38, 0, true);
        central.view.setUint32(42, offset, true);
        centralParts.push(central.bytes, name);
        offset += local.bytes.length + name.length + data.length;
      }
      const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
      const end = zipHeader(22);
      end.view.setUint32(0, 0x06054b50, true);
      end.view.setUint16(4, 0, true);
      end.view.setUint16(6, 0, true);
      end.view.setUint16(8, entries.length, true);
      end.view.setUint16(10, entries.length, true);
      end.view.setUint32(12, centralSize, true);
      end.view.setUint32(16, offset, true);
      end.view.setUint16(20, 0, true);
      return new Blob([...localParts, ...centralParts, end.bytes], { type: "application/zip" });
    }

    async function exportPng() {
      if (pngExportInProgress) {
        showToast("The slide PNG ZIP is already being prepared.");
        return;
      }
      pngExportInProgress = true;
      showToast(`Preparing ${state.tutorial.slides.length} slide PNG${state.tutorial.slides.length === 1 ? "" : "s"}…`);
      const originalUi = clone(state.ui);
      const baseName = slugify(state.meta.tutorialSlug || state.tutorial.title) || "demo";
      const pngEntries = [];
      let resultMessage = "";
      try {
        await waitForExportFonts();
        if (IS_PROJECT_APP) await saveProjectToDiskNow();
        for (let index = 0; index < state.tutorial.slides.length; index += 1) {
          const slide = state.tutorial.slides[index];
          state.ui.slideIndex = index;
          state.ui.activeHotspotId = slideIntroCard(slide) ? null : slide.hotspots[0]?.id || null;
          state.ui.selectedKind = null;
          state.ui.selectedId = null;
          state.ui.contentsOpen = false;
          state.ui.videoModalId = null;
          multiSelection = [];
          render();
          await playerVisualReadyPromise;
          await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          const slideElement = root.querySelector("[data-stage]");
          if (!slideElement) throw new Error(`Slide ${index + 1} was not available to render.`);
          const png = await elementAsPngBlob(slideElement, SCENE_WIDTH);
          pngEntries.push({ name: `${baseName}-slide-${String(index + 1).padStart(2, "0")}.png`, blob: png });
        }
        downloadBlob(`${baseName}-slides.zip`, await makeSlidePngZip(pngEntries));
        resultMessage = `Exported one ZIP containing ${state.tutorial.slides.length} slide PNG${state.tutorial.slides.length === 1 ? "" : "s"}.`;
      } catch (error) {
        resultMessage = `PNG export failed: ${error?.message || "unknown rendering error"}`;
      } finally {
        pngExportInProgress = false;
        state.ui = originalUi;
        render();
        showToast(resultMessage || "PNG export finished.", 8000);
      }
    }

    async function copyPublicUrl() {
      const value = publicUrl();
      if (!value) {
        showToast("Add a learning section and tutorial slug first.");
        return;
      }
      try {
        await navigator.clipboard.writeText(value);
      } catch (_) {
        const input = document.createElement("textarea");
        input.value = value;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.append(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }
      showToast("Copied the public social share URL.");
    }

    function download(filename, contents, type) {
      const blob = new Blob([contents], { type: `${type};charset=utf-8` });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  })();
  </script>

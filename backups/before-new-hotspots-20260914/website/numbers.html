  <style>
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-interface); }

    .document-card {
      box-shadow: none;
      min-height: 380px;
    }

    .document-card:hover,
    .document-card:focus-visible {
      box-shadow: 10px 10px 0 #000;
      outline: none;
    }

    .document-modal[data-open="false"],
    .document-overlay[data-open="false"] {
      display: none;
    }

    .document-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 0.75rem;
      perspective: 1200px;
    }

    .document-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(0, 0, 0, 0.72);
      animation: overlayReveal 760ms ease-out both;
    }

    .embed-shell {
      --document-width: min(74vw, 1380px);
      position: relative;
      width: min(96vw, 1760px);
      height: min(90vh, 940px);
      background: linear-gradient(115deg, #ffe7f7 0%, #f8efff 48%, #eaf9fb 100%);
      border: 4px solid #000;
      box-shadow: 10px 10px 0 #000;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
      transform-origin: center center;
      animation: shellBloom 1200ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .document-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 4;
      background: #ff90e7;
      color: #000;
      border: 4px solid #000;
      padding: 0.5rem 1rem;
      font-family: var(--font-interface);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 4px 4px 0 #000;
    }

    .document-close:hover,
    .document-close:focus-visible {
      background: #f1f332;
      outline: none;
    }

    .embed-stage {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: clamp(1rem, 3vw, 3.75rem);
      background: linear-gradient(115deg, #ffe7f7 0%, #f8efff 48%, #eaf9fb 100%);
      overflow: hidden;
    }

    .embed-frame {
      position: relative;
      display: block;
      width: var(--document-width);
      height: 100%;
      border: 0;
      background: #fff;
      opacity: 0;
      transform: translateY(18px);
      transform-origin: top center;
      transition: opacity 900ms ease, transform 900ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .embed-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(0.75rem, 2vw, 2rem);
      background: #fff;
      opacity: 1;
      transition: opacity 700ms ease, transform 700ms ease;
      z-index: 2;
    }

    .embed-loading-gif {
      display: block;
      width: min(100%, 1680px);
      max-height: calc(100% - 1rem);
      object-fit: contain;
      background: #fff;
      animation: loadingPulse 1500ms ease-in-out infinite;
    }

    .embed-shell[data-revealed="true"] .embed-frame {
      opacity: 1;
      transform: translateY(0);
    }

    .embed-shell[data-revealed="true"] .embed-loading {
      opacity: 0;
      transform: translateY(-12px);
      pointer-events: none;
    }

    .figma-slide-frame {
      display: block;
      max-width: 100%;
    }

    @keyframes overlayReveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes shellBloom {
      0% {
        opacity: 0;
        transform: translateY(32px);
        box-shadow: 0 0 0 0 #000;
      }
      55% {
        opacity: 1;
        transform: translateY(-6px);
        box-shadow: 10px 10px 0 #000;
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        box-shadow: 10px 10px 0 #000;
      }
    }

    @keyframes loadingPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .document-overlay,
      .embed-shell,
      .embed-loading-gif {
        animation: none;
      }

      .embed-frame,
      .embed-loading {
        transition: none;
      }
    }

    @media (max-width: 720px) {
      .document-modal {
        padding: 0.5rem;
      }

      .embed-shell {
        --document-width: 100%;
        width: calc(100vw - 1rem);
        height: calc(100vh - 1rem);
        box-shadow: 7px 7px 0 #000;
      }

      .document-close {
        top: 0.75rem;
        right: 0.75rem;
        padding: 0.45rem 0.75rem;
      }

      .embed-stage {
        padding: 0.75rem;
      }
    }
  </style>

  <script>
    (() => {
      const modal = document.querySelector("[data-document-modal]");
      const overlay = document.querySelector("[data-document-overlay]");
      const shell = document.querySelector("[data-document-shell]");
      const frame = document.querySelector("[data-document-frame]");
      const modalTitle = document.querySelector("[data-document-modal-title]");
      const openButtons = document.querySelectorAll("[data-open-document]");
      let revealTimer = null;

      function clearRevealTimer() {
        if (revealTimer) window.clearTimeout(revealTimer);
        revealTimer = null;
      }

      function revealFrame() {
        if (!shell || modal.getAttribute("data-open") !== "true") return;
        shell.setAttribute("data-revealed", "true");
      }

      function setOpen(open, url, title) {
        if (!modal || !overlay || !frame || !shell) return;
        clearRevealTimer();
        modal.setAttribute("data-open", open ? "true" : "false");
        overlay.setAttribute("data-open", open ? "true" : "false");
        modal.setAttribute("aria-hidden", open ? "false" : "true");
        shell.setAttribute("data-revealed", "false");
        document.body.style.overflow = open ? "hidden" : "";
        if (modalTitle && title) modalTitle.textContent = title;
        if (title) frame.setAttribute("title", title);
        frame.setAttribute("src", open ? url : "about:blank");
        if (open) revealTimer = window.setTimeout(revealFrame, 1500);
      }

      frame.addEventListener("load", () => {
        if (modal && modal.getAttribute("data-open") === "true") {
          clearRevealTimer();
          revealTimer = window.setTimeout(revealFrame, 800);
        }
      });

      openButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setOpen(true, button.dataset.documentUrl, button.dataset.documentTitle || "Numbers");
        });
      });

      document.addEventListener("click", (event) => {
        const closeButton = event.target && event.target.closest ? event.target.closest("[data-close-document]") : null;
        if (closeButton) setOpen(false);
        if (event.target && event.target.matches && event.target.matches("[data-document-overlay]")) setOpen(false);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setOpen(false);
      });
    })();
  </script>
